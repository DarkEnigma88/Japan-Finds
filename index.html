  // Trap keyboard focus in modals for accessibility
  function trapModalFocus() {
    var modal = document.querySelector(".jf-modal");
    if (!modal) return;
    // Disabled controls cannot take focus, so including them broke the Tab
    // wrap whenever the first or last focusable happened to be disabled.
    var focusables = modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];

    modal.onkeydown = function(e) {
      if (e.key === "Tab") {
        if (e.shiftKey) {
          if (document.activeElement === first) { last.focus(); e.preventDefault(); }
        } else {
          if (document.activeElement === last) { first.focus(); e.preventDefault(); }
        }
      }
    };
  }

  // ---------- photo drag & reorder handlers ----------

  window.handleDropzoneDragOver = function(e) {
    e.preventDefault();
    e.stopPropagation();
    var dz = document.getElementById("photo-dropzone");
    if (dz) dz.classList.add("drag-over");
  };

  window.handleDropzoneDragLeave = function(e) {
    e.preventDefault();
    e.stopPropagation();
    var dz = document.getElementById("photo-dropzone");
    if (dz) dz.classList.remove("drag-over");
  };

  function droppedImageUrls(dataTransfer) {
    var urls = [];
    try {
      var uri = dataTransfer.getData("text/uri-list");
      if (uri) urls = urls.concat(uri.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(function(x){ return /^https?:\/\//i.test(x); }));
    } catch (e) {}
    try {
      var html = dataTransfer.getData("text/html");
      if (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        Array.from(doc.images || []).forEach(function(img){
          var src = img.currentSrc || img.src || img.getAttribute("src");
          if (src && /^https?:\/\//i.test(src) && urls.indexOf(src) === -1) urls.push(src);
        });
      }
    } catch (e) {}
    return urls;
  }
  function fetchDroppedImages(urls) {
    return Promise.allSettled(urls.map(function(url){
      return fetch(url, {mode:"cors"}).then(function(r){ if(!r.ok) throw new Error("Could not fetch image"); return r.blob(); }).then(function(blob){
        if(!blob.type || blob.type.indexOf("image/")!==0) throw new Error("Not an image");
        var ext=(blob.type.split("/")[1]||"png").replace("jpeg","jpg");
        return new File([blob], "dropped-image."+ext, {type:blob.type});
      });
    })).then(function(rs){ return rs.filter(function(r){return r.status==="fulfilled";}).map(function(r){return r.value;}); });
  }
  window.handleDropzoneDrop = function(e) {
    e.preventDefault(); e.stopPropagation();
    var dz=document.getElementById("photo-dropzone"); if(dz) dz.classList.remove("drag-over");
    var files=Array.from(e.dataTransfer.files||[]);
    if(files.length){processUploadedFiles(files);return;}
    var urls=droppedImageUrls(e.dataTransfer);
    if(!urls.length){state.imageError="This website did not provide an accessible image. Try dragging the image itself or save it first.";rerenderModalOnly();return;}
    fetchDroppedImages(urls).then(function(fetched){
      if(fetched.length) processUploadedFiles(fetched);
      else {state.imageError="The dropped website image could not be accessed by the browser. Try saving the image first.";rerenderModalOnly();}
    });
  };

  window.onPhotoDragStart = function(e, idx) {
    state.draggedPhotoIdx = idx;
    e.dataTransfer.effectAllowed = "move";
  };

  window.onPhotoDragOver = function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
  };

  window.onPhotoDrop = function(e, targetIdx) {
    e.preventDefault();
    var srcIdx = state.draggedPhotoIdx;
    if (srcIdx === null || srcIdx === undefined || srcIdx === targetIdx) return;
    readFormFromDOM();
    var photos = state.form.photos;
    var item = photos.splice(srcIdx, 1)[0];
    photos.splice(targetIdx, 0, item);
    state.draggedPhotoIdx = null;
    render();
  };

  window.setPhotoAsCover = function(idx) {
    readFormFromDOM();
    if (idx <= 0 || idx >= state.form.photos.length) return;
    var photos = state.form.photos;
    var cover = photos.splice(idx, 1)[0];
    photos.unshift(cover);
    render();
  };

  function processUploadedFiles(files) {
    readFormFromDOM();
    var promises = files.map(function(file) {
      if (!isSvgFile(file) && (!file.type || file.type.indexOf("image/") !== 0)) return Promise.reject("Invalid file type");
      return compressImageOffThread(file);
    });

    Promise.allSettled(promises).then(function(results) {
      // The form may have been closed while compression was still running.
      if (!state.form) return;
      // Re-read the fields: anything typed while compression was running
      // would otherwise be discarded by the render below, which rebuilds
      // every input from state.
      readFormFromDOM();
      var failed = 0;
      results.forEach(function(res) {
        if (res.status === "fulfilled") state.form.photos.push(res.value);
        else failed++;
      });
      state.imageError = failed ? (failed + " photo(s) could not be added.") : null;
      render();
    });
  }

  // Check if coordinates match existing entries
  function checkForNearbyDuplicates(lat, lng) {
    var latNum = Number(lat), lngNum = Number(lng);
    if (!Number.isFinite(latNum) || !Number.isFinite(lngNum)) return null;
    var currentId = state.form ? state.form.id : null;

    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.id === currentId) continue;
      var eLat = entryLat(e), eLng = entryLng(e);
      if (Number.isFinite(eLat) && Number.isFinite(eLng)) {
        var dist = getDistanceKm(latNum, lngNum, eLat, eLng);
        if (dist < 0.05) { // within 50 meters
          return 'There\'s already a find near this location: "' + e.title + '" (' + Math.round(dist * 1000) + 'm away)';
        }
      }
    }
    return null;
  }

  // ---------- bulk actions ----------

  window.toggleBulkMode = function() {
    state.bulkMode = !state.bulkMode;
    state.selectedIds = {};
    state.lastSelectedId = null;
    state.bulkLinkPrompt = null;
    render();
  };

  // Toggling a checkbox used to rebuild the entire page (and re-decode every
  // photo). Update just the affected row and the counter instead.
  // Shift+click selects every visible entry between the last clicked one and
  // this one, in the order they are shown. A plain click toggles one.
  window.toggleSelectCard = function(id, ev) {
    if (ev && ev.shiftKey && state.lastSelectedId && state.lastSelectedId !== id) {
      var order = getFilteredEntries().map(function (e) { return e.id; });
      var a = order.indexOf(state.lastSelectedId), b = order.indexOf(id);
      if (a !== -1 && b !== -1) {
        var from = Math.min(a, b), to = Math.max(a, b);
        for (var i = from; i <= to; i++) state.selectedIds[order[i]] = true;
        state.lastSelectedId = id;
        syncSelectionDom();
        updateBulkBarCount();
        return;
      }
    }
    state.selectedIds[id] = !state.selectedIds[id];
    state.lastSelectedId = id;
    syncSelectionDom();
    updateBulkBarCount();
  };
  function syncSelectionDom() {
    // The Print products button lives in the toolbar, which is not rebuilt on
    // selection changes, so its state is refreshed here.
    var pp = document.querySelector('button[onclick="printProducts()"]');
    if (pp) pp.disabled = !screenHasProducts();
    Array.prototype.forEach.call(document.querySelectorAll('[data-entry-id]'), function(node) {
      var selected = !!state.selectedIds[node.getAttribute("data-entry-id")];
      node.classList.toggle("selected", selected);
      var box = node.querySelector('input[type="checkbox"]');
      if (box) box.checked = selected;
    });
  }

  function selectedEntryIds() {
    var live = {};
    state.entries.forEach(function(e) { live[e.id] = true; });
    return Object.keys(state.selectedIds).filter(function(k) { return state.selectedIds[k] && live[k]; });
  }

  function pruneSelectedIds() {
    var live = {};
    state.entries.forEach(function(e) { live[e.id] = true; });
    Object.keys(state.selectedIds).forEach(function(k) { if (!live[k]) delete state.selectedIds[k]; });
  }

  // The bar is rebuilt in place (not the whole page) because its buttons
  // depend on what is ticked - the link button changes with the mix of
  // places and items - and a full render would re-decode every photo.
  function updateBulkBarCount() {
    var bar = document.querySelector(".jf-bulk-bar");
    if (!bar) return;
    var holder = document.createElement("div");
    holder.innerHTML = renderBulkBar();
    if (holder.firstElementChild) bar.replaceWith(holder.firstElementChild);
  }

  window.bulkSelectAll = function() {
    getFilteredEntries().forEach(function(e) { state.selectedIds[e.id] = true; });
    renderGridSection();
    updateBulkBarCount();
  };

  window.bulkDeselectAll = function() {
    state.selectedIds = {};
    renderGridSection();
    updateBulkBarCount();
  };

  window.confirmBulkDelete = function() {
    if (!selectedEntryIds().length) return;
    state.bulkDeleteConfirm = true;
    render();
  };
  window.cancelBulkDelete = function() {
    state.bulkDeleteConfirm = false;
    render();
  };
  window.bulkDeleteSelected = function() {
    var ids = selectedEntryIds();
    state.bulkDeleteConfirm = false;
    if (!ids.length) return;
    state.entries = state.entries.filter(function(e) { return !state.selectedIds[e.id]; });
    state.selectedIds = {};
    purgeOrphanedRecords();
    persistEntries();
    render();
  };

  // Items use tried / want-to-try; places use visited / want-to-go. Applying a
  // place status to an item produced entries no filter could match.
  function statusForType(status, type) {
    if (type === "item") return status === "visited" ? "tried" : (status === "want-to-go" ? "want-to-try" : status);
    return status === "tried" ? "visited" : (status === "want-to-try" ? "want-to-go" : status);
  }

  window.bulkSetStatus = function(status) {
    var ids = selectedEntryIds();
    if (!ids.length) return;
    state.entries.forEach(function(e) {
      if (state.selectedIds[e.id]) e.status = statusForType(status, e.type || "place");
    });
    persistEntries();
    render();
  };

  window.startBulkTagPrompt = function() {
    if (!selectedEntryIds().length) return;
    state.bulkTagPromptOpen = true;
    state.bulkTagDraft = "";
    render();
    setTimeout(function() { var el = document.getElementById("bulk-tag-input"); if (el) el.focus(); }, 0);
  };
  window.cancelBulkTagPrompt = function() {
    state.bulkTagPromptOpen = false;
    state.bulkTagDraft = "";
    render();
  };
  window.bulkAddTagConfirm = function() {
    var ids = selectedEntryIds();
    var el = document.getElementById("bulk-tag-input");
    var tag = el ? el.value : state.bulkTagDraft;
    state.bulkTagPromptOpen = false;
    state.bulkTagDraft = "";
    if (!ids.length || !tag || !tag.trim()) { render(); return; }
    var trimmed = tag.trim();
    state.entries.forEach(function(e) {
      if (state.selectedIds[e.id]) {
        if (!e.tags) e.tags = [];
        if (!e.tags.some(function(t) { return t.toLowerCase() === trimmed.toLowerCase(); })) {
          e.tags.push(trimmed);
        }
      }
    });
    persistEntries();
    render();
  };

  // ---------- actions ----------

  // Google Maps state. The API is loaded after this script with a callback.
  var googleMapsLoaded = false;
  var googleMap = null;
  var googleMapMarkers = [];
  var googleMapInfoWindow = null;
  var googleMapPicker = null;
  var googleMapPickerMarker = null;
  var googleMapGeocoder = null;

  // Cost-safety guardrails: geocoding/search requests are deliberately capped
  // per browser-day. Normal use should stay far below these limits, while an
  // accidental loop cannot generate an unbounded stream of billable requests.
  var GEOCODE_DAILY_LIMIT = 40;
  var REVERSE_GEOCODE_DAILY_LIMIT = 60;
  // Places Text Search is a separate, more expensive SKU than Geocoding: asking
  // for displayName (the whole reason we call it) puts the request in the Pro
  // tier, whose free allowance is 5,000 calls a month rather than 10,000.
  // The two caps do different jobs, and only because the daily one is loose
  // enough to reach the monthly one: 500/day tops out at ~15,500 a month, so
  // the monthly cap is what actually binds. The daily cap is the circuit
  // breaker for a runaway loop; the monthly cap is what keeps the total under
  // Google's free allowance.
  var PLACES_DAILY_LIMIT = 500;
  var PLACES_MONTHLY_LIMIT = 4000;
  var GEOCODE_USAGE_KEY = "japan-finds-google-geocode-usage-v1";
  // Monthly counters live under their own key so clearing one does not reset
  // the other, and so the daily record can roll over without losing the month.
  var PLACES_MONTH_USAGE_KEY = "japan-finds-google-places-month-v1";

  function entriesWithCoords() {
    return state.entries.filter(hasCoords);
  }

  function todayKey() {
    return new Date().toISOString().slice(0,10);
  }

  // Google's free allowances reset on the first of the calendar month, so the
  // monthly counter is keyed the same way rather than on a rolling 30 days.
  function monthKey() {
    return new Date().toISOString().slice(0,7);
  }

  function getGoogleUsage() {
    try {
      var raw = localStorage.getItem(GEOCODE_USAGE_KEY);
      var data = raw ? JSON.parse(raw) : null;
      if (!data || data.date !== todayKey()) data = { date: todayKey(), search: 0, reverse: 0, places: 0 };
      if (typeof data.places !== "number") data.places = 0;
      return data;
    } catch (e) {
      return { date: todayKey(), search: 0, reverse: 0, places: 0 };
    }
  }

  function getPlacesMonthUsage() {
    try {
      var raw = localStorage.getItem(PLACES_MONTH_USAGE_KEY);
      var data = raw ? JSON.parse(raw) : null;
      if (!data || data.month !== monthKey()) data = { month: monthKey(), places: 0 };
      return data;
    } catch (e) {
      return { month: monthKey(), places: 0 };
    }
  }

  function bumpGoogleUsage(kind) {
    var data = getGoogleUsage();
    data[kind] = Number(data[kind] || 0) + 1;
    try { localStorage.setItem(GEOCODE_USAGE_KEY, JSON.stringify(data)); } catch (e) {}
    if (kind === "places") {
      var m = getPlacesMonthUsage();
      m.places = Number(m.places || 0) + 1;
      try { localStorage.setItem(PLACES_MONTH_USAGE_KEY, JSON.stringify(m)); } catch (e) {}
    }
    return data[kind];
  }

  function canUseGoogleGeocoder(kind) {
    var data = getGoogleUsage();
    var limit = kind === "reverse" ? REVERSE_GEOCODE_DAILY_LIMIT : GEOCODE_DAILY_LIMIT;
    return Number(data[kind] || 0) < limit;
  }

  // Both caps must pass. Returns a reason string when blocked so the UI can say
  // which one was hit rather than showing a generic failure.
  function placesBlockedReason() {
    if (Number(getGoogleUsage().places || 0) >= PLACES_DAILY_LIMIT) {
      return "Daily place-name search limit reached (" + PLACES_DAILY_LIMIT + "). Address search still works, and it resets tomorrow.";
    }
    if (Number(getPlacesMonthUsage().places || 0) >= PLACES_MONTHLY_LIMIT) {
      return "Monthly place-name search limit reached (" + PLACES_MONTHLY_LIMIT + "). This cap sits below Google's free allowance so you are not billed. Address search still works.";
    }
    return null;
  }

  function placesUsageSummary() {
    var d = Number(getGoogleUsage().places || 0);
    var m = Number(getPlacesMonthUsage().places || 0);
    return "Name searches: " + d + "/" + PLACES_DAILY_LIMIT + " today, " + m + "/" + PLACES_MONTHLY_LIMIT + " this month.";
  }

  function googleMapStyles() {
    if (state.theme !== "dark") return [];
    return [
      { elementType: "geometry", stylers: [{ color: "#24272d" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#24272d" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#d9d4ca" }] },
      { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#4a4f59" }] },
      { featureType: "poi", elementType: "geometry", stylers: [{ color: "#2b2f36" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#3b3f47" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#292c32" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#c5c0b7" }] },
      { featureType: "transit", elementType: "geometry", stylers: [{ color: "#30343b" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#171a1f" }] },
      { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#8f9aaa" }] }
    ];
  }

  // Detaches the pins from the map without discarding the map instance itself.
  // Kept separate from destroyGoogleMap() because swapping which pins are shown
  // must NOT cost another Dynamic Maps billable event.
  function clearGoogleMapMarkers() {
    googleMapMarkers.forEach(function (marker) {
      clearMapsListeners(marker);
      if (marker && typeof marker.setMap === "function") marker.setMap(null);
    });
    googleMapMarkers = [];
    if (googleMapInfoWindow && typeof googleMapInfoWindow.close === "function") googleMapInfoWindow.close();
    clearFenceOverlay();
  }

  // The shape that shows where the ringfence is. Detached and rebuilt alongside
  // the pins, so it can never linger over a map whose fence has been cleared.
  var googleFenceOverlay = null;

  function clearFenceOverlay() {
    if (googleFenceOverlay && typeof googleFenceOverlay.setMap === "function") googleFenceOverlay.setMap(null);
    googleFenceOverlay = null;
  }

  function drawFenceOverlay(map) {
    clearFenceOverlay();
    var f = state.geoFence;
    if (!f || !map || !window.google || !google.maps) return;
    var style = {
      map: map,
      strokeColor: "#2C4468", strokeOpacity: 0.9, strokeWeight: 2,
      fillColor: "#2C4468", fillOpacity: 0.06,
      clickable: false
    };
    if (f.mode === "box") {
      googleFenceOverlay = new google.maps.Rectangle(Object.assign({}, style, {
        bounds: { north: f.north, south: f.south, east: f.east, west: f.west }
      }));
    } else if (Number.isFinite(f.lat) && Number.isFinite(f.lng) && Number.isFinite(f.radiusKm)) {
      // A cluster fence is a membership list, not a circle, so its circle is
      // drawn dashed-soft to show roughly where it sits without implying that
      // everything inside the ring is included.
      googleFenceOverlay = new google.maps.Circle(Object.assign({}, style, {
        center: { lat: f.lat, lng: f.lng },
        radius: f.radiusKm * 1000,
        strokeOpacity: f.mode === "cluster" ? 0.5 : 0.9,
        fillOpacity: f.mode === "cluster" ? 0.04 : 0.06
      }));
    }
  }

  // Zooms to whatever the fence covers, so applying one always shows its result.
  function fitMapToFence() {
    setTimeout(function () {
      if (!googleMap || !googleFenceOverlay) return;
      var b = null;
      if (typeof googleFenceOverlay.getBounds === "function") b = googleFenceOverlay.getBounds();
      if (b) googleMap.fitBounds(b, { top: 40, right: 40, bottom: 40, left: 40 });
    }, 60);
  }

  // Google Maps objects keep their event listeners (and the closures those
  // listeners capture) alive until clearInstanceListeners is called, so every
  // teardown path releases them explicitly rather than relying on GC.
  function clearMapsListeners(obj) {
    if (obj && window.google && google.maps && google.maps.event &&
        typeof google.maps.event.clearInstanceListeners === "function") {
      google.maps.event.clearInstanceListeners(obj);
    }
  }

  // The one teardown for the picker map and its marker, shared by every path
  // that used to null these two variables by hand.
  function dropPickerMapInstance() {
    clearMapsListeners(googleMapPickerMarker);
    if (googleMapPickerMarker && typeof googleMapPickerMarker.setMap === "function") googleMapPickerMarker.setMap(null);
    googleMapPickerMarker = null;
    clearMapsListeners(googleMapPicker);
    googleMapPicker = null;
  }

  function destroyGoogleMap() {
    clearGoogleMapMarkers();
    googleMapInfoWindow = null;
    clearMapsListeners(googleMap);
    googleMap = null;
    dropPickerMapInstance();
  }

  function buildMarkerPopup(entry) {
    var cat = categoryMeta(primaryCategory(entry));
    var linkedItems = itemsForPlace(entry.id);
    var linkedItemsHtml = linkedItems.length
      ? '<div class="jf-popup-items"><span class="jf-popup-label">Items</span>' + linkedItems.map(function (it) {
          return '<button type="button" class="jf-popup-chip" onclick="toggleMapItemFilter(' + escAttrJs(it.id) + ')">' + esc(it.title) + '</button>';
        }).join("") + '</div>'
      : "";
    var lat = entryLat(entry), lng = entryLng(entry);
    var directionsUrl = "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;
    return '<div class="jf-popup">' +
      '<strong class="jf-popup-title">' + esc(entry.title) + '</strong>' +
      '<div class="jf-popup-meta">' + esc(cat.icon || '') + ' ' + esc(cat.label) +
      (entry.city ? ' \u00b7 ' + esc(entry.city) : '') + '</div>' +
      linkedItemsHtml +
      '<div class="jf-popup-actions">' +
      '<button type="button" class="jf-popup-btn" onclick="openView(' + escAttrJs(entry.id) + ')">View entry</button>' +
      '<a class="jf-popup-btn" href="' + esc(directionsUrl) + '" target="_blank" rel="noopener noreferrer">Directions \u2197</a>' +
      '</div></div>';
  }

  // Pins that are on the map only because of an item filter look different, so a
  // layered map can be read at a glance.
  // Marker geometry and colours, shared with the legend so the two agree.
  var PIN_PATH = "M 0 0 C -2 -8 -11 -12 -11 -22 A 11 11 0 1 1 11 -22 C 11 -12 2 -8 0 0 Z";
  var PIN_COLOR = "#FF1E3C";        // vibrant red
  var DIAMOND_ITEM_COLOR = "#FFD400"; // yellow: here only because of an item filter
  var DIAMOND_BOTH_COLOR = "#FF8A1F"; // orange: matched place filters and carries a filtered item
  function markerIconForReason(reason) {
    if (reason !== "item" && reason !== "both") {
      return {
        path: PIN_PATH,
        scale: 1.15,
        fillColor: PIN_COLOR,
        fillOpacity: 1,
        strokeColor: "#ffffff",
        strokeWeight: 1.5,
        anchor: new google.maps.Point(0, 0)
      };
    }
    // A diamond reads as "not a pin" at a glance, and its corners survive
    // small sizes better than a circle does.
    return {
      path: "M 0 -12 L 11 0 L 0 12 L -11 0 Z",
      scale: 1,
      fillColor: reason === "both" ? DIAMOND_BOTH_COLOR : DIAMOND_ITEM_COLOR,
      fillOpacity: 1,
      strokeColor: "#ffffff",
      strokeWeight: 2,
      anchor: new google.maps.Point(0, 0)
    };
  }

  function makeGoogleMarker(entry, map) {
    var lat = entryLat(entry), lng = entryLng(entry);
    var options = {
      position: { lat: lat, lng: lng },
      map: map,
      title: entry.title || ""
    };
    var icon = markerIconForReason(mapPinReasons[entry.id]);
    if (icon) options.icon = icon;
    var marker = new google.maps.Marker(options);
    marker.addListener("click", function () {
      if (!googleMapInfoWindow) googleMapInfoWindow = new google.maps.InfoWindow();
      googleMapInfoWindow.setContent(buildMarkerPopup(entry));
      googleMapInfoWindow.open({ map: map, anchor: marker });
    });
    googleMapMarkers.push(marker);
    return marker;
  }

  // Applies the current filters and paints the resulting pins onto an EXISTING
  // map instance. Creating the map is the billable part, so this is deliberately
  // callable on a map that is already on screen.
  function drawMapMarkers(map, focusId) {
    var points = getMapPlacePoints();
    var bounds = new google.maps.LatLngBounds();
    var focusMarker = null;

    drawFenceOverlay(map);

    points.forEach(function (entry) {
      var lat = entryLat(entry), lng = entryLng(entry);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      var marker = makeGoogleMarker(entry, map);
      // Preserve the app's category-colored visual pin using a DOM overlay-like
      // marker icon. The classic Marker API accepts inline SVG data URLs and
      // avoids requiring a production Map ID just for this personal app.
      // Pins that are here because of an item filter ("item"/"both") already
      // received their legend icon inside makeGoogleMarker; overwriting them
      // here made the map legend describe colours that never appeared.
      var reason = mapPinReasons[entry.id];
      if (reason !== "item" && reason !== "both") marker.setIcon({
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30">' +
          '<path d="M12 29S3 19.8 3 11A9 9 0 1 1 21 11c0 8.8-9 18-9 18z" fill="'+mapMarkerColor(entry)+'" stroke="#ffffff" stroke-width="1.5"/>' +
          '<circle cx="12" cy="11" r="3.2" fill="#ffffff"/>' +
          '</svg>'
        ),
        scaledSize: new google.maps.Size(24, 30),
        anchor: new google.maps.Point(12, 29)
      });
      bounds.extend({ lat: lat, lng: lng });
      if (entry.id === focusId) focusMarker = marker;
    });

    return { points: points, bounds: bounds, focusMarker: focusMarker };
  }

  // Swaps the pins on the live map instead of rebuilding it. Every filter,
  // search keystroke and sort change used to run initMap(), and initMap() calls
  // new google.maps.Map() - one billable Dynamic Maps event each time. Returns
  // false when no reusable map is on screen, so the caller can fall back.
  function updateMapMarkersOnly(focusId) {
    if (!googleMapsLoaded || !window.google || !google.maps) return false;
    if (!googleMap || typeof googleMap.getDiv !== "function") return false;
    var el = document.getElementById('japan-map');
    // A full render() replaces the map container, which orphans the live map
    // from the visible DOM. That case genuinely needs a rebuild.
    if (!el || googleMap.getDiv() !== el) return false;

    clearGoogleMapMarkers();
    var drawn = drawMapMarkers(googleMap, focusId);

    if (focusId) {
      var focusEntry = state.entries.find(function (e) { return e.id === focusId; }) || null;
      var focusLat = entryLat(focusEntry), focusLng = entryLng(focusEntry);
      if (Number.isFinite(focusLat) && Number.isFinite(focusLng)) {
        googleMap.setCenter({ lat: focusLat, lng: focusLng });
        googleMap.setZoom(16);
        if (drawn.focusMarker) google.maps.event.trigger(drawn.focusMarker, "click");
      }
      // Focus is a one-shot request, same as in initMap().
      state.mapFocusId = null;
    }
    // With no focus the current pan and zoom are left untouched, matching what
    // initMap() did with prevCenter - filtering should not move the viewport.
    return true;
  }

  function initMap(focusId) {
    if (!googleMapsLoaded || !window.google || !google.maps) return;
    var el = document.getElementById('japan-map');
    if (!el) return;

    // Preserve wherever the user had panned/zoomed to. Every save, filter
    // change and status-message timeout rebuilds this map, and without this
    // the view snapped back to the whole of Japan each time.
    var prevCenter = null, prevZoom = null;
    if (googleMap && typeof googleMap.getCenter === "function") {
      var c = googleMap.getCenter();
      if (c) { prevCenter = { lat: c.lat(), lng: c.lng() }; prevZoom = googleMap.getZoom(); }
    }
    destroyGoogleMap();

    var focusEntry = focusId ? state.entries.find(function (e) { return e.id === focusId; }) || null : null;
    var focusLat = entryLat(focusEntry);
    var focusLng = entryLng(focusEntry);
    var hasFocus = focusEntry && Number.isFinite(focusLat) && Number.isFinite(focusLng);
    var initialCenter = hasFocus ? { lat: focusLat, lng: focusLng } : { lat: 36.2048, lng: 138.2529 };
    var initialZoom = hasFocus ? 16 : 5;

    googleMap = new google.maps.Map(el, {
      center: initialCenter,
      zoom: initialZoom,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: true,
      styles: googleMapStyles()
    });

    // One listener for the life of this map instance. It checks the drawing
    // flag at click time rather than being added and removed, so a re-render
    // cannot leave a stale handler behind.
    googleMap.addListener("click", function (ev) {
      if (!state.fenceBoxDrawing || !ev || !ev.latLng) return;
      handleBoxDrawClick(ev.latLng.lat(), ev.latLng.lng());
    });

    var drawn = drawMapMarkers(googleMap, focusId);
    var points = drawn.points;
    var bounds = drawn.bounds;
    var focusMarker = drawn.focusMarker;

    if (hasFocus) {
      googleMap.setCenter({ lat: focusLat, lng: focusLng });
      googleMap.setZoom(16);
      if (focusMarker) {
        google.maps.event.trigger(focusMarker, "click");
      }
      // Focus is a one-shot request. Leaving it set meant every later redraw
      // re-centred the map and re-opened the same popup.
      state.mapFocusId = null;
    } else if (prevCenter) {
      googleMap.setCenter(prevCenter);
      googleMap.setZoom(prevZoom);
    } else if (points.length === 1) {
      googleMap.setCenter(bounds.getCenter());
      googleMap.setZoom(14);
    } else if (points.length > 1) {
      googleMap.fitBounds(bounds, { top: 30, right: 30, bottom: 30, left: 30 });
    }
  }

  function renderMapPickerEmbed() {
    var pickLat = state.form ? coord(state.form.latitude, 90) : NaN;
    var pickLng = state.form ? coord(state.form.longitude, 180) : NaN;
    var coords = Number.isFinite(pickLat) && Number.isFinite(pickLng) ? state.form.latitude + ", " + state.form.longitude : "Click the map to place a pin";

        '<p class="jf-map-help">' + esc(offlineReasonText()) +

        '<div class="jf-map-search-row">' +
        '<input id="manual-lat-input" type="text" inputmode="decimal" placeholder="Latitude, e.g. 35.66958" value="' + esc(Number.isFinite(pickLat) ? state.form.latitude : "") + '">' +
        '<input id="manual-lng-input" type="text" inputmode="decimal" placeholder="Longitude, e.g. 139.70057" value="' + esc(Number.isFinite(pickLng) ? state.form.longitude : "") + '">' +
        '<button type="button" class="btn btn-outline" onclick="applyManualCoordinates()">Set pin</button>' +

        (state.duplicateWarning ? '<p class="jf-form-warning">\u26a0\ufe0f ' + esc(state.duplicateWarning) + '</p>' : '') +
        '<div class="jf-form-actions" style="padding-top:0"><button type="button" class="btn btn-outline" onclick="cancelMapPicker()">Cancel</button><button type="button" class="btn btn-primary" onclick="confirmMapPicker()">Use this location</button></div>' +
        '</div>';
    }

    return '<div class="jf-map-picker-box">' +
      '<p class="jf-map-subtitle" id="map-picker-coords" style="margin:0">' + esc(coords) + '</p>' +
      '<div class="jf-map-search" style="margin:0;padding:0;border:none;background:none"><label for="map-search-input">Search for a place or address</label><div class="jf-map-search-row"><input id="map-search-input" type="text" value="' + esc(query) + '" placeholder="e.g. Sushi Hashimoto, Ginza" onkeydown="if(event.key===\'Enter\'){event.preventDefault();searchMapLocation();}"><button type="button" class="btn btn-outline" onclick="searchMapLocation()">Search</button></div><p class="jf-map-help">Searches business names first, then falls back to plain addresses. Manual (not autocomplete) to keep API usage predictable \u2014 you can also click the map.</p><div id="map-picker-feedback">' + renderMapPickerFeedback() + '</div></div>' +
      '<div id="japan-map-picker" class="jf-map jf-map-embed"></div>' +
      '<p class="jf-map-help">Click anywhere on the map to place the pin.</p>' +
      '<div class="jf-form-actions" style="padding-top:0"><button type="button" class="btn btn-outline" onclick="cancelMapPicker()">Cancel</button><button type="button" class="btn btn-primary" onclick="confirmMapPicker()">Use this location</button></div>' +
      '</div>';
  }

  function renderMapPickerFeedback() {
    var status = state.mapSearchLoading
      ? '<p class="jf-map-help">Searching...</p>'
      : (state.mapSearchError ? '<p class="jf-form-error">' + esc(state.mapSearchError) + '</p>' : '');

  function syncPickerAddressFields() {

    var cityEl = document.getElementById("field-city");

  function reverseGeocodePickerLocation(lat, lng) {
    if (!state.form || !googleMapGeocoder) return;
    if (!canUseGoogleGeocoder("reverse")) {
      state.mapSearchError = "Daily location-lookup safety limit reached. The coordinates were kept.";
      updateMapPickerFeedback();
      return;
    }

  window.searchMapLocation = function () {
    readFormFromDOM();

      updateMapPickerFeedback();
      return;
    }
    var input = document.getElementById("map-search-input");
    var query = input ? input.value.trim() : "";
    if (!query) { state.mapSearchError = "Enter a place or address to search."; updateMapPickerFeedback(); return; }
    state.mapSearchQuery = query;
    state.mapSearchLoading = true;
    state.mapSearchError = null;

    // A repeated search costs nothing. The cache is checked before any cap, so
    // re-opening a place you already looked up never consumes allowance.
    var cached = geocodeCache[query.toLowerCase()];
    if (cached) {
      state.mapSearchResults = cached;
      state.mapSearchLoading = false;
      updateMapPickerFeedback();
      return;
    }
    if (!googleMapsLoaded || !google.maps) {
      state.mapSearchLoading = false;
      state.mapSearchError = "Google Maps is still loading. Please try again in a moment.";
      updateMapPickerFeedback();
      return;

    // names. Geocoding is the fallback, and it is genuinely a fallback rather
    // than a failure: an address query resolves fine there.

      JSON.stringify({ version: 8, entries: state.entries, lists: state.lists, products: state.products, relationships: state.relationships, categories: state.categories, notes: state.notes }, null, 2),
      "application/json", "japan-finds-backup-" + stamp + ".json");
    var includeCsv = !!(document.getElementById("backup-include-csv") || {}).checked;
    var backupPhotoNote = "";
    if (includeCsv) {
      downloadFile(combinedCsv(state.entries, state.products || [], state.notes || []), "text/csv;charset=utf-8", "japan-finds-backup-" + stamp + ".csv");
      downloadFile(categorySchemaCsv(state.categories), "text/csv;charset=utf-8", "japan-finds-backup-" + stamp + "-categories.csv");
      // Without this the CSV copy would name photo files that were never
      // downloaded, and re-importing it would find nothing to attach. The
      // JSON alongside it already holds the images either way.
      backupPhotoNote = downloadPhotoZip(state.entries, state.products, "japan-finds-backup-" + stamp + "-photos.zip");
    }
    state.importMessage = (includeCsv ? "JSON and CSV backups downloaded." : "Backup downloaded.") + backupPhotoNote;
    closeModal();
    scheduleClearImportMessage();
  };

  window.confirmRestoreBackup = function () {
    if (!state.backupInfo) return;
    state.backupRestoreConfirm = true;
    render();
  };
  window.cancelRestoreBackup = function () {
    state.backupRestoreConfirm = false;
    render();
  };
  window.restoreLastBackup = function () {
    if (!state.backupInfo) return;
    state.backupRestoreConfirm = false;
    state.backupWorking = true;
    state.backupError = null;
    render();
    dbGetBackup().then(function(backup) {
      if (!backup || !Array.isArray(backup.entries)) throw new Error("No backup");
      // Lists get the same normalisation as entries and products, so a
      // snapshot taken before days/ordering existed cannot restore lists the
      // itinerary code would then trip over.
      state.lists = Array.isArray(backup.lists) ? backup.lists.map(normalizeList).filter(Boolean) : state.lists;
      // Snapshots taken before the rename stored these under "bottles".
      var backupProducts = Array.isArray(backup.products) ? backup.products : (Array.isArray(backup.bottles) ? backup.bottles : null);
      state.products = backupProducts ? backupProducts.map(normalizeProduct).filter(Boolean) : state.products;
      state.relationships = Array.isArray(backup.relationships) ? backup.relationships : state.relationships;
      if (Array.isArray(backup.notes)) state.notes = backup.notes.map(normalizeNote).filter(Boolean);
      if (Array.isArray(backup.categories) && backup.categories.length) {
        var restoredCats = backup.categories.map(normalizeCategory).filter(Boolean);
        if (restoredCats.length) { state.categories = restoredCats; syncCategoryIndexes(); }
      }
      state.entries = backup.entries.map(function(e) {
        if (e.status === undefined) e.status = "";
        if (e.visitedDate === undefined) e.visitedDate = "";
        return normalizeEntry(e);
      });
      storageBytesDirty = true;
      pruneSelectedIds();
      return Promise.all([dbSaveAll(state.entries), dbSaveAllLists(state.lists), dbSaveAllProducts(state.products), dbSaveAllRelationships(state.relationships), dbSaveAllCategories(state.categories)]).then(function() {
        cloudLocalChanged();
        state.backupInfo = { savedAt: backup.savedAt, count: state.entries.length };
        state.backupWorking = false;
        state.importMessage = "Restored " + state.entries.length + " entries from the automatic backup.";
        closeModal();
        scheduleClearImportMessage();
      });
    }).catch(function() {
      state.backupWorking = false;
      state.backupError = "The automatic backup could not be restored.";
      render();
    });
  };

  // ---------- print sheets ----------
  // Printing the interface produces a screenshot of controls; these build a
  // separate document into #jf-print-root and swap the app out for it, so what
  // comes off the printer (or out of "Save as PDF") is a sheet designed to be
  // carried around: black on white, no photos, page breaks between days.

  function printedOnLine() {
    return "Japan Finds \u00b7 printed " + formatDateTime(Date.now());
  }

  // Photos are deliberately left out. They are the bulk of the data, they cost
  // the most to print, and a name plus an address is what a paper sheet is for.
  function openPrintSheet(html) {
    var root = document.getElementById("jf-print-root");
    if (!root) return;
    root.innerHTML = '<div class="jf-print-sheet">' + html + '</div>';
    document.body.classList.add("jf-printing");
    var cleaned = false;
    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      document.body.classList.remove("jf-printing");
      root.innerHTML = "";
      window.removeEventListener("afterprint", cleanup);
    }
    window.addEventListener("afterprint", cleanup);
    // The sheet has to be in the document before the dialog opens, and not
    // every browser fires afterprint, so a timer backs the listener up rather
    // than leaving the app hidden.
    setTimeout(function () {
      try { window.print(); } catch (e) {}
      setTimeout(cleanup, 1000);
    }, 0);
  }

  function printEntryWhere(e) {
    var bits = [];
    if (e.location) bits.push(e.location);
    if (e.neighborhood) bits.push(e.neighborhood);
    if (e.city) bits.push(e.city);
    if (e.prefecture && e.prefecture !== e.city) bits.push(e.prefecture);
    return bits.join(", ");
  }

  function printCoordsLine(e) {
    if (!hasCoords(e)) return "";
    return entryLat(e).toFixed(5) + ", " + entryLng(e).toFixed(5);
  }

  function buildItineraryPrintHtml(list) {
    var days = list.days || [];
    var allStops = [];
    days.forEach(function (d) { (d.stops || []).forEach(function (id) { allStops.push(id); }); });

    var daysHtml = days.map(function (day, dayIdx) {
      var stops = (day.stops || []);
      var legs = dayLegs(stops);
      var stopEntries = stops.map(entryById).filter(Boolean);
      var heading = esc(day.label || ("Day " + (dayIdx + 1))) + (day.date ? " \u2014 " + esc(dayDateLabel(day)) : "");

      var rows = stops.map(function (id, i) {
        var e = entryById(id);
        if (!e) return "";
        var cat = categoryMeta(primaryCategory(e));
        var leg = i > 0 ? legs[i - 1] : null;
        var meta = [cat.label];
        var where = printEntryWhere(e);
        if (where) meta.push(where);
        if (i > 0) meta.push(leg === null ? "no map location" : formatKm(leg) + " from previous");
        var coords = printCoordsLine(e);
        if (coords) meta.push(coords);
        if (e.website) meta.push(e.website);
        return '<div class="jf-print-stop">' +
          '<div class="jf-print-box"></div>' +
          '<div class="jf-print-num">' + (i + 1) + '</div>' +
          '<div class="jf-print-body">' +
          '<div class="jf-print-name">' + esc(e.title || "Untitled") + '</div>' +
          '<div class="jf-print-meta">' + esc(meta.join(" \u00b7 ")) + '</div>' +
          (e.notes ? '<div class="jf-print-notes">' + esc(e.notes) + '</div>' : '') +
          '</div></div>';
      }).join("");

      var footBits = [stops.length + " stop" + (stops.length === 1 ? "" : "s")];
      if (stops.length > 1) footBits.push(formatKm(dayTotalKm(stops)) + " total, straight line");
      if (stops.length > 1) footBits.push(formatKm(spreadKm(stopEntries)) + " across");
      var noCoords = unlocatedCount(stopEntries);
      if (noCoords) footBits.push(noCoords + " without a map location, not counted");

      return '<div class="jf-print-day"><h2>' + heading + '</h2>' +
        (rows || '<p class="jf-print-meta">No stops scheduled.</p>') +
        '<p class="jf-print-foot">' + esc(footBits.join(" \u00b7 ")) + '</p></div>';
    }).join("");

    var unscheduled = unscheduledForList(list);
    var unschedHtml = unscheduled.length
      ? '<div class="jf-print-day"><h2>Unscheduled</h2>' + unscheduled.map(function (e) {
          var where = printEntryWhere(e);
          return '<div class="jf-print-stop"><div class="jf-print-box"></div><div class="jf-print-num">\u2022</div>' +
            '<div class="jf-print-body"><div class="jf-print-name">' + esc(e.title || "Untitled") + '</div>' +
            '<div class="jf-print-meta">' + esc([categoryMeta(primaryCategory(e)).label, where, printCoordsLine(e)].filter(Boolean).join(" \u00b7 ")) + '</div></div></div>';
        }).join("") + '</div>'
      : "";

    return '<h1>' + esc(list.name) + '</h1>' +
      '<p class="jf-print-sub">' + days.length + ' day' + (days.length === 1 ? '' : 's') + ' \u00b7 ' +
      allStops.length + ' scheduled stop' + (allStops.length === 1 ? '' : 's') + ' \u00b7 ' + esc(printedOnLine()) + '</p>' +
      (days.length ? daysHtml : '<p class="jf-print-meta">This list has no days yet.</p>') +
      unschedHtml +
      '<p class="jf-print-foot">Distances are straight-line, not walking routes.</p>';
  }

  // The printed collection is exactly what the filters are showing, described
  // at the top, so a sheet handed to somebody else says what it is a list of.
  function printFilterDescription() {
    // On the map, the pin set comes from the layered place/item rows rather
    // than the grid filter, and mapShowingSummary() is already the sentence
    // that describes it.
    if (state.mapMode) {
      // Already a complete sentence, and the fence is named inside it, so it
      // is used as-is rather than having clauses appended.
      return mapShowingSummary();
    }
    var parts = [];
    if ((state.searchQuery || "").trim()) parts.push('matching \u201c' + state.searchQuery.trim() + '\u201d');
    if (state.activeType !== "all") parts.push(state.activeType === "place" ? "places only" : "items only");
    if (state.activeList !== "all") parts.push('list \u201c' + listName(state.activeList) + '\u201d');
    if ((state.activeCategories || []).length) parts.push((state.activeCategories.map(function (id) { return categoryMeta(id).label; })).join(", "));
    if ((state.activeSubcategories || []).length) parts.push(state.activeSubcategories.map(function (id) { var m = subcategoryMeta(id); return m ? m.label : id; }).join(", "));
    if ((state.activeTags || []).length) parts.push("tagged " + state.activeTags.join(", "));
    if (state.statusFilter !== "all") parts.push(statusFilterLabel(state.statusFilter));
    if (state.geoFence) parts.push("area " + fenceDescription());
    return parts.length ? parts.join(" \u00b7 ") : "everything, unfiltered";
  }

  function buildCollectionPrintHtml(entries) {
    // Group by city when that is how the grid is already grouped, so the paper
    // matches the screen it was printed from.
    var groups = [];
    if (state.sortBy === "city") {
      var byCity = {};
      entries.forEach(function (e) {
        var key = (e.city || "").trim() || "No city recorded";
        if (!byCity[key]) { byCity[key] = []; groups.push({ name: key, rows: byCity[key] }); }
        byCity[key].push(e);
      });
    } else {
      groups.push({ name: "", rows: entries });
    }

    var body = groups.map(function (g) {
      var rows = g.rows.map(function (e) {
        var cats = entryCategories(e).map(function (id) { return categoryMeta(id).label; }).join(", ");
        var linked = isPlace(e)
          ? itemsForPlace(e.id).map(function (x) { return x.title; })
          : placesForItem(e.id).map(function (x) { return x.title; });
        var extra = [];
        if (e.tags && e.tags.length) extra.push("tags: " + e.tags.join(", "));
        if (linked.length) extra.push((isPlace(e) ? "items here: " : "found at: ") + linked.join(", "));
        if (e.website) extra.push(e.website);
        var coords = printCoordsLine(e);
        if (coords) extra.push(coords);
        return '<tr>' +
          '<td><strong>' + esc(e.title || "Untitled") + '</strong>' +
          (e.notes ? '<div class="jf-print-notes">' + esc(e.notes) + '</div>' : '') +
          (extra.length ? '<div class="jf-print-meta">' + esc(extra.join(" \u00b7 ")) + '</div>' : '') + '</td>' +
          '<td>' + esc(cats) + '</td>' +
          '<td>' + esc(e.status ? statusFilterLabel(e.status) : "") + '</td>' +
          '<td>' + esc(printEntryWhere(e)) + '</td>' +
          '<td>' + esc(entryDateLabel(e) || "") + '</td>' +
          '</tr>';
      }).join("");
      return '<div class="jf-print-group">' +
        (g.name ? '<h2>' + esc(g.name) + '</h2>' : '') +
        '<table class="jf-print-table"><thead><tr>' +
        '<th>Find</th><th>Category</th><th>Status</th><th>Where</th><th>Date</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).join("");

    return '<h1>Japan Finds</h1>' +
      '<p class="jf-print-sub">' + entries.length + ' entr' + (entries.length === 1 ? 'y' : 'ies') + ' \u00b7 ' +
      esc(printFilterDescription()) + ' \u00b7 ' + esc(printedOnLine()) + '</p>' +
      (entries.length ? body : '<p class="jf-print-meta">Nothing matches the current filters.</p>');
  }

  // Products of every item in the shown / selected set, and of every item
  // carried by a shown place, grouped by item with that item's own columns.
  function screenProductGroups(entries) {
    var seen = {}, items = [];
    (entries || []).forEach(function (e) {
      var list = isItem(e) ? [e] : itemsForPlace(e.id);
      list.forEach(function (it) { if (!seen[it.id]) { seen[it.id] = true; items.push(it); } });
    });
    return items.sort(byTitle).map(function (it) { return { item: it, products: productsForItem(it.id) }; })
      .filter(function (g) { return g.products.length; });
  }
  function screenHasProducts() {
    if (!(state.products || []).length) return false;
    return screenProductGroups(currentScreenEntries()).length > 0;
  }
  function productGroupTableHtml(item, products, cols) {
    return '<table class="jf-print-table"><thead><tr><th>#</th><th>Product</th>' +
      cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join("") + '</tr></thead><tbody>' +
      products.map(function (prod, i) {
        return '<tr><td>' + (i + 1) + '</td><td><strong>' + esc(prod.name || "") + (prod.favourite ? ' \u2605' : '') + '</strong></td>' +
          cols.map(function (c) { return '<td>' + esc(productColumnValue(prod, c)) + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table>';
  }
  function buildProductsPrintHtml(groups, subtitle) {
    var total = groups.reduce(function (n, g) { return n + g.products.length; }, 0);
    var body = groups.map(function (g) {
      var cat = categoryMeta(primaryCategory(g.item));
      var where = placesForItem(g.item.id).map(function (p) { return p.title; });
      return '<div class="jf-print-group"><h2>' + esc(g.item.title) + ' <span class="jf-print-meta">' + esc(cat.label) + (where.length ? ' \u00b7 found at ' + where.join(", ") : '') + '</span></h2>' +
        productGroupTableHtml(g.item, g.products, productTableColumns(g.item, g.products)) + '</div>';
    }).join("");
    return '<h1>Japan Finds \u2014 products</h1>' +
      '<p class="jf-print-sub">' + total + ' product' + (total === 1 ? '' : 's') + ' across ' + groups.length + ' item' + (groups.length === 1 ? '' : 's') + ' \u00b7 ' + esc(subtitle) + ' \u00b7 ' + esc(printedOnLine()) + '</p>' +

  window.printProducts = function () {

  // The open product table, exactly as displayed: search, favourites and

  window.printProductTable = function () {

    if (state.productFavOnly) shown = shown.filter(function (p) { return p.favourite; });
    if (state.productSort) shown = sortProducts(shown, cols, state.productSort);
    var desc = [query ? 'search \u201c' + query + '\u201d' : '', state.productFavOnly ? 'favourites only' : '', state.productSort ? 'sorted' : 'your order'].filter(Boolean).join(", ");
    openPrintSheet(buildProductsPrintHtml([{ item: entry, products: shown }], desc));
  };

  window.printCollection = function () {
    // Same resolved set as the CSV export, so a printed sheet and a downloaded
    // file taken from the same screen list the same records.
    openPrintSheet(buildCollectionPrintHtml(buildScreenExportSet().entries));
  };

  window.printItinerary = function () {
    var list = getList(state.itineraryListId);
    if (!list) return;
    openPrintSheet(buildItineraryPrintHtml(list));
  };

  // ---------- photo files, zip, base64 ----------
  // Photos are stored as data URLs. A single compressed photo is capped at
  // 750 KB binary, which is roughly a million base64 characters - about thirty
  // times Excel's 32,767-character cell limit. Putting that payload in a cell
  // produced a file that no spreadsheet could parse: the oversized field lost
  // its closing quote and the overflow landed in the first column of the next
  // row, which is why an exported ProductID used to come back as base64 spread
  // over several lines.
  //
  // The CSV now carries a FILENAME per photo, and the images travel beside it
  // in a zip. Every cell stays small, the CSV opens cleanly anywhere, and the
  // photos can still be reconstructed on import by matching those filenames
  // against the zip.
  var PHOTO_FILE_SEPARATOR = ";";

  var PHOTO_EXT_BY_MIME = {
    "image/webp": "webp", "image/jpeg": "jpg", "image/jpg": "jpg",
    "image/png": "png", "image/gif": "gif", "image/avif": "avif"
  };
  var PHOTO_MIME_BY_EXT = {
    webp: "image/webp", jpg: "image/jpeg", jpeg: "image/jpeg",
    png: "image/png", gif: "image/gif", avif: "image/avif"
  };

  function photoMimeOf(dataUrl) {
    var m = String(dataUrl || "").match(/^data:([^;,]+)/);
    return m ? m[1].toLowerCase() : "";
  }

  function isDataUrl(v) {
    return /^data:[^;,]*[;,]/.test(String(v || ""));
  }

  // Ids come from makeId() and are already filename-safe, but an imported or
  // hand-edited record could carry anything, so the name is sanitised rather
  // than trusted.
  function safeFileToken(id) {
    return String(id || "unknown").replace(/[^A-Za-z0-9._-]/g, "_").slice(0, 80);
  }

  // The one place the naming scheme is defined, so export and import cannot
  // drift apart.
  function photoFileName(folder, ownerId, index, dataUrl) {
    var ext = PHOTO_EXT_BY_MIME[photoMimeOf(dataUrl)] || "bin";
    return folder + "/" + safeFileToken(ownerId) + "-" + (index + 1) + "." + ext;
  }

  function photoFileNamesFor(folder, ownerId, photos) {
    return (photos || []).map(function (p, i) { return photoFileName(folder, ownerId, i, p); });
  }

  function bytesToBase64(bytes) {
    // String.fromCharCode.apply blows the argument limit on a whole photo, so
    // the array is walked in 32 KB slices.
    var CHUNK = 0x8000, parts = [];
    for (var i = 0; i < bytes.length; i += CHUNK) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
    }
    return btoa(parts.join(""));
  }

  function dataUrlToBytes(dataUrl) {
    var s = String(dataUrl || "");
    var comma = s.indexOf(",");
    if (comma === -1) return null;
    var meta = s.slice(0, comma);
    var body = s.slice(comma + 1);
    var mime = photoMimeOf(s) || "application/octet-stream";
    try {
      if (meta.indexOf(";base64") === -1) {
        return { mime: mime, bytes: new TextEncoder().encode(decodeURIComponent(body)) };
      }
      var bin = atob(body);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return { mime: mime, bytes: out };
    } catch (e) { return null; }
  }

  function bytesToDataUrl(bytes, filename) {
    var ext = String(filename || "").split(".").pop().toLowerCase();
    var mime = PHOTO_MIME_BY_EXT[ext] || "application/octet-stream";
    return "data:" + mime + ";base64," + bytesToBase64(bytes);
  }

  // ---------- zip ----------
  // Written and read here rather than pulled from a library: the app is a
  // single file with no build step and no dependencies, and photos are already
  // compressed formats, so entries are STORED (method 0) with no deflate.
  var CRC32_TABLE = null;
  function crc32(bytes) {
    if (!CRC32_TABLE) {
      CRC32_TABLE = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC32_TABLE[n] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(d) {
    var year = Math.max(1980, d.getFullYear());
    return {
      time: ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31),
      date: (((year - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31)
    };
  }

  // files: [{ name, bytes }]. Returns a Blob, or null if the archive would
  // exceed what a plain (non-ZIP64) zip can address.
  function buildZipBlob(files) {
    var enc = new TextEncoder();
    var stamp = dosDateTime(new Date());
    var chunks = [], central = [], offset = 0, total = 0;

    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var nameBytes = enc.encode(f.name);
      var size = f.bytes.length;
      var crc = crc32(f.bytes);
      var localOffset = offset;

      var lh = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true); // UTF-8 filenames
      lv.setUint16(8, 0, true);      // stored
      lv.setUint16(10, stamp.time, true);
      lv.setUint16(12, stamp.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      chunks.push(lh, f.bytes);
      offset += lh.length + size;
      total += size;

      var cd = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, stamp.time, true);
      cv.setUint16(14, stamp.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, localOffset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      // ZIP64 is not implemented; refusing is better than writing an archive
      // whose offsets silently wrap.
      if (offset > 0xFFFFFFF0) return null;
    }

    var cdOffset = offset, cdSize = 0;
    central.forEach(function (c) { cdSize += c.length; chunks.push(c); });

    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, cdOffset, true);
    ev.setUint16(20, 0, true);
    chunks.push(eocd);

    if (files.length > 0xFFFF) return null;
    return new Blob(chunks, { type: "application/zip" });
  }

  function inflateRaw(bytes) {
    if (typeof DecompressionStream === "undefined") {
      return Promise.reject(new Error("This browser cannot decompress that zip."));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }

  // Reads a zip into { name: Uint8Array }. Entries written by this app are
  // stored; deflated entries are still handled, because a person may well
  // unzip the archive, add or replace a photo, and zip it up again with their
  // own tool.
  function readZip(arrayBuffer) {
    var view = new DataView(arrayBuffer);
    var bytes = new Uint8Array(arrayBuffer);
    var eocd = -1;
    var scanFrom = Math.max(0, view.byteLength - 66000);
    for (var i = view.byteLength - 22; i >= scanFrom; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd === -1) return Promise.reject(new Error("That does not look like a zip file."));

    var count = view.getUint16(eocd + 10, true);
    var cdOffset = view.getUint32(eocd + 16, true);
    if (cdOffset === 0xFFFFFFFF || count === 0xFFFF) {
      return Promise.reject(new Error("That zip uses ZIP64, which this importer cannot read."));
    }

    var dec = new TextDecoder();
    var jobs = [];
    var p = cdOffset;
    for (var n = 0; n < count; n++) {
      if (p + 46 > view.byteLength || view.getUint32(p, true) !== 0x02014b50) break;
      var method = view.getUint16(p + 10, true);
      var csize = view.getUint32(p + 20, true);
      var nameLen = view.getUint16(p + 28, true);
      var extraLen = view.getUint16(p + 30, true);
      var commentLen = view.getUint16(p + 32, true);
      var localOff = view.getUint32(p + 42, true);
      var name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;

      if (!name || name.charAt(name.length - 1) === "/") continue;
      if (view.getUint32(localOff, true) !== 0x04034b50) continue;
      var lNameLen = view.getUint16(localOff + 26, true);
      var lExtraLen = view.getUint16(localOff + 28, true);
      var dataStart = localOff + 30 + lNameLen + lExtraLen;
      var raw = bytes.subarray(dataStart, dataStart + csize);
      jobs.push({ name: name, method: method, raw: raw });
    }

    var out = {};
    return jobs.reduce(function (chain, job) {
      return chain.then(function () {
        if (job.method === 0) { out[job.name] = job.raw; return; }
        if (job.method === 8) {
          return inflateRaw(job.raw).then(function (b) { out[job.name] = b; });
        }
        // Anything else (bzip2, lzma) is left out and reported as missing
        // rather than pretending it was read.
      });
    }, Promise.resolve()).then(function () { return out; });
  }

  // ---------- CSV parsing ----------
  // RFC 4180: quoted fields, doubled quotes inside them, embedded newlines,
  // and either line ending.
  function parseCsv(text) {
    var s = String(text || "");
    if (s.charCodeAt(0) === 0xFEFF) s = s.slice(1);
    var rows = [], row = [], field = "", inQuotes = false, i = 0;
    while (i < s.length) {
      var c = s.charAt(i);
      if (inQuotes) {
        if (c === '"') {
          if (s.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\r" || c === "\n") {
        if (c === "\r" && s.charAt(i + 1) === "\n") i++;
        row.push(field); rows.push(row); row = []; field = ""; i++; continue;
      }
      field += c; i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    // A trailing newline leaves one empty row; drop rows that are entirely blank.
    return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ""; }); });
  }

  // csvCell prefixes a quote onto anything a spreadsheet would treat as a
  // formula. That prefix is ours, not the user's, so it comes back off.
  function uncsvCell(v) {
    var s = String(v == null ? "" : v);
    if (s.charAt(0) === "'" && /^[=+\-@\t\r]/.test(s.slice(1))) return s.slice(1);
    return s;
  }

  function csvRowsToObjects(rows) {
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return uncsvCell(h).trim(); });
    return rows.slice(1).map(function (r) {
      var o = {};
      headers.forEach(function (h, i) { o[h] = uncsvCell(r[i] == null ? "" : r[i]); });
      return o;
    });
  }

  function splitList(v) {
    return String(v || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // ---------- CSV building ----------

  // Excel (and Sheets/LibreOffice) treats a cell beginning with =, +, -, @, or
  // certain control characters as a formula, not text. A title like
  // "=1+1" or "=HYPERLINK(...)" would then execute when the file is opened.
  // Prefixing with a single quote forces spreadsheet apps to read the cell as
  // plain text while leaving the visible content unchanged.
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function csvDocument(headers, rows) {
    // Leading BOM so Excel reads the Japanese text as UTF-8 rather than mojibake.
    return "\uFEFF" + [headers.map(csvCell).join(",")]
      .concat(rows.map(function (r) { return r.map(csvCell).join(","); }))
      .join("\r\n");
  }

  function downloadFile(content, mime, filename) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Accepts an optional entry list so the same builder serves both the full
  // export and the filtered-view export; defaults to the whole collection.
  // dateAdded is stored as epoch milliseconds - a 13-digit number, which Excel
  // renders as 1.7E+12 and, worse, will happily round-trip back in that form.
  // Written as an ISO 8601 string it contains letters, so every spreadsheet
  // treats it as text and leaves it alone, and it is readable to a person.
  function csvTimestamp(ms) {
    var n = Number(ms);
    if (!Number.isFinite(n) || n <= 0) return "";
    try { return new Date(n).toISOString(); } catch (e) { return ""; }
  }

  // Accepts what csvTimestamp() writes, and still accepts a bare epoch number
  // from a file exported by an earlier version or edited by hand.
  function parseCsvTimestamp(value) {
    var raw = String(value == null ? "" : value).trim();
    if (!raw) return null;
    if (/^\d+$/.test(raw)) {
      var n = Number(raw);
      return Number.isFinite(n) && n > 0 ? n : null;
    }
    var t = Date.parse(raw);
    return Number.isFinite(t) ? t : null;
  }

  function entriesTable(entryList) {
    var headers = ["ID", "Title", "Type", "Status", "DateVisited", "DateTried", "Category", "Categories",
      "CategoryLabels", "Subcategories", "SubcategoryLabels", "Lists", "PrefectureRegionState", "City", "Neighborhood", "Location", "Website", "TabelogURL",
      "Latitude", "Longitude", "Tags", "Notes", "DateAdded", "LinkedPlaces", "LinkedItems",
      "ProductCount", "PhotoCount", "PhotoFiles"];
    // Indexed once: the per-row linked-places / linked-items / product-count
    // lookups each scanned the whole collection, making the export quadratic.
    var relIdx = buildRelationIndex();
    var byId = {};
    state.entries.forEach(function (en) { byId[en.id] = en; });
    var prodCount = {};
    (state.products || []).forEach(function (b) { prodCount[b.itemId] = (prodCount[b.itemId] || 0) + 1; });
    var rows = (entryList || state.entries).map(function (e) {
      var photos = e.photos || [];
      return [
        e.id, e.title, e.type || "place", e.status || "", e.visitedDate || "", e.dateTried || "",
        e.category, entryCategories(e).join(";"),
        entryCategories(e).map(function (c) { return categoryMeta(c).label; }).join(";"),
        (e.subcategories || []).join(";"),
        (e.subcategories || []).map(function (id) { var sc = subcategoryMeta(id); return sc ? sc.label : id; }).join(";"),
        (e.lists || []).map(listName).filter(Boolean).join(";"),
        e.prefecture || "", e.city, e.neighborhood, e.location, e.website, e.tabelogUrl || "",
        e.latitude, e.longitude, (e.tags || []).join(";"), e.notes, csvTimestamp(e.dateAdded),
        isItem(e) ? linkedEntries(relIdx.byItem[e.id], byId, isPlace).map(function (p) { return p.title; }).join("; ") : "",
        isPlace(e) ? linkedEntries(relIdx.byPlace[e.id], byId, isItem).map(function (i) { return i.title; }).join("; ") : "",
        isItem(e) ? (prodCount[e.id] || 0) : 0,
        photos.length, photoFileNamesFor("entries", e.id, photos).join(PHOTO_FILE_SEPARATOR)
      ];
    });
    return { headers: headers, rows: rows };
  }

  // Note: there is no entries-only CSV writer. Entries always ship in the
  // combined file below, so there is one shape to export and one to import.

  // Product columns are schema-driven, so a CSV of a user-defined category
  // carries that category's fields rather than the old fixed sake/wine set.
  // Columns are the union across every product in the file, in category-field
  // order, with any value left over from a removed field appended after them.
  function productCsvColumns(productList) {
    var cols = [], seen = {};
    (productList || []).forEach(function (prod) {
      var item = entryById(prod.itemId);
      var fields = item ? fieldsForItem(item) : [];
      fields.forEach(function (f) {
        if (seen[f.key]) return;
        seen[f.key] = true;
        cols.push({ key: f.key, label: f.label, field: f });
      });
      orphanProductValues(prod, fields).forEach(function (o) {
        if (seen[o.key]) return;
        seen[o.key] = true;
        cols.push({ key: o.key, label: o.label, field: null });
      });
    });
    // Two different fields (different keys, typically defined by two
    // categories) can share a label. The importer matches columns by label,
    // so identical headers would collapse into one column and silently drop
    // one field's values. Later duplicates carry their key in the header;
    // the importer recognises that form and maps it back to the field.
    var labelUsed = {};
    cols.forEach(function (c) {
      if (labelUsed[c.label]) c.label = c.label + " [" + c.key + "]";
      labelUsed[c.label] = true;
    });
    return cols;
  }

  function productsTable(productList) {
    var list = productList || [];
    var cols = productCsvColumns(list);
    var headers = ["ProductID", "ItemID", "ItemTitle", "ItemCategories", "Product"]
      .concat(cols.map(function (c) { return c.label; }))
      .concat(["PhotoCount", "PhotoFiles"]);
    var rows = list.map(function (prod) {
      var item = entryById(prod.itemId);
      var photos = prod.photos || [];
      return [
        prod.id, prod.itemId, item ? item.title : "",
        item ? entryCategories(item).map(function (c) { return categoryMeta(c).label; }).join(";") : "",
        prod.name || ""
      ]
        .concat(cols.map(function (c) { return c.field ? productFieldDisplay(prod, c.field) : productValue(prod, c.key); }))
        .concat([photos.length, photoFileNamesFor("products", prod.id, photos).join(PHOTO_FILE_SEPARATOR)]);
    });
    return { headers: headers, rows: rows, reservedCount: 5 };
  }

  function productsCsv(productList) {
    var t = productsTable(productList);
    return csvDocument(t.headers, t.rows);
  }

  // Entries and products are one-to-many: an item can carry any number of
  // products, so they cannot share a row. They can share a FILE, though, with
  // a RowType column saying which kind each row is. Entry rows leave the
  // product columns blank and vice versa; PhotoCount and PhotoFiles mean the
  // same thing for both and are shared.
  //
  // Product field columns are prefixed, because a category can define a field
  // labelled "Notes" or "Website" and an entry already has columns by those
  // names. The prefix is stripped again on import.
  var COMBINED_PRODUCT_PREFIX = "Product: ";
  var COMBINED_SHARED_TAIL = ["PhotoCount", "PhotoFiles"];

  // Scrapbook notes ride along as "note" rows using the entry columns they
  // share: ID, Title, Notes (the text), DateAdded and the photo tail.
  function noteRowsForCsv(eHead, noteList) {
    return (noteList || []).map(function (nt) {
      var row = eHead.map(function () { return ""; });
      var photos = nt.photos || [];
      row[eHead.indexOf("ID")] = nt.id;
      row[eHead.indexOf("Title")] = nt.title || "";
      row[eHead.indexOf("Notes")] = nt.body || "";
      row[eHead.indexOf("DateAdded")] = csvTimestamp(nt.dateAdded);
      return { fields: row, tail: [photos.length, photoFileNamesFor("notes", nt.id, photos).join(PHOTO_FILE_SEPARATOR)] };
    });
  }
  function combinedCsv(entryList, productList, noteList) {
    var eT = entriesTable(entryList);
    var pT = productsTable(productList);

    // Both tables end with PhotoCount and PhotoFiles; those two become the
    // shared tail rather than appearing twice.
    var eHead = eT.headers.slice(0, eT.headers.length - 2);
    var pHead = pT.headers.slice(0, pT.headers.length - 2);
    var pHeadOut = pHead.map(function (h, i) {
      return i < pT.reservedCount ? h : COMBINED_PRODUCT_PREFIX + h;
    });

    var headers = ["RowType"].concat(eHead, pHeadOut, COMBINED_SHARED_TAIL);
    var blanksE = eHead.map(function () { return ""; });
    var blanksP = pHead.map(function () { return ""; });

    var rows = [];
    eT.rows.forEach(function (r) {
      rows.push(["entry"].concat(r.slice(0, r.length - 2), blanksP, r.slice(r.length - 2)));
    });
    pT.rows.forEach(function (r) {
      rows.push(["product"].concat(blanksE, r.slice(0, r.length - 2), r.slice(r.length - 2)));
    });
    noteRowsForCsv(eHead, noteList).forEach(function (r) {
      rows.push(["note"].concat(r.fields, blanksP, r.tail));
    });
    return csvDocument(headers, rows);
  }

  // ---------- photo zip export ----------
  // Collects the image files the CSVs are pointing at. The naming here has to
  // agree with photoFileNamesFor(), which is why both go through the same
  // photoFileName().
  function collectPhotoFiles(entryList, productList, noteList) {
    var files = [], skipped = 0;
    (noteList || []).forEach(function (nt) {
      (nt.photos || []).forEach(function (p, i) {
        var d = dataUrlToBytes(p);
        if (!d) { skipped++; return; }
        files.push({ name: photoFileName("notes", nt.id, i, p), bytes: d.bytes });
      });
    });
    (entryList || []).forEach(function (e) {
      (e.photos || []).forEach(function (p, i) {
        var d = dataUrlToBytes(p);
        if (!d) { skipped++; return; }
        files.push({ name: photoFileName("entries", e.id, i, p), bytes: d.bytes });
      });
    });
    (productList || []).forEach(function (prod) {
      (prod.photos || []).forEach(function (p, i) {
        var d = dataUrlToBytes(p);
        if (!d) { skipped++; return; }
        files.push({ name: photoFileName("products", prod.id, i, p), bytes: d.bytes });
      });
    });
    return { files: files, skipped: skipped };
  }

  // Returns a short sentence describing what happened, so every caller can
  // append it to its own status message rather than inventing its own wording.
  function downloadPhotoZip(entryList, productList, filename, noteList) {
    var collected = collectPhotoFiles(entryList, productList, noteList);
    if (!collected.files.length) return "";
    var blob = null;
    try {
      blob = buildZipBlob(collected.files);
    } catch (e) {
      blob = null;
    }
    if (!blob) {
      return " The photo zip could not be built \u2014 the archive would be too large for this format. Use the JSON export for a complete copy.";
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return " Photos are in " + filename + " (" + collected.files.length + " image" +
      (collected.files.length === 1 ? "" : "s") + ")" +
      (collected.skipped ? ", " + collected.skipped + " unreadable and left out" : "") +
      " \u2014 keep it next to the CSV to re-import them.";
  }

  // The readable categories CSV above flattens a field definition to
  // "Label (type)" and a subcategory to its label alone. That is fine to look
  // at and impossible to import from: the field KEY is what products file
  // their values under, and the subcategory ID is what entries point at, and
  // neither survives the flattening.
  //
  // So the schema travels in a second file, one row per record rather than one
  // row per category, with every field the app actually stores. The readable
  // file is left exactly as it was.
  var CATEGORY_SCHEMA_HEADERS = ["RecordType", "CategoryID", "SortOrder", "Label", "Abbr", "Icon",
    "Color", "AppliesTo", "CarriesItems", "TabelogField", "BuiltIn",
    "SubcategoryID", "FieldKey", "FieldType", "FieldOptions", "FieldAllowOther", "FieldPlaceholder"];

  var CATEGORY_OPTION_SEPARATOR = "|";

  function categorySchemaCsv(categoryList) {
    var rows = [];
    (categoryList || []).forEach(function (c, ci) {
      rows.push(["category", c.id, ci, c.label, c.abbr, c.icon, c.color,
        (c.types || []).join(";"), c.linkable ? "yes" : "no", c.tabelog ? "yes" : "no",
        c.builtIn ? "yes" : "no", "", "", "", "", "", ""]);
      (c.subcategories || []).forEach(function (sc, si) {
        rows.push(["subcategory", c.id, si, sc.label, "", sc.icon || "", "", "", "", "", "",
          sc.id, "", "", "", "", ""]);
      });
      (c.fields || []).forEach(function (f, fi) {
        rows.push(["field", c.id, fi, f.label, "", "", "", "", "", "", "", "",
          f.key, f.type, (f.options || []).join(CATEGORY_OPTION_SEPARATOR),
          f.allowOther ? "yes" : "no", f.placeholder || ""]);
      });
    });
    return csvDocument(CATEGORY_SCHEMA_HEADERS, rows);
  }

  // Rebuilds category objects from the schema rows. Rows are grouped by
  // CategoryID and ordered by SortOrder, so a spreadsheet that got sorted by
  // some other column still rebuilds in the right sequence.
  function categoriesFromSchemaRows(objs, report) {
    var byId = {}, order = [];
    function bucket(id) {
      if (!byId[id]) { byId[id] = { id: id, subs: [], fields: [], head: null }; order.push(id); }
      return byId[id];
    }
    objs.forEach(function (row) {
      var kind = String(row.RecordType || "").trim().toLowerCase();
      var catId = String(row.CategoryID || "").trim();
      if (!catId) { report.schemaRowsSkipped++; return; }
      var sort = Number(row.SortOrder);
      if (!Number.isFinite(sort)) sort = 0;
      var b = bucket(catId);
      if (kind === "category") {
        b.head = {
          id: catId,
          label: String(row.Label || "").trim(),
          abbr: String(row.Abbr || "").trim(),
          icon: String(row.Icon || "").trim(),
          color: String(row.Color || "").trim(),
          types: splitList(row.AppliesTo),
          linkable: /^y|^t|^1/i.test(String(row.CarriesItems || "")),
          tabelog: /^y|^t|^1/i.test(String(row.TabelogField || "")),
          builtIn: /^y|^t|^1/i.test(String(row.BuiltIn || "")),
          sort: sort
        };
        return;
      }
      if (kind === "subcategory") {
        var scId = String(row.SubcategoryID || "").trim();
        if (!scId) { report.schemaRowsSkipped++; return; }
        b.subs.push({ sort: sort, value: { id: scId, label: String(row.Label || "").trim(), icon: String(row.Icon || "") } });
        return;
      }
      if (kind === "field") {
        var key = String(row.FieldKey || "").trim();
        if (!key) { report.schemaRowsSkipped++; return; }
        b.fields.push({
          sort: sort,
          value: {
            key: key,
            label: String(row.Label || "").trim(),
            type: String(row.FieldType || "text").trim(),
            options: String(row.FieldOptions || "").split(CATEGORY_OPTION_SEPARATOR)
              .map(function (s) { return s.trim(); }).filter(Boolean),
            allowOther: /^y|^t|^1/i.test(String(row.FieldAllowOther || "")),
            placeholder: String(row.FieldPlaceholder || "")
          }
        });
        return;
      }
      report.schemaRowsSkipped++;
    });

    function bySort(a, b) { return a.sort - b.sort; }
    var out = [];
    order.forEach(function (id) {
      var b = byId[id];
      // Subcategory and field rows for a category whose own row is missing
      // have nothing to attach to; rebuilding a category from them would
      // invent a label and a colour.
      if (!b.head) { report.schemaOrphanRows++; return; }
      var c = b.head;
      var normalized = normalizeCategory({
        id: c.id, label: c.label, abbr: c.abbr, icon: c.icon, color: c.color,
        types: c.types, linkable: c.linkable, tabelog: c.tabelog, builtIn: c.builtIn,
        subcategories: b.subs.sort(bySort).map(function (x) { return x.value; }),
        fields: b.fields.sort(bySort).map(function (x) { return x.value; })
      });
      if (!normalized) { report.schemaRowsSkipped++; return; }
      normalized.__sort = c.sort;
      out.push(normalized);
    });
    out.sort(function (a, b) { return a.__sort - b.__sort; });
    out.forEach(function (c) { delete c.__sort; });
    return out;
  }

  // Resolves an export scope into the exact records that will be written.
  // Products belong to items, so "places only" carries none by definition.
  function exportScopeSelection(scope) {
    var entries, products;
    if (scope === "places") {
      entries = state.entries.filter(isPlace);
      products = [];
