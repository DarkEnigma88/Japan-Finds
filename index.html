  }

  function getAllUniqueTags() {
    var set = {};
    state.entries.forEach(function (e) {
      (e.tags || []).forEach(function (t) {
        if (t && t.trim()) set[t.trim()] = true;
      });
    });
    return Object.keys(set).sort();
  }

  function getTagsForCategories(categoryIds) {
    var ids = Array.isArray(categoryIds) ? categoryIds : [];
    if (!ids.length) return [];
    var set = {};
    state.entries.forEach(function (e) {
      var cats = entryCategories(e);
      var matches = cats.some(function (id) { return ids.indexOf(id) !== -1; });
      if (!matches) return;
      (e.tags || []).forEach(function (t) {
        if (t && t.trim()) set[t.trim()] = true;
      });
    });
    return Object.keys(set).sort();
  }

  function getFilteredEntries() {
    // Linked titles are searchable too: typing a sake name finds the shops
    // that carry it, and typing a shop finds the items it stocks. Built once
    // per pass, and only when there is a query to test against.
    var searchQ = state.searchQuery.trim().toLowerCase();
    var searchRel = null, searchById = null;
    if (searchQ) {
      searchRel = buildRelationIndex();
      searchById = {};
      state.entries.forEach(function (en) { searchById[en.id] = en; });
    }
    function linkedTitlesMatch(e) {
      if (!searchRel) return false;
      var ids = isPlace(e) ? searchRel.byPlace[e.id] : searchRel.byItem[e.id];
      return (ids || []).some(function (id) {
        var other = searchById[id];
        return other && (other.title || "").toLowerCase().indexOf(searchQ) !== -1;
      });
    }
    var results = state.entries.filter(function (e) {
      var matchesType = state.activeType === "all" || (e.type || "place") === state.activeType;
      if (!matchesType) return false;
      var matchesList = state.activeList === "all" || (e.lists || []).indexOf(state.activeList) !== -1;
      if (!matchesList) return false;
      var selectedCats = Array.isArray(state.activeCategories) ? state.activeCategories : [];
    if (state.mapMode) selectedCats = selectedCats.filter(function(id){ return PLACE_CATEGORY_IDS.indexOf(id) !== -1; });
      var matchesCategory = matchSet("cats", selectedCats, function(id) { return hasCategory(e, id); });
      if (!matchesCategory) return false;

      var selectedSubs = Array.isArray(state.activeSubcategories) ? state.activeSubcategories : [];
      // A subcategory only narrows entries in its own parent category. An
      // entry from another selected category (e.g. Sake Labels while Snacks >
      // Savoury is on) has no such subcategory and must not be dropped for it.
      // Tested per parent category, each with its own any/all setting.
      var matchesSubcategory = selectedSubs.length === 0 || entryCategories(e).every(function(catId) {
        var subsHere = (CATEGORY_SUBCATEGORIES[catId] || []).map(function(sc) { return sc.id; }).filter(function(id) { return selectedSubs.indexOf(id) !== -1; });
        return matchSet("sub:" + catId, subsHere, function(id) { return (e.subcategories || []).indexOf(id) !== -1; });
      });
      if (!matchesSubcategory) return false;

      var selectedTags = Array.isArray(state.activeTags) ? state.activeTags : [];
      // Tags are cumulative: each one you add brings in more entries, the same
      // way they behave in map mode.
      var matchesTags = matchSet("tags", selectedTags, function(tag) { return (e.tags || []).indexOf(tag) !== -1; });
      if (!matchesTags) return false;

      var matchesStatus = state.statusFilter === "all" || e.status === state.statusFilter;
      if (!matchesStatus) return false;

      // Geography narrows, exactly like status and search do. An area filter is
      // a question about places, so Items drop out of the results entirely
      // while one is on rather than riding along untested.
      if (state.geoFence && isItem(e)) return false;
      if (!entryInFence(e)) return false;

      var q = state.searchQuery.trim().toLowerCase();
      if (!q) return true;
      return (
        (e.title || "").toLowerCase().indexOf(q) !== -1 ||
        (e.notes || "").toLowerCase().indexOf(q) !== -1 ||
        (e.location || "").toLowerCase().indexOf(q) !== -1 ||
        (e.city || "").toLowerCase().indexOf(q) !== -1 ||
        (e.neighborhood || "").toLowerCase().indexOf(q) !== -1 ||
        (e.website || "").toLowerCase().indexOf(q) !== -1 ||
        (e.tags || []).some(function (t) { return t.toLowerCase().indexOf(q) !== -1; }) ||
        linkedTitlesMatch(e)
      );
    });

    results.sort(function (a, b) {
      if (state.sortBy === "oldest") return (a.dateAdded || 0) - (b.dateAdded || 0);
      if (state.sortBy === "visited-newest") return String(b.visitedDate || "").localeCompare(String(a.visitedDate || ""));
      if (state.sortBy === "visited-oldest") return String(a.visitedDate || "").localeCompare(String(b.visitedDate || ""));
      if (state.sortBy === "name") return (a.title || "").localeCompare(b.title || "");
      if (state.sortBy === "city") return (a.city || "").localeCompare(b.city || "");
      if (state.sortBy === "distance") {
        var ref = state.userCoords || { lat: 35.6762, lng: 139.6503 }; // default Tokyo
        var latA = entryLat(a), lngA = entryLng(a);
        var latB = entryLat(b), lngB = entryLng(b);
        var distA = hasCoords(a) ? getDistanceKm(ref.lat, ref.lng, latA, lngA) : 99999;
        var distB = hasCoords(b) ? getDistanceKm(ref.lat, ref.lng, latB, lngB) : 99999;
        return distA - distB;
      }
      return (b.dateAdded || 0) - (a.dateAdded || 0);
    });
    return results;
  }

  // ---------- render ----------

  function composePage() {
    var onProductTable = !!state.productTableItemId;
    var onItinerary = !onProductTable && !!state.itineraryListId;
    var onScrapbook = !onProductTable && !onItinerary && !!state.scrapbookOpen;
    ensureFavouritesList();
    // The itinerary is its own workspace: the collection filter bar would act
    // on a grid that is not on screen, so it is left out entirely.
    var chrome = (onProductTable || onItinerary || onScrapbook) ? "" : renderFilterBar() + renderFencePanel() + renderViewsPanel();
    var body = onProductTable ? renderProductTableView()
      : onItinerary ? renderItineraryView()
      : onScrapbook ? renderScrapbookView()
      : (state.mapMode ? renderMapView() : renderMain());
    return renderHeader() +
      renderOfflineBanner() +
      renderBanner() +
      renderImportMessage() +
      renderGlobalError() +
      chrome +
      body +
      renderFooter() +
      renderModal() +
      renderDatalist();
  }

  // Re-render the whole page while keeping the live Google Maps container
  // elements in place. Google Maps owns state inside those nodes, so replacing
  // them (as a plain render does) forces a full map rebuild - which is why a
  // theme switch used to reset the user's pan and zoom.
  function renderKeepingMaps() {
    var app = document.getElementById("app");
    if (!app) return;
    var liveMap = document.getElementById("japan-map");
    var livePicker = document.getElementById("japan-map-picker");
    if (!liveMap && !livePicker) { render(); return; }
    var oldModal = document.querySelector(".jf-modal");
    var modalScrollTop = oldModal ? oldModal.scrollTop : 0;
    // Emptying #app collapses the document height, which throws the window
    // back to the top. Starting a box draw or clicking a corner re-renders,
    // so without this the map jumps out from under the pointer mid-draw.
    var pageScroll = window.pageYOffset || (document.scrollingElement || document.documentElement).scrollTop || 0;
    if (liveMap && liveMap.parentNode) liveMap.parentNode.removeChild(liveMap);
    if (livePicker && livePicker.parentNode) livePicker.parentNode.removeChild(livePicker);
    var holder = document.createElement("div");
    holder.innerHTML = composePage();
    var slotMap = holder.querySelector("#japan-map");
    if (slotMap && liveMap && slotMap.parentNode) slotMap.parentNode.replaceChild(liveMap, slotMap);
    var slotPicker = holder.querySelector("#japan-map-picker");
    if (slotPicker && livePicker && slotPicker.parentNode) slotPicker.parentNode.replaceChild(livePicker, slotPicker);
    app.innerHTML = "";
    while (holder.firstChild) app.appendChild(holder.firstChild);
    syncStickyOffsets();
    if (state.modalMode) trapModalFocus();
    if (pageScroll) {
      window.scrollTo(0, pageScroll);
      // The height is only final once the browser has laid the new nodes out,
      // so the position is claimed again on the next frame.
      requestAnimationFrame(function () { window.scrollTo(0, pageScroll); });
    }
    if (oldModal) requestAnimationFrame(function () {
      var m = document.querySelector(".jf-modal");
      if (m) m.scrollTop = modalScrollTop;
    });
  }

  function render() {
    // When a modal is sitting over the collection map, never rebuild #app.
    // Replacing the map DOM would destroy/recreate Google Maps and reset the user's view.
    if (state.mapMode && state.modalMode) {
      renderModalOverlayPreservingMap();
      return;
    }
    var app = document.getElementById("app");
    var oldModal = document.querySelector(".jf-modal");
    var modalScrollTop = oldModal ? oldModal.scrollTop : 0;
    var shouldRestoreModalScroll = !!oldModal && !!state.modalMode;
    var shouldReinitMap = (!!googleMap || !!googleMapPicker) && (!!state.mapMode || !!state.mapPickerOpen);

    // Google Maps owns the map instance independently of the DOM. Clear our
    // references before replacing the map container so stale markers/listeners
    // cannot survive a render.
    if (shouldReinitMap) destroyGoogleMap();

    app.innerHTML = composePage();
    syncStickyOffsets();

    // Re-attach focus trap / handlers if modal is active
    if (state.modalMode) trapModalFocus();

    // Preserve the user's position inside long add/edit forms. The map picker
    // itself is inserted during render, so restoring after the DOM settles
    // keeps the form at the same scroll position.
    if (shouldRestoreModalScroll) {
      requestAnimationFrame(function () {
        var modal = document.querySelector(".jf-modal");
        if (modal) modal.scrollTop = modalScrollTop;
      });
    }

    // Rebuild a map after a render (for example after search results or a
    // theme change) using the current state.
    if (state.mapMode && !state.productTableItemId) {
      setTimeout(function () { initMap(state.mapFocusId || null); }, 0);
    } else if (state.mapPickerOpen) {
      setTimeout(initMapPicker, 0);
    }
  }

  // Swapping the backdrop removes whatever input currently has focus, which
  // fires blur and, on a text field the user has typed into, change - and that
  // handler calls straight back into this function. The re-entrant call used to
  // replace the backdrop first, leaving the outer call holding a node that was
  // no longer in the document. Nested calls are now collapsed into a single
  // follow-up pass after the outer one finishes.
  var modalRerenderBusy = false;
  var modalRerenderPending = false;

  function rerenderModalOnly() {
    if (modalRerenderBusy) { modalRerenderPending = true; return; }
    modalRerenderBusy = true;
    try {
      rerenderModalOnlyInner();
    } finally {
      modalRerenderBusy = false;
    }
    if (modalRerenderPending) {
      modalRerenderPending = false;
      rerenderModalOnly();
    }
  }

  function rerenderModalOnlyInner() {
    var oldBackdrop = document.querySelector(".jf-modal-backdrop");
    // parentNode is checked as well as existence: an event fired by a blur can
    // arrive after this modal has already been swapped out, and replaceWith()
    // on a detached node throws.
    if (!oldBackdrop || !oldBackdrop.parentNode || !state.modalMode) { render(); return; }
    var oldModal = oldBackdrop.querySelector(".jf-modal");
    var scrollTop = oldModal ? oldModal.scrollTop : 0;
    var replacement = document.createElement("div");
    replacement.innerHTML = renderModal();
    var newBackdrop = replacement.firstElementChild;
    if (!newBackdrop) { render(); return; }
    try {
      oldBackdrop.replaceWith(newBackdrop);
    } catch (e) {
      // Last resort: something else already took the node out of the document.
      render();
      return;
    }
    trapModalFocus();
    requestAnimationFrame(function(){
      var modal = document.querySelector(".jf-modal");
      if (modal) modal.scrollTop = scrollTop;
      if (state.mapPickerOpen) {
        dropPickerMapInstance();
        setTimeout(initMapPicker, 0);
      }
    });
  }

  function renderDatalist() {
    var tags = getAllUniqueTags();
    return '<datalist id="existing-tags-list">' + tags.map(function (t) {
      return '<option value="' + esc(t) + '">';
    }).join("") + '</datalist>';
  }

  function renderHeader() {
    return (
      '<header class="jf-header"><div class="jf-header-inner">' +
      '<div class="jf-brand" role="button" tabindex="0" onclick="goHome()" onkeydown="if(event.key===\'Enter\'||event.key===\' \' ){event.preventDefault();goHome();}">' +
      '<div class="jf-stamp" style="width:42px;height:42px;font-size:10px;color:var(--indigo)">JP</div>' +
      '<div><h1 class="jf-title">Japan Finds</h1><p class="jf-subtitle">a running catalog of things worth remembering</p></div>' +
      "</div>" +
      '<div class="jf-header-actions">' +
      '<button class="btn btn-outline" onclick="toggleTheme()">' + (state.theme === "dark" ? "☀️ Light" : "🌙 Dark") + '</button>' +
      '<button class="btn btn-outline' + (state.scrapbookOpen ? ' active' : '') + '" onclick="openScrapbook()">Scrapbook' + (state.notes.length ? ' (' + state.notes.length + ')' : '') + '</button>' +
      '<button class="btn btn-outline" onclick="openCategoryManager()">Categories</button>' +
      '<button class="btn btn-outline" onclick="openBackupModal()">Backup</button>' +
      '<button class="btn btn-outline" onclick="triggerImport()" title="JSON backup, or CSV \u2014 drop in the photos ZIP too to restore images">Import</button>' +
      '<button class="btn btn-outline" ' + (state.entries.length === 0 ? "disabled" : "") + ' onclick="openExportModal()">Export</button>' +
      '<button class="btn btn-outline" onclick="'+(state.mapMode ? 'closeMap()' : 'openMap()')+'">'+(state.mapMode ? 'Back to grid/list' : 'Map')+'</button><button class="btn btn-primary" onclick="openAdd()">+ Add find</button>' +
      "</div></div></header>"
    );
  }

  function renderBanner() {
    // The three controls that actually prevent a bill live in Google Cloud
    // Console, not in this file. Shown until acknowledged, because the in-app
    // caps cannot stop anyone who lifts the key out of this HTML.
    if (!state.apiSafetyAcknowledged) {
      return (
        '<div class="jf-banner"><div class="jf-banner-inner" style="align-items:flex-start">' +
        '<div><p><strong>Before using place-name search, lock down your Google API key.</strong> ' +
        'The key is visible in this file, and the in-app limits only apply to this browser \u2014 they cannot stop anyone who copies it.</p>' +
        '<p style="margin-top:6px">In Google Cloud Console: ' +
        '<strong>1.</strong> restrict the key by HTTP referrer &nbsp; ' +
        '<strong>2.</strong> restrict it to Maps JavaScript, Geocoding and Places only &nbsp; ' +
        '<strong>3.</strong> set a hard quota cap on Places Text Search (a budget alert only emails you; a quota cap actually refuses calls).</p></div>' +
        '<button class="jf-banner-close" onclick="acknowledgeApiSafety()" aria-label="Acknowledge">Done \u2715</button>' +
        "</div></div>"
      );
    }
    if (state.bannerDismissed) return "";
    var bytes = getStorageBytes();
    var sizeStr = formatBytes(bytes);
    var highUsage = bytes > 3 * 1024 * 1024;
    var backupText = state.backupInfo ? " Last automatic backup: " + formatDateTime(state.backupInfo.savedAt) + "." : " Automatic backup is being prepared.";
    var msg = "Your collection saves automatically (" + sizeStr + " used)." + backupText +
      (highUsage ? " <strong>Storage space is growing — you can download a backup anytime.</strong>" : "");
    return (
      '<div class="jf-banner"><div class="jf-banner-inner"><p>' + msg + "</p>" +
      '<button class="jf-banner-close" onclick="dismissBanner()" aria-label="Dismiss">\u2715</button>' +
      "</div></div>"
    );
  }

  function renderImportMessage() {
    if (!state.importMessage) return "";
    return '<div class="jf-importmsg-wrap" id="import-message"><p class="jf-importmsg">' + esc(state.importMessage) + "</p></div>";
  }

  function renderGlobalError() {
    if (!state.globalError) return "";
    return '<div class="jf-errormsg-wrap"><p class="jf-errormsg" role="alert">' + esc(state.globalError) + '</p>' +
      '<button type="button" class="link-btn" onclick="dismissGlobalError()">Dismiss</button></div>';
  }

  window.dismissGlobalError = function () { setGlobalError(null); };

  function tabButtonHtml(id, label, count, active, color, icon, handler) {
    var bg = active ? color : "var(--surface)";
    var fg = active ? "#ffffff" : "var(--ink-soft)";
    var border = active ? color : "var(--line)";
    var fn = handler || ("setActiveCategory(" + escAttrJs(id) + ")");
    return (
      '<button type="button" class="jf-tab" style="background-color:' + esc(bg) + ";color:" + esc(fg) + ";border-color:" + esc(border) + '" onclick="' + fn + '">' +
      (icon ? esc(icon) + " " : "") + esc(label) + ' <span class="jf-tab-count">(' + count + ")</span></button>"
    );
  }

  // Each filter row can be folded on its own. Active filters keep applying
  // while a row is folded; only the buttons are hidden.
  function rowCollapsed(id) { return !!(state.collapsedFilterRows || {})[id]; }
  // "any" (OR, the default) or "all" (AND) for a row of filter buttons.
  function filterMode(id) { return (state.filterModes || {})[id] === "and" ? "and" : "or"; }
  function matchSet(rowId, selected, hasFn) {
    if (!selected.length) return true;
    return filterMode(rowId) === "and" ? selected.every(hasFn) : selected.some(hasFn);
  }
  function modeToggleHtml(id, optionCount) {
    if (optionCount < 2) return "";
    var and = filterMode(id) === "and";
    return '<button type="button" class="jf-mode-toggle' + (and ? ' on' : '') + '" onclick="toggleFilterMode(' + escAttrJs(id) + ')" title="' + (and ? 'Showing entries that match ALL selected. Click for ANY.' : 'Showing entries that match ANY selected. Click for ALL.') + '" aria-pressed="' + and + '">' + (and ? 'all' : 'any') + '</button>';
  }
  window.toggleFilterMode = function (id) {
    if (!state.filterModes) state.filterModes = {};
    state.filterModes[id] = filterMode(id) === "and" ? "or" : "and";
    refreshAfterFilterChange();
  };
  function rowToggleHtml(id, label) {
    var c = rowCollapsed(id);
    return '<button type="button" class="jf-row-toggle" onclick="toggleFilterRow(' + escAttrJs(id) + ')" aria-expanded="' + !c + '" title="' + (c ? 'Show ' : 'Hide ') + esc(label) + '">' + (c ? '\u25b8' : '\u25be') + '</button>';
  }
  // A labelled, foldable row of filter buttons.
  function filterRowHtml(id, label, content, extraClass, trailing, optionCount) {
    return '<div class="jf-tabs ' + (extraClass || 'jf-subcategory-tabs') + '" style="margin-top:6px">' + rowToggleHtml(id, label) +
      '<span class="jf-tag-suggestions-label" style="margin:0 4px 0 0;align-self:center">' + esc(label) + ':</span>' +
      (rowCollapsed(id) ? '' : modeToggleHtml(id, optionCount || 0) + content + (trailing || '')) + '</div>';
  }
  window.toggleFilterRow = function (id) {
    if (!state.collapsedFilterRows) state.collapsedFilterRows = {};
    state.collapsedFilterRows[id] = !state.collapsedFilterRows[id];
    refreshAfterFilterChange();
    syncStickyOffsets();
  };

  function renderFilterBar() {
    // Every count the bar shows is built in ONE pass over the collection,
    // together with the relationship index and id map the item rows need.
    // Previously each tab, subcategory, item button, list option and status
    // option filtered state.entries on its own, making the bar
    // O(buttons × entries) on every rebuild.
    var relIdx = buildRelationIndex();
    var byId = {};
    var catCountGrid = {};   // per category, respecting the active type filter
    var catCountMap = {};    // per category: places with coordinates only
    var itemCatCount = {};   // per category: Items
    var subPairCount = {};   // per category + subcategory pair
    var listCount = {};
    var placeCount = 0, itemCount = 0;
    var visitedCount = 0, wantGo = 0, tried = 0, wantTry = 0;
    state.entries.forEach(function (e) {
      byId[e.id] = e;
      var entryIsPlace = isPlace(e);
      if (entryIsPlace) placeCount++; else itemCount++;
      if (entryIsPlace && e.status === "visited") visitedCount++;
      if (entryIsPlace && e.status === "want-to-go") wantGo++;
      if (!entryIsPlace && e.status === "tried") tried++;
      if (!entryIsPlace && e.status === "want-to-try") wantTry++;
      var typeMatches = state.activeType === "all" || (e.type || "place") === state.activeType;
      var mappable = entryIsPlace && hasCoords(e);
      var subs = e.subcategories || [];
      entryCategories(e).forEach(function (cid) {
        if (typeMatches) catCountGrid[cid] = (catCountGrid[cid] || 0) + 1;
        if (mappable) catCountMap[cid] = (catCountMap[cid] || 0) + 1;
        if (!entryIsPlace) itemCatCount[cid] = (itemCatCount[cid] || 0) + 1;
        subs.forEach(function (sid) {
          var key = cid + "\u0000" + sid;
          subPairCount[key] = (subPairCount[key] || 0) + 1;
        });
      });
      (e.lists || []).forEach(function (lid) { listCount[lid] = (listCount[lid] || 0) + 1; });
    });

    var typeCounts = { all: state.entries.length, place: placeCount, item: itemCount };
    var typeHtml = '<div class="jf-tabs jf-type-tabs">' +
      tabButtonHtml("all", "All", typeCounts.all, state.activeType === "all", "var(--ink)", "\uD83D\uDCDA", "setActiveType(\'all\')") +
      tabButtonHtml("place", "Places", typeCounts.place, state.activeType === "place", "#526B4F", "\uD83D\uDCCD", "setActiveType(\'place\')") +
      tabButtonHtml("item", "Items", typeCounts.item, state.activeType === "item", "#8C6A32", "\uD83D\uDCCB", "setActiveType(\'item\')") + '</div>';
    // In map mode only Places can be pinned, so only Place categories belong in
    // this row. Item categories get their own row below.
    var filteredCats = state.mapMode
      ? CATEGORIES.filter(function(c) { return PLACE_CATEGORY_IDS.indexOf(c.id) !== -1; })
      : (state.activeType === "all" ? CATEGORIES : categoriesForType(state.activeType));
    var selectedCats = Array.isArray(state.activeCategories) ? state.activeCategories : [];
    // A reset control, not a selection. Filling it whenever nothing was selected
    // made an empty filter look like "every category is switched on", which is
    // the opposite of what the row means.
    var catTabs = '<button type="button" class="jf-tab" style="background-color:var(--surface);color:var(--ink-soft);border-color:var(--line)" onclick="clearActiveCategories()">' +
      (state.mapMode ? 'All places' : 'All categories') + '</button>';
    filteredCats.forEach(function(c){
      // In map mode the useful count is "places I could actually pin".
      var n = state.mapMode ? (catCountMap[c.id] || 0) : (catCountGrid[c.id] || 0);
      var active = selectedCats.indexOf(c.id) !== -1;
      var catHtml = tabButtonHtml(c.id,c.label,n,active,c.color,c.icon,"toggleActiveCategory(" + escAttrJs(c.id) + ")");
      catTabs += catHtml;
    });
    if (selectedCats.length) catTabs += '<button type="button" class="btn btn-outline btn-sm" onclick="clearActiveCategories()">Clear ' + (state.mapMode ? 'place ' : '') + 'categories</button>';

    // Subcategories only "pop up" once their parent category is an active filter.
    var selectedSubs = Array.isArray(state.activeSubcategories) ? state.activeSubcategories : [];
    var subTabsHtml = "";
    selectedCats.forEach(function(catId) {
      var subs = CATEGORY_SUBCATEGORIES[catId];
      if (!subs || !subs.length) return;
      var cat = categoryMeta(catId);
      var buttons = subs.map(function(sc) {
        var active = selectedSubs.indexOf(sc.id) !== -1;
        var n = subPairCount[catId + "\u0000" + sc.id] || 0;
        return tabButtonHtml(sc.id, sc.label, n, active, cat.color, sc.icon, "toggleActiveSubcategory(" + escAttrJs(sc.id) + ")");
      }).join("");
      subTabsHtml += filterRowHtml("sub:" + catId, cat.label, buttons, null,
        (selectedSubs.length ? '<button type="button" class="btn btn-outline btn-sm" onclick="clearActiveSubcategories()">Clear</button>' : ''), subs.length);
    });

    // Item categories and individual Items only make sense while Items are in
    // scope, i.e. the type filter is "Items" or "All".
    var selectedItemCats = Array.isArray(state.activeItemCategories) ? state.activeItemCategories : [];
    if (state.mapMode && (state.activeType === "item" || state.activeType === "all")) {
      var itemCats = CATEGORIES.filter(function(c) { return ITEM_CATEGORY_IDS.indexOf(c.id) !== -1; });
      var itemCatButtons = itemCats.map(function(c) {
        var n = itemCatCount[c.id] || 0;
        var active = selectedItemCats.indexOf(c.id) !== -1;
        return tabButtonHtml("item-cat-" + c.id, c.label, n, active, c.color, c.icon,
          "toggleActiveItemCategory(" + escAttrJs(c.id) + ")");
      }).join("");
      subTabsHtml += filterRowHtml("itemcats", "Item categories", itemCatButtons, null,
        (selectedItemCats.length ? '<button type="button" class="btn btn-outline btn-sm" onclick="clearActiveItemCategories()">Clear item categories</button>' : ''));

      // Every Item in the selected categories gets a button, including ones
      // with no linked place yet - the (0) count makes that obvious.
      var mapItems = state.entries.filter(isItem).filter(function(it) {
        if (!selectedItemCats.length) return true;
        return entryCategories(it).some(function(id) { return selectedItemCats.indexOf(id) !== -1; });
      }).sort(function(a,b) { return (a.title || "").localeCompare(b.title || ""); });
      if (mapItems.length) {
        var itemButtons = mapItems.map(function(it) {
          var active = (state.activeMapItemIds || []).indexOf(it.id) !== -1;
          var count = linkedEntries(relIdx.byItem[it.id], byId, isPlace).length;
          return tabButtonHtml("map-item-"+it.id, it.title, count, active, categoryMeta(primaryCategory(it)).color, "\u2022", "toggleMapItemFilter(" + escAttrJs(it.id) + ")");
        }).join("");
        var activeItemCount = (state.activeMapItemIds || []).length;
        subTabsHtml += filterRowHtml("items", "Items", itemButtons, null,
          (activeItemCount ? '<button type="button" class="btn btn-outline btn-sm" onclick="clearMapItemFilters()">Clear items</button>' : ''));
      }
    }

    // Tag rows. In map mode these are two distinct controls with different
    // jobs; everywhere else there is a single tag filter as before.
    var activeTags = Array.isArray(state.activeTags) ? state.activeTags : [];
    var activeItemTags = Array.isArray(state.activeItemTags) ? state.activeItemTags : [];
    var tagFilterHtml = "";

    function tagRowHtml(label, tags, active, toggleFn, clearFn, hint, rowId) {
      if (!tags.length) return "";
      return filterRowHtml(rowId || ("tags:" + label), label, tags.map(function(t) {
          var on = active.indexOf(t) !== -1;
          return '<button type="button" class="jf-tag jf-tag-bubble' + (on ? ' selected' : '') +
            '" onclick="' + toggleFn + '(' + escAttrJs(t) + ')">' + esc(t) + '</button>';
        }).join(''), "jf-tag-filter",
        (active.length ? '<button type="button" class="btn btn-outline btn-sm" onclick="' + clearFn + '()">Clear</button>' : '') +
        (hint && active.length ? '<span class="jf-tag-suggestions-label" style="align-self:center;margin-left:6px">' + esc(hint) + '</span>' : ''), tags.length);
    }

    if (state.mapMode) {
      var placeTagPool = {};
      state.entries.forEach(function(e) {
        if (!isPlace(e)) return;
        (e.tags || []).forEach(function(t) { if (t && t.trim()) placeTagPool[t.trim()] = true; });
      });
      activeTags.forEach(function(t) { placeTagPool[t] = true; });

      var itemTagPool = {};
      if (state.activeType === "item" || state.activeType === "all") {
        state.entries.forEach(function(e) {
          // Only tags on Items that are actually linked to a place can put a
          // pin on the map.
          if (!isItem(e)) return;
          if (!linkedEntries(relIdx.byItem[e.id], byId, isPlace).length) return;
          (e.tags || []).forEach(function(t) { if (t && t.trim()) itemTagPool[t.trim()] = true; });
        });
        activeItemTags.forEach(function(t) { itemTagPool[t] = true; });
      }

      tagFilterHtml =
        tagRowHtml("Place tags", Object.keys(placeTagPool).sort(), activeTags,
          "toggleActiveTag", "clearActiveTags", "narrows the places above", "tags") +
        tagRowHtml("Item tags", Object.keys(itemTagPool).sort(), activeItemTags,
          "toggleActiveItemTag", "clearActiveItemTags", "adds the places carrying those items");
    } else {
      var tagPool = {};
      state.entries.forEach(function(e) {
        var matchesType = state.activeType === "all" || (e.type || "place") === state.activeType;
        if (!matchesType) return;
        var matchesCat = selectedCats.length === 0 || selectedCats.some(function(id) { return hasCategory(e, id); });
        if (!matchesCat) return;
        var matchesSub = selectedSubs.length === 0 || (e.subcategories || []).some(function(id) { return selectedSubs.indexOf(id) !== -1; });
        if (!matchesSub) return;
        (e.tags || []).forEach(function(t) { if (t && t.trim()) tagPool[t.trim()] = true; });
      });
      activeTags.forEach(function(t) { tagPool[t] = true; });
      tagFilterHtml = tagRowHtml("Tags", Object.keys(tagPool).sort(), activeTags,
        "toggleActiveTag", "clearActiveTags", "", "tags");
    }

    var listOptions = '<option value="all"' + (state.activeList === "all" ? " selected" : "") + '>All Lists</option>';
    state.lists.forEach(function(l){ var n=listCount[l.id]||0; listOptions += '<option value="' + esc(l.id) + '"' + (state.activeList===l.id?' selected':'') + '>' + esc(l.name) + ' ('+n+')</option>'; });
    return '<div class="jf-filterbar-sticky' + (state.mapMode ? ' is-static' : '') + '"><div class="jf-filterbar">' +
      '<div class="jf-search"><span class="jf-search-icon" aria-hidden="true">\uD83D\uDD0D</span><input id="search-input" type="text" placeholder="Search your catalog..." value="'+esc(state.searchQuery)+'" oninput="onSearchInput(this.value)"></div>' +
            '<div class="jf-sort"><label for="list-select">List</label><select id="list-select" class="jf-list-filter-select '+(state.activeList!=="all"?"is-active":"")+'" onchange="setActiveList(this.value)">'+listOptions+'</select></div>' +
      '<button type="button" class="jf-fav jf-fav-filter' + (state.activeList === FAVOURITES_LIST_ID ? ' on' : '') + '" onclick="toggleFavouritesFilter()" aria-pressed="' + (state.activeList === FAVOURITES_LIST_ID) + '" title="Show favourites only">' + (state.activeList === FAVOURITES_LIST_ID ? '\u2605' : '\u2606') + '</button>' +
      '<div class="jf-sort"><label for="status-select">Status</label><select id="status-select" onchange="setStatusFilter(this.value)"><option value="all"'+(state.statusFilter==='all'?' selected':'')+'>All Status</option><option value="visited"'+(state.statusFilter==='visited'?' selected':'')+'>Visited ('+visitedCount+')</option><option value="want-to-go"'+(state.statusFilter==='want-to-go'?' selected':'')+'>Want to Go ('+wantGo+')</option><option value="tried"'+(state.statusFilter==='tried'?' selected':'')+'>Tried ('+tried+')</option><option value="want-to-try"'+(state.statusFilter==='want-to-try'?' selected':'')+'>Want to Try ('+wantTry+')</option></select></div>' +
      '<div class="jf-sort"><label for="sort-select">Sort</label><select id="sort-select" onchange="setSort(this.value)"><option value="newest"'+(state.sortBy==='newest'?' selected':'')+'>Newest</option><option value="oldest"'+(state.sortBy==='oldest'?' selected':'')+'>Oldest Added</option><option value="visited-newest"'+(state.sortBy==='visited-newest'?' selected':'')+'>Recently Visited</option><option value="visited-oldest"'+(state.sortBy==='visited-oldest'?' selected':'')+'>Visited Longest Ago</option><option value="name"'+(state.sortBy==='name'?' selected':'')+'>Name A\u2013Z</option><option value="city"'+(state.sortBy==='city'?' selected':'')+'>Group by City</option><option value="distance"'+(state.sortBy==='distance'?' selected':'')+'>Distance</option></select></div>' +
      '<button class="btn btn-outline btn-sm" onclick="openListManager()">Lists</button>' +
      (state.activeList !== "all" ? '<button class="btn btn-outline btn-sm" onclick="openItinerary(' + escAttrJs(state.activeList) + ')">\uD83D\uDDD3 Itinerary</button>' : '') +
      '<button class="btn btn-outline btn-sm' + (state.geoFence ? ' active' : '') + '" onclick="toggleFencePanel()">\u25CE Area' + (state.geoFence ? ' \u2022 on' : '') + '</button>' +
      '<button class="btn btn-outline btn-sm' + (state.viewsPanelOpen ? ' active' : '') + '" onclick="toggleViewsPanel()">\u2630 Views' + (state.savedViews.length ? ' (' + state.savedViews.length + ')' : '') + '</button>' +
      (state.activeViewId && viewById(state.activeViewId)
        ? '<span class="jf-view-chip">' + esc(viewById(state.activeViewId).name) +
          ' <button type="button" class="link-btn" onclick="clearActiveView()" aria-label="Stop using this view">\u00d7</button></span>'
        : '') +
      (state.geoFence ? '<span class="jf-fence-chip">' + esc(fenceDescription()) + ' <button type="button" class="link-btn" onclick="clearGeoFence()" aria-label="Clear area filter">\u00d7</button></span>' : '') +
      (state.mapMode ? '' : '<button class="btn btn-outline btn-sm" onclick="toggleBulkMode()">'+(state.bulkMode?'Exit Select':'Multi-select')+'</button>') +
      // Grid and List choose how the results grid draws itself. In map mode
      // there is no grid, so the toggle sat there doing nothing visible.
      // Hidden rather than disabled, and the setting is untouched, so leaving
      // map mode returns to whichever was last chosen.
      (state.mapMode ? '' : '<div class="jf-view-toggle"><button type="button" class="btn btn-outline btn-sm '+(state.displayMode==='grid'?'active':'')+'" onclick="setDisplayMode(\'grid\')">\u25a6 Grid</button><button type="button" class="btn btn-outline btn-sm '+(state.displayMode==='list'?'active':'')+'" onclick="setDisplayMode(\'list\')">\u2637 List</button></div>') +
      // In map mode these act on the pinned places from getMapPlacePoints()
      // rather than the grid's getFilteredEntries(), so the file and the sheet
      // match what is actually on screen.
      // In map mode the row above is longer (place rows plus item rows), so
      // these two were shuffled around by the wrap. They go in a full-width
      // row of their own instead. A bare break element was tried first and
      // left a doubled gap: as a flex item it collected the container's 16px
      // row-gap both above and below itself, on a line with no height.
      (state.mapMode ? '<div class="jf-filterbar-row">' : '') +
      '<button type="button" class="btn btn-outline btn-sm" ' + (state.entries.length === 0 ? 'disabled ' : '') + 'onclick="openFilteredExport()" title="' + (state.mapMode ? 'Download the pinned places, as a CSV or a CSV plus their photos' : 'Download the entries currently shown, as a CSV or a CSV plus their photos') + '">\u2B07 Export CSV</button>' +
      '<button type="button" class="btn btn-outline btn-sm" ' + (state.entries.length === 0 ? 'disabled ' : '') + 'onclick="printCollection()" title="' + (state.mapMode ? 'Print, or save as PDF, the pinned places' : 'Print, or save as PDF, the entries currently shown') + '">\u2399 Print</button>' +
      (state.mapMode ? '' : '<button type="button" class="btn btn-outline btn-sm" ' + (screenHasProducts() ? '' : 'disabled ') + 'onclick="printProducts()" title="Print, or save as PDF, every product of the items currently shown (or selected)">\u2399 Print products</button>') +
      '<button type="button" class="btn btn-outline btn-sm" onclick="toggleFilterTabs()" aria-expanded="' + (!state.filterTabsCollapsed) + '" aria-controls="jf-filter-tabs" title="Shortcut: H">' +
        (state.filterTabsCollapsed ? '\u25b8 Show categories & tags' : '\u25be Hide categories & tags') + '</button>' +
      (state.mapMode ? '</div>' : '') +
      '<div id="jf-filter-tabs" class="jf-filter-tabs-wrap"' + (state.filterTabsCollapsed ? ' hidden' : '') + '>' +
      typeHtml+filterRowHtml("cats", "Categories", catTabs, "jf-category-tabs", "", 2)+subTabsHtml+tagFilterHtml+'</div>' +
      '</div>' + renderBulkBar() + '</div>';
  }

  function isTypingTarget(el) {
    if (!el || !el.tagName) return false;
    var t = el.tagName.toLowerCase();
    return t === "input" || t === "textarea" || t === "select" || el.isContentEditable;
  }
  // Collapsing only hides the rows; every active filter keeps applying, so the
  // button is safe to press mid-search.
  window.toggleFilterTabs = function () {
    state.filterTabsCollapsed = !state.filterTabsCollapsed;
    refreshAfterFilterChange();
    syncStickyOffsets();
  };

  // Writes the live header height to --jf-header-h so the sticky filter bar
  // sits flush under it whatever the viewport width.
  function syncStickyOffsets() {
    var header = document.querySelector(".jf-header");
    var h = header ? header.offsetHeight : 0;
    document.documentElement.style.setProperty("--jf-header-h", h + "px");
  }
  window.addEventListener("resize", syncStickyOffsets);

  // The pool the ringfence controls reason about: every Place that could be
  // pinned. Clustering the already-fenced set would make the fence impossible
  // to widen again without clearing it first.
  function fenceCandidatePlaces() {
    return state.entries.filter(function (e) {
      if (!isPlace(e) || !hasCoords(e)) return false;
      if (state.activeList !== "all" && (e.lists || []).indexOf(state.activeList) === -1) return false;
      return true;
    });
  }

  function renderFencePanel() {
    if (!state.fencePanelOpen) return "";
    var pool = fenceCandidatePlaces();
    var scopeNote = state.activeList !== "all" ? ' in \u201c' + esc(listName(state.activeList)) + '\u201d' : "";

    if (!pool.length) {
      return '<div class="jf-fence-panel"><h3>Area</h3>' +
        '<p class="jf-fence-hint">No place' + scopeNote + ' has a map location yet, so there is nothing to fence. Edit a place and use \u201cPick on map\u201d.</p>' +
        '<div class="jf-fence-row" style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="toggleFencePanel()">Close</button></div></div>';
    }

    var totalSpread = spreadKm(pool);
    var spreadClass = totalSpread > DAY_SPREAD_WARN_KM ? " wide" : "";

    // --- radius ---
    var placeOptions = pool.slice().sort(function (a, b) { return (a.title || "").localeCompare(b.title || ""); })
      .map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.title) + (e.city ? " \u2014 " + esc(e.city) : "") + '</option>'; }).join("");
    var radiusHtml =
      '<div class="jf-fence-section"><strong>Radius</strong>' +
      '<div class="jf-fence-row">' +
      '<label class="jf-fence-hint" for="fence-radius-km" style="margin:0">Within</label>' +
      '<input id="fence-radius-km" type="number" min="0.2" max="500" step="0.5" value="' + esc(String(state.fenceRadiusKm)) + '" style="width:80px" onchange="setFenceRadius(this.value)"> ' +
      '<span class="jf-fence-hint" style="margin:0">km of\u2026</span>' +
      '<select id="fence-center-place" onchange="fenceAroundPlace(this.value)"><option value="">a saved place\u2026</option>' + placeOptions + '</select>' +
      '<button class="btn btn-outline btn-sm" onclick="fenceAroundMe()">\uD83D\uDCCD My location</button>' +
      (state.mapMode ? '<button class="btn btn-outline btn-sm" onclick="fenceAroundMapCentre()">Centre of map view</button>' : '') +
      '</div></div>';

    // --- clusters ---
    var clusters = computeClusters(pool, state.fenceClusterKm);
    var clusterBtns = clusters.filter(function (c) { return c.count > 0; }).map(function (c) {
      return '<button type="button" class="jf-cluster-btn" onclick="fenceToCluster(' + escAttrJs(c.id) + ',' + escAttrJs(String(state.fenceClusterKm)) + ')">' +
        esc(c.label) + ' \u2014 ' + c.count + ' place' + (c.count === 1 ? '' : 's') +
        '<small>' + (c.spreadKm < 0.05 ? 'same spot' : formatKm(c.spreadKm) + ' across') + '</small></button>';
    }).join("");
    var clusterHtml =
      '<div class="jf-fence-section"><strong>Automatic areas</strong>' +
      '<div class="jf-fence-row" style="margin-bottom:8px">' +
      '<span class="jf-fence-hint" style="margin:0">Group places within</span>' +
      '<input id="fence-cluster-km" type="number" min="0.1" max="50" step="0.1" value="' + esc(String(state.fenceClusterKm)) + '" style="width:70px" onchange="setClusterThreshold(this.value)">' +
      '<span class="jf-fence-hint" style="margin:0">km of each other</span>' +
      '</div>' +
      '<div class="jf-fence-row">' + (clusterBtns || '<span class="jf-fence-hint">No groups at this distance.</span>') + '</div>' +
      '<p class="jf-fence-hint">Places chain together: two places join the same area when they are within that distance of <em>each other</em>, not of a fixed centre.</p>' +
      '</div>';

    // --- box ---
    var boxHtml =
      '<div class="jf-fence-section"><strong>Box</strong>' +
      '<div class="jf-fence-row">' +
      (state.mapMode
        ? '<button class="btn btn-outline btn-sm" onclick="fenceToMapView()">Use current map view</button>' +
          '<button class="btn btn-outline btn-sm" onclick="startBoxDraw()">' + (state.fenceBoxDrawing ? 'Drawing\u2026 click two corners' : '\u270E Draw a box on the map') + '</button>' +
          (state.fenceBoxDrawing ? '<button class="btn btn-outline btn-sm" onclick="cancelBoxDraw()">Cancel</button>' : '')
        : '<span class="jf-fence-hint">Open the Map to draw a box or use the current view.</span>' +
          '<button class="btn btn-outline btn-sm" onclick="openMap()">Open map</button>') +
      '</div>' +
      (state.fenceBoxDrawing && state.fenceBoxCorner ? '<p class="jf-fence-hint">First corner set. Click the opposite corner.</p>' : '') +
      '</div>';

    return '<div class="jf-fence-panel">' +
      '<h3>Area</h3>' +
      '<p class="jf-spread' + spreadClass + '">' + pool.length + ' mapped place' + (pool.length === 1 ? '' : 's') + scopeNote +
      (pool.length > 1 ? ', spanning ' + formatKm(totalSpread) + ' end to end' : '') + '.' +
      (totalSpread > DAY_SPREAD_WARN_KM ? ' Too far apart to cover in one go \u2014 fence to an area below.' : '') + '</p>' +
      radiusHtml + clusterHtml + boxHtml +
      '<div class="jf-fence-section jf-fence-row">' +
      (state.geoFence ? '<button class="btn btn-outline btn-sm" onclick="clearGeoFence()">Clear area filter</button>' : '') +
      '<button class="btn btn-outline btn-sm" onclick="toggleFencePanel()">Close</button>' +
      '<span class="jf-fence-hint" style="margin:0">While an area filter is on, Items are hidden \u2014 it is a question about places. Places with no map location are never hidden.</span>' +
      '</div></div>';
  }

  function renderBulkBar() {
    if (!state.bulkMode || state.mapMode) return "";
    var selectedCount = selectedEntryIds().length;
    if (state.bulkDeleteConfirm && selectedCount) {
      return (
        '<div class="jf-bulk-bar">' +
        '<div class="jf-confirm-row">Delete ' + selectedCount + ' selected ' + (selectedCount === 1 ? 'entry' : 'entries') + '? ' +
        '<button class="link-btn danger" onclick="bulkDeleteSelected()">Yes, delete</button> ' +
        '<button class="link-btn" onclick="cancelBulkDelete()">Cancel</button></div>' +
        '</div>'
      );
    }
    if (state.bulkLinkPrompt && selectedCount) {
      var toPlace = state.bulkLinkPrompt === "place";
      var targets = state.entries.filter(toPlace ? isPlace : isItem).sort(byTitle);
      return (
        '<div class="jf-bulk-bar" style="align-items:flex-start">' +
        '<div style="flex:1;min-width:260px"><strong>Link ' + selectedCount + ' selected ' + (toPlace ? 'item' : 'place') + (selectedCount === 1 ? '' : 's') + ' to ' + (toPlace ? 'a place' : 'an item') + '</strong>' +
        '<div style="margin-top:8px">' + searchPickerHtml("bulk-link-picker", toPlace ? "Type to find the place\u2026" : "Type to find the item\u2026", pickerCandidates(targets), "bulkLinkConfirm", toPlace ? "No places to link to." : "No items to link to.") + '</div></div>' +
        '<button class="btn btn-outline btn-sm" onclick="cancelBulkLink()">Cancel</button>' +
        '</div>'
      );
    }
    if (state.bulkTagPromptOpen && selectedCount) {
      return (
        '<div class="jf-bulk-bar">' +
        '<strong>Add tag to ' + selectedCount + ' selected</strong>' +
        '<input id="bulk-tag-input" type="text" value="' + esc(state.bulkTagDraft || "") + '" placeholder="e.g. gift" ' +
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();bulkAddTagConfirm();}if(event.key===\'Escape\'){event.preventDefault();cancelBulkTagPrompt();}" style="max-width:200px">' +
        '<button class="btn btn-primary btn-sm" onclick="bulkAddTagConfirm()">Add</button>' +
        '<button class="btn btn-outline btn-sm" onclick="cancelBulkTagPrompt()">Cancel</button>' +
        '</div>'
      );
    }
    return (
      '<div class="jf-bulk-bar">' +
      '<strong>' + selectedCount + ' selected</strong>' +
      '<button class="btn btn-outline btn-sm" onclick="bulkSelectAll()">Select All</button>' +
      '<button class="btn btn-outline btn-sm" onclick="bulkDeselectAll()">Clear</button>' +
      '<button class="btn btn-outline btn-sm" ' + (selectedCount === 0 ? "disabled" : "") + ' onclick="bulkSetStatus(\'visited\')">Mark Visited / Tried</button>' +
      '<button class="btn btn-outline btn-sm" ' + (selectedCount === 0 ? "disabled" : "") + ' onclick="bulkSetStatus(\'want-to-go\')">Mark Want to Go / Try</button>' +
      '<button class="btn btn-outline btn-sm" ' + (selectedCount === 0 ? "disabled" : "") + ' onclick="startBulkTagPrompt()">Add Tag</button>' +
      bulkLinkButtonHtml(selectedCount) +
      '<button class="btn btn-danger btn-sm" ' + (selectedCount === 0 ? "disabled" : "") + ' onclick="confirmBulkDelete()">Delete Selected</button>' +
      '</div>'
    );
  }

  // The link button depends on what is ticked: all items can be linked to a
  // place, all places to an item, a mix to nothing.
  function bulkLinkButtonHtml(selectedCount) {
    var ids = selectedEntryIds();
    var items = ids.filter(function (id) { var e = entryById(id); return e && isItem(e); }).length;
    var places = ids.length - items;
    if (!ids.length) return '<button class="btn btn-outline btn-sm" disabled>Link to\u2026</button>';
    if (items && places) return '<button class="btn btn-outline btn-sm" disabled title="Select only items or only places to link them">Link to\u2026</button>';
    return items
      ? '<button class="btn btn-outline btn-sm" onclick="startBulkLink(\'place\')">Link to a place\u2026</button>'
      : '<button class="btn btn-outline btn-sm" onclick="startBulkLink(\'item\')">Link to an item\u2026</button>';
  }
  window.startBulkLink = function (target) { state.bulkLinkPrompt = target; state.bulkTagPromptOpen = false; render(); setTimeout(function () { var i = document.querySelector("#bulk-link-picker input"); if (i) i.focus(); }, 0); };
  window.cancelBulkLink = function () { state.bulkLinkPrompt = null; render(); };
  window.bulkLinkConfirm = function (targetId) {
    var target = entryById(targetId); if (!target) return;
    var ids = selectedEntryIds(), added = 0;
    ids.forEach(function (id) {
      var e = entryById(id); if (!e) return;
      var placeId = isPlace(target) ? target.id : id, itemId = isPlace(target) ? id : target.id;
      if (isPlace(target) ? !isItem(e) : !isPlace(e)) return;
      if (relationExists(placeId, itemId)) return;
      state.relationships.push({ id: makeId(), placeId: placeId, itemId: itemId });
      added++;
    });
    state.bulkLinkPrompt = null;
    persistEntries();
    state.importMessage = added + " link" + (added === 1 ? "" : "s") + " added to \u201c" + target.title + "\u201d" + (added < ids.length ? " (" + (ids.length - added) + " already linked)" : "") + ".";
    render();
    scheduleClearImportMessage();
  };

  // Why each pin is on the map: "place" (a place category matched, or no row is
  // active), "item" (it is only here because of an item filter), or "both".
  var mapPinReasons = {};

  function getMapPlacePoints() {
    mapPinReasons = {};
    var selectedCats = Array.isArray(state.activeCategories) ? state.activeCategories : [];
    var selectedSubs = Array.isArray(state.activeSubcategories) ? state.activeSubcategories : [];
    var selectedTags = Array.isArray(state.activeTags) ? state.activeTags : [];
    var selectedItems = Array.isArray(state.activeMapItemIds) ? state.activeMapItemIds : [];
    var selectedItemCats = Array.isArray(state.activeItemCategories) ? state.activeItemCategories : [];
    var selectedItemTags = Array.isArray(state.activeItemTags) ? state.activeItemTags : [];
    var q = (state.searchQuery || "").trim().toLowerCase();

    // Indexed once per call: the loop below needs "items carried by this
    // place" for every candidate, and scanning state.relationships plus
    // state.entries per place made this quadratic in collection size.
    var relIdx = buildRelationIndex();
    var byId = {};
    state.entries.forEach(function (en) { byId[en.id] = en; });

    var candidates = state.entries.filter(isPlace).filter(function(e) {
      if (state.activeList !== "all" && (e.lists || []).indexOf(state.activeList) === -1) return false;

      // ---- The rows CHOOSE which pins go on the map, and combine ----
      // A row only contributes if the user has actually touched it. An untouched
      // row contributes nothing rather than "everything" - that is what lets you
      // narrow to a single item, while still layering other places on top.
      var placeCats = selectedCats.filter(function(id) { return PLACE_CATEGORY_IDS.indexOf(id) !== -1; });
      // Subcategories refine the place row rather than acting as a row of their own.
      var placeSubs = selectedSubs.filter(function(id) {
        return PLACE_CATEGORY_IDS.some(function(catId) {
          return (CATEGORY_SUBCATEGORIES[catId] || []).some(function(sc) { return sc.id === id; });
        });
      });
      var carried = linkedEntries(relIdx.byPlace[e.id], byId, isItem);

      // The place row is categories + subcategories + place tags, all refining
      // one another. Place tags narrow which PLACES qualify; they deliberately
      // do not strip out pins contributed by the item rows.
      var placeRowTouched = placeCats.length > 0 || placeSubs.length > 0 || selectedTags.length > 0;
      var viaPlaceCat = placeRowTouched &&
        matchSet("cats", placeCats, function(id) { return hasCategory(e, id); }) &&
        (placeSubs.length === 0 || entryCategories(e).every(function(catId) {
          var subsHere = (CATEGORY_SUBCATEGORIES[catId] || []).map(function(sc) { return sc.id; }).filter(function(id) { return placeSubs.indexOf(id) !== -1; });
          return matchSet("sub:" + catId, subsHere, function(id) { return (e.subcategories || []).indexOf(id) !== -1; });
        })) &&
        // Place tags are cumulative: each one you add brings in more places,
        // matching how the category and item rows combine within themselves.
        matchSet("tags", selectedTags, function(tag) { return (e.tags || []).indexOf(tag) !== -1; });

      var viaItemCat = selectedItemCats.length > 0 && carried.some(function(it) {
        return entryCategories(it).some(function(c) { return selectedItemCats.indexOf(c) !== -1; });
      });

      var viaItem = selectedItems.length > 0 && selectedItems.some(function(itemId) {
        return carried.some(function(it) { return it.id === itemId; });
      });

      // Item tags choose: they add the places carrying an item with that tag.
      var viaItemTag = selectedItemTags.length > 0 && carried.some(function(it) {
        return (it.tags || []).some(function(t) { return selectedItemTags.indexOf(t) !== -1; });
      });

      var viaAnyItem = viaItemCat || viaItem || viaItemTag;
      var anyRowActive = placeRowTouched || selectedItemCats.length > 0 ||
        selectedItems.length > 0 || selectedItemTags.length > 0;
      if (anyRowActive && !viaPlaceCat && !viaAnyItem) return false;

      // Record why this pin is here, so the marker can show it.
      mapPinReasons[e.id] = !anyRowActive ? "place"
        : (viaPlaceCat && viaAnyItem) ? "both"
        : viaAnyItem ? "item" : "place";

      // ---- Everything below NARROWS whatever the rows chose ----
      // The ringfence narrows too. On the map every candidate has coordinates,
      // so here the fence is an unconditional geographic cut.
      if (!entryInFence(e)) return false;

      // Item statuses (tried / want-to-try) cannot apply to a place pin.
      if (state.statusFilter !== "all" && ["visited","want-to-go"].indexOf(state.statusFilter) !== -1 &&
          e.status !== state.statusFilter) return false;

      if (!q) return true;
      return (
        (e.title || "").toLowerCase().indexOf(q) !== -1 ||
        (e.notes || "").toLowerCase().indexOf(q) !== -1 ||
        (e.location || "").toLowerCase().indexOf(q) !== -1 ||
        (e.city || "").toLowerCase().indexOf(q) !== -1 ||
        (e.neighborhood || "").toLowerCase().indexOf(q) !== -1 ||
        (e.website || "").toLowerCase().indexOf(q) !== -1 ||
        (e.tags || []).some(function(t) { return t.toLowerCase().indexOf(q) !== -1; })
      );
    });

    return candidates.filter(hasCoords);
  }

  // With an area filter on, the map alone does not say WHICH places are inside
  // it - pins are unlabelled and can overlap. This is that answer in list form,
  // in the same order the grid would use.
  function renderFencedPlacesList(points) {
    if (!state.geoFence) return "";
    // Indexed once for the per-row "carries N items" count below.
    var relIdx = buildRelationIndex();
    var byId = {};
    state.entries.forEach(function (en) { byId[en.id] = en; });
    var centre = Number.isFinite(state.geoFence.lat) && Number.isFinite(state.geoFence.lng)
      ? { lat: state.geoFence.lat, lng: state.geoFence.lng } : null;
    var rows = points.slice().sort(function (a, b) {
      if (centre) {
        return getDistanceKm(centre.lat, centre.lng, entryLat(a), entryLng(a)) -
               getDistanceKm(centre.lat, centre.lng, entryLat(b), entryLng(b));
      }
      return (a.title || "").localeCompare(b.title || "");
    }).map(function (e) {
      var cat = categoryMeta(primaryCategory(e));
      var where = [e.neighborhood, e.city, e.prefecture].filter(Boolean).join(" \u00b7 ");
      var dist = centre ? formatKm(getDistanceKm(centre.lat, centre.lng, entryLat(e), entryLng(e))) : "";
      var carried = linkedEntries(relIdx.byPlace[e.id], byId, isItem);
      return '<li class="jf-fenced-row">' +
        '<span class="jf-fenced-dot" style="background:' + esc(cat.color) + '">' + esc(cat.icon || cat.abbr) + '</span>' +
        '<span class="jf-fenced-main"><strong>' + esc(e.title || "Untitled") + '</strong>' +
        '<span class="jf-optional">' + esc(cat.label) + (where ? " \u00b7 " + esc(where) : "") +
        (carried.length ? " \u00b7 " + carried.length + " item" + (carried.length === 1 ? "" : "s") : "") + '</span></span>' +
        (dist ? '<span class="jf-fenced-dist">' + esc(dist) + '</span>' : '') +
        '<span class="jf-fenced-actions">' +
        '<button type="button" class="btn btn-outline btn-sm" onclick="showEntryOnMap(' + escAttrJs(e.id) + ')">Centre</button>' +
        '<button type="button" class="btn btn-outline btn-sm" onclick="openView(' + escAttrJs(e.id) + ')">Open</button>' +
        '</span></li>';
    }).join("");

    var unmapped = state.entries.filter(function (e) { return isPlace(e) && !hasCoords(e); }).length;
    return '<section class="jf-fenced-list">' +
      '<div class="jf-fenced-head"><h3>Places ' + esc(fenceDescription()) + '</h3>' +
      '<span class="jf-optional">' + points.length + ' place' + (points.length === 1 ? '' : 's') +
      (centre ? ', nearest first' : '') + '</span>' +
      '<button type="button" class="btn btn-outline btn-sm" onclick="clearGeoFence()">Clear area filter</button></div>' +
      (points.length ? '<ul>' + rows + '</ul>' : '<p class="jf-optional">No place falls inside this area with the current filters.</p>') +
      (unmapped ? '<p class="jf-optional">' + unmapped + ' place' + (unmapped === 1 ? ' has' : 's have') + ' no map location and cannot be tested against an area.</p>' : '') +
      '</section>';
  }

  function statusFilterLabel(status) {
    return status === "visited" ? "Visited"
      : status === "want-to-go" ? "Want to Go"
      : status === "tried" ? "Tried"
      : status === "want-to-try" ? "Want to Try"
      : status;
  }

  // One plain-English statement of what is on the map, so it never has to be
  // inferred from which buttons look highlighted.
  function mapShowingSummary() {
    var chosen = [];
    var placeCats = (state.activeCategories || []).filter(function(id) { return PLACE_CATEGORY_IDS.indexOf(id) !== -1; });
    var placeTags = state.activeTags || [];
    if (placeCats.length || placeTags.length) {
      var placePart = placeCats.length ? placeCats.map(function(id) { return categoryMeta(id).label; }).join(", ") : "places";
      if (placeTags.length) placePart += " tagged " + placeTags.join(" or ");
      chosen.push(placePart);
    }
    var itemCats = state.activeItemCategories || [];
    if (itemCats.length) chosen.push("places carrying any " + itemCats.map(function(id) { return categoryMeta(id).label; }).join(" or "));
    var itemTags = state.activeItemTags || [];
    if (itemTags.length) chosen.push("places carrying anything tagged " + itemTags.join(" or "));
    var items = state.activeMapItemIds || [];
    if (items.length) {
      var titles = items.map(function(id) {
        var it = state.entries.find(function(e) { return e.id === id; });
        return it ? it.title : id;
      });
      chosen.push("places carrying " + titles.join(" or "));
    }
    var base = chosen.length ? chosen.join(", plus ") : "all places";

    var narrowed = [];
    if (state.activeList !== "all") narrowed.push('the list \u201c' + listName(state.activeList) + '\u201d');
    if (state.statusFilter !== "all") narrowed.push("status " + statusFilterLabel(state.statusFilter));
    if (state.geoFence) narrowed.push("area " + fenceDescription());
    if ((state.searchQuery || "").trim()) narrowed.push('search \u201c' + state.searchQuery.trim() + '\u201d');

    return "Showing: " + base + (narrowed.length ? ", narrowed by " + narrowed.join(" and ") : "") + ".";
  }

  // Says how scattered the visible pins are, which is the whole point of the
  // ringfence: a map spanning several cities is not a map you can act on.
  function spreadSentence(points) {
    if (!points || points.length < 2) return "";
    var km = spreadKm(points);
    var s = "Pins span " + formatKm(km) + " end to end";
    if (km > DAY_SPREAD_WARN_KM) s += " \u2014 use Area to narrow to one part of the map.";
    else s += ".";
    return s;
  }

  // ---------- offline ----------
  // Everything except the map is local: entries, photos, lists, itineraries,
  // categories, export and import all run out of IndexedDB. Only three things
  // need the network - Google's map tiles, place-name search and reverse
  // geocoding - so being offline disables exactly those and says so, rather
  // than leaving the map area blank or reporting an API key problem.
  // Deliberately not conditioned on googleMapsLoaded: while the script is
  // still in flight the real map container must stay on the page, or the
  // callback would arrive to find nothing to draw into.
  function mapsUnavailable() {
    return !state.online || state.mapsScriptFailed;
  }

  function offlineReasonText() {
    if (!state.online) return "You are offline.";
    return "Google Maps could not be reached.";
  }

  function renderOfflineBanner() {
    if (state.online || state.offlineNoticeDismissed) return "";
    return (
      '<div class="jf-offline-banner"><div class="jf-offline-banner-inner">' +
      '<p><strong>Offline.</strong> Your collection, photos, lists, itineraries, export and import all keep working \u2014 they are stored in this browser. ' +
      'Google map tiles, place-name search and address lookup need a connection, so the map falls back to a plotted chart of your saved coordinates and new pins have to be typed in as latitude and longitude.</p>' +
      '<button class="jf-banner-close" onclick="dismissOfflineNotice()" aria-label="Dismiss">\u2715</button>' +
      "</div></div>"
    );
  }

  // A plot of the saved coordinates, drawn from the entries themselves. It is
  // not a map of Japan - there is no basemap without a connection - but it
  // does answer the question the map is usually asked offline: which of these
  // places are near each other, and roughly how far apart are they.
  var OFFLINE_SCALE_STEPS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];

  function renderOfflineMap(points) {
    var mapped = (points || []).filter(hasCoords);
    if (!mapped.length) {
      return '<div class="jf-map" style="display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">' +
        '<p class="jf-map-help" style="margin:0">' + esc(offlineReasonText()) +
        ' None of the places currently shown has a saved map location, so there is nothing to plot.</p></div>';
    }

    var b = boundsOfEntries(mapped);
    // A single point, or several at the same address, would give a zero-width
    // box and an infinite scale, so the box is always given a floor.
    var padLat = Math.max((b.north - b.south) * 0.12, 0.004);
    var padLng = Math.max((b.east - b.west) * 0.12, 0.004);
    var north = b.north + padLat, south = b.south - padLat;
    var east = b.east + padLng, west = b.west - padLng;

    var W = 1000, H = 620, M = 48;
    // Longitude degrees are narrower than latitude degrees away from the
    // equator; without this correction a Tokyo plot comes out stretched
    // sideways and the distances read wrong.
    var midLat = (north + south) / 2;
    var cosLat = Math.cos(midLat * Math.PI / 180) || 1;
    var spanX = (east - west) * cosLat, spanY = north - south;
    var scale = Math.min((W - 2 * M) / spanX, (H - 2 * M) / spanY);
    var drawW = spanX * scale, drawH = spanY * scale;
    var offX = (W - drawW) / 2, offY = (H - drawH) / 2;
    function px(lng) { return offX + (lng - west) * cosLat * scale; }
    function py(lat) { return offY + (north - lat) * scale; }

    var kmAcross = getDistanceKm(midLat, west, midLat, east);
    var kmPerPx = drawW > 0 ? kmAcross / drawW : 0;

    // Plotted in the order the grid would use, and numbered, because pins that
    // overlap cannot be told apart by position alone.
    var sorted = mapped.slice();
    var showLabels = sorted.length <= 40;

    var pinsSvg = sorted.map(function (e, i) {
      var x = px(entryLng(e)), y = py(entryLat(e));
      var color = mapMarkerColor(e);
      var n = i + 1;
      var label = "";
      if (showLabels) {
        var flip = x > W - 170;
        label = '<text class="jf-om-label" x="' + (flip ? (x - 13).toFixed(1) : (x + 13).toFixed(1)) + '" y="' + (y + 4).toFixed(1) + '"' +
          (flip ? ' text-anchor="end"' : '') + '>' + esc(String(e.title || "Untitled").slice(0, 26)) + '</text>';
      }
      return '<g class="jf-om-pin" role="button" tabindex="0" ' +
        activationAttrs("openView(" + escAttrJs(e.id) + ")") +
        ' onclick="openView(' + escAttrJs(e.id) + ')">' +
        '<title>' + esc(e.title || "Untitled") + (e.city ? " \u2014 " + esc(e.city) : "") + '</title>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" fill="' + esc(color) + '" stroke="#ffffff" stroke-width="2"></circle>' +
        '<text x="' + x.toFixed(1) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#ffffff">' + n + '</text>' +
        label + '</g>';
    }).join("");

    // Scale bar: the largest round distance that fits in a quarter of the plot.
    var barSvg = "";
    if (kmPerPx > 0) {
      var targetKm = kmPerPx * (drawW / 4);
      var stepKm = OFFLINE_SCALE_STEPS[0];
      OFFLINE_SCALE_STEPS.forEach(function (s) { if (s <= targetKm) stepKm = s; });
      var barPx = stepKm / kmPerPx;
      var bx = offX, by = offY + drawH + 22;
      barSvg = '<g><line x1="' + bx.toFixed(1) + '" y1="' + by.toFixed(1) + '" x2="' + (bx + barPx).toFixed(1) + '" y2="' + by.toFixed(1) + '" stroke="var(--ink-soft)" stroke-width="2"></line>' +
        '<line x1="' + bx.toFixed(1) + '" y1="' + (by - 4).toFixed(1) + '" x2="' + bx.toFixed(1) + '" y2="' + (by + 4).toFixed(1) + '" stroke="var(--ink-soft)" stroke-width="2"></line>' +
        '<line x1="' + (bx + barPx).toFixed(1) + '" y1="' + (by - 4).toFixed(1) + '" x2="' + (bx + barPx).toFixed(1) + '" y2="' + (by + 4).toFixed(1) + '" stroke="var(--ink-soft)" stroke-width="2"></line>' +
        '<text class="jf-om-axis" x="' + (bx + barPx + 8).toFixed(1) + '" y="' + (by + 4).toFixed(1) + '">' + esc(formatKm(stepKm)) + ' (straight line)</text></g>';
    }

    var frameSvg = '<rect x="' + offX.toFixed(1) + '" y="' + offY.toFixed(1) + '" width="' + drawW.toFixed(1) + '" height="' + drawH.toFixed(1) + '" fill="none" stroke="var(--line)" stroke-width="1"></rect>' +
      '<text class="jf-om-axis" x="' + offX.toFixed(1) + '" y="' + (offY - 8).toFixed(1) + '">' + north.toFixed(4) + '\u00b0N, ' + west.toFixed(4) + '\u00b0E</text>' +
      '<text class="jf-om-axis" x="' + (offX + drawW).toFixed(1) + '" y="' + (offY + drawH + 14).toFixed(1) + '" text-anchor="end">' + south.toFixed(4) + '\u00b0N, ' + east.toFixed(4) + '\u00b0E</text>';

    var keyHtml = '<ol class="jf-map-legend" style="display:block;columns:2;column-gap:24px;padding-left:20px;margin-top:10px">' +
      sorted.map(function (e) {
        return '<li style="break-inside:avoid;margin-bottom:2px">' + esc(e.title || "Untitled") +
          (e.city ? ' \u00b7 ' + esc(e.city) : '') + '</li>';
      }).join("") + '</ol>';

    return '<svg class="jf-offline-map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Plot of saved place coordinates">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--surface-2)"></rect>' +
      frameSvg + barSvg + pinsSvg + '</svg>' +
      '<p class="jf-offline-note">' + esc(offlineReasonText()) +
      ' This is a plot of your saved coordinates, not a map \u2014 there are no streets or coastlines without a connection. ' +
      'Pins keep their category colour, and clicking one opens the entry.' +
      (showLabels ? '' : ' Names are hidden above ' + 40 + ' pins; use the numbered key below.') + '</p>' +
      keyHtml;
  }

  window.dismissOfflineNotice = function () {
    state.offlineNoticeDismissed = true;
    renderPreservingScroll();
  };

  // One listener pair drives the banner, the map fallback and the disabled
  // state of every control that needs the network.
  window.addEventListener("offline", function () {
    state.online = false;
    state.offlineNoticeDismissed = false;
    if (state.mapMode) { destroyGoogleMap(); render(); }
    else render();
  });

  window.addEventListener("online", function () {
    state.online = true;
    // A load failure recorded while offline says nothing about the key, so it
    // is cleared and the map is allowed to try again.
    state.mapsScriptFailed = false;
    render();
    if (state.mapMode && googleMapsLoaded) setTimeout(function () { initMap(state.mapFocusId || null); }, 0);
  });

  // Only shown while an item row (item category, item, item tag) is active,
  // because that is the only time a place can appear as something other
  // than the ordinary pin.
  function mapLegendHtml() {
    var itemRowsOn = (state.activeItemCategories || []).length || (state.activeMapItemIds || []).length || (state.activeItemTags || []).length;
    if (!itemRowsOn) return "";
    function diamond(fill) { return '<svg width="16" height="16" viewBox="-13 -13 26 26" aria-hidden="true"><path d="M 0 -12 L 11 0 L 0 12 L -11 0 Z" fill="' + fill + '" stroke="#fff" stroke-width="2"/></svg>'; }
    var pin = '<svg width="14" height="18" viewBox="-12 -34 24 36" aria-hidden="true"><path d="' + PIN_PATH + '" fill="' + PIN_COLOR + '" stroke="#fff" stroke-width="1.5"/></svg>';
    return '<div class="jf-map-legend" aria-label="Map legend">' +
      '<span>' + pin + ' matches the place filters</span>' +
      '<span>' + diamond(DIAMOND_ITEM_COLOR) + ' here only because it carries a filtered item</span>' +
      '<span>' + diamond(DIAMOND_BOTH_COLOR) + ' both</span>' +
      '</div>';
  }
  function renderMapView() {
    var points = getMapPlacePoints();
    var loading = !googleMapsLoaded
      ? '<p class="jf-map-help">Loading Google Maps…</p>'
      : '';

    var itemRowsActive = (state.activeItemCategories || []).length > 0 ||
      (state.activeMapItemIds || []).length > 0 || (state.activeItemTags || []).length > 0;
    var mapLegend = mapLegendHtml();

    // Rows combine, but the narrowing filters still apply, so a combination
    // with no match is still reachable. Say so rather than showing a blank map.
    var emptyNote = '';
    if (!points.length && state.entries.filter(isPlace).length) {
      var active = [];
      if ((state.activeCategories || []).length) active.push('place categor' + (state.activeCategories.length === 1 ? 'y' : 'ies'));
      if ((state.activeTags || []).length) active.push('place tag' + (state.activeTags.length === 1 ? '' : 's'));
      if ((state.activeItemCategories || []).length) active.push('item categor' + (state.activeItemCategories.length === 1 ? 'y' : 'ies'));
      if ((state.activeMapItemIds || []).length) active.push((state.activeMapItemIds.length === 1 ? 'an item' : 'items'));
      if ((state.activeItemTags || []).length) active.push('item tags');
      if (state.statusFilter !== "all") active.push('status');
      if (state.activeList !== "all") active.push('a list');
      if ((state.searchQuery || "").trim()) active.push('a search');
      emptyNote = active.length
        ? '<p class="jf-map-help">No place matches the current filters (' + esc(active.join(', ')) + '). Place categories and selected items are combined, but the remaining filters each narrow the result further.</p>'
        : '<p class="jf-map-help">None of your places have a map location yet. Edit one and use "Pick on map".</p>';
    }

    return '<main class="jf-main">' +
      '<div class="jf-map-header">' +
        '<div><h2 class="jf-map-title">Map</h2><p class="jf-map-subtitle">Your saved places, powered by Google Maps.</p></div>' +
        '<div class="jf-map-help"><span id="map-count">' + points.length + ' mapped place' + (points.length === 1 ? '' : 's') + '</span>' +
          '<span class="jf-spread' + (spreadKm(points) > DAY_SPREAD_WARN_KM ? ' wide' : '') + '" id="map-spread">' + esc(spreadSentence(points)) + '</span></div>' +
        '<p class="jf-map-showing" id="map-showing">' + esc(mapShowingSummary()) + '</p>' +
        (state.fenceBoxDrawing ? '<p class="jf-fence-hint">' + (state.fenceBoxCorner ? 'Click the opposite corner of the box.' : 'Click the first corner of the box.') + '</p>' : '') +
      '</div>' +
      (mapsUnavailable()
        ? renderOfflineMap(points)
        : '<div id="japan-map" class="jf-map" aria-label="Google map">' + loading + '</div>') +
      emptyNote +
      renderFencedPlacesList(points) +
      mapLegend +
      '<p class="jf-map-help">Click a pin to view the entry. The category and item buttons choose which pins appear; search, status, lists and tags narrow whatever they chose.</p>' +
      '</main>';
  }

  // Columns come from the schema of the item's categories, and are only shown
  // when at least one product actually has a value for them - so a sake table
  // and a table for a user-defined category each end up with the fields that
  // matter to them. Values left over from a removed field are appended as
  // extra columns rather than being hidden.
  function productTableColumns(entry, products) {
    var cols = fieldsForItem(entry).filter(function (f) {
      return products.some(function (prod) { return String(productFieldDisplay(prod, f)).trim() !== ""; });
    }).map(function (f) { return { key: f.key, label: f.label, field: f, type: f.type }; });
    var seen = {};
    cols.forEach(function (c) { seen[c.key] = true; });
    var fields = fieldsForItem(entry);
    products.forEach(function (prod) {
      orphanProductValues(prod, fields).forEach(function (o) {
        if (seen[o.key]) return;
        seen[o.key] = true;
        cols.push({ key: o.key, label: o.label, field: null, type: "text" });
      });
    });
    return cols;
  }

  function productColumnValue(prod, col) {
    return col.field ? productFieldDisplay(prod, col.field) : productValue(prod, col.key);
  }

  function renderProductTableView() {
    var entry = null;
    for (var i = 0; i < state.entries.length; i++) {
      if (state.entries[i].id === state.productTableItemId) { entry = state.entries[i]; break; }
    }
    if (!entry) return '<main class="jf-main"><p class="jf-empty-sub">That item no longer exists.</p>' +
      '<button class="btn btn-outline" onclick="closeProductTable()">Back</button></main>';

    var allProducts = productsForItem(entry.id);
