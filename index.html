    } else if (scope === "items") {
      entries = state.entries.filter(isItem);
      var itemIds = {};
      entries.forEach(function (e) { itemIds[e.id] = true; });
      products = (state.products || []).filter(function (p) { return itemIds[p.itemId]; });
    } else {
      entries = state.entries.slice();
      products = (state.products || []).slice();
    }
    return { entries: entries, products: products };
  }

  function exportScopeLabel(scope) {
    if (scope === "places") return "places";
    if (scope === "items") return "items and products";
    return "places, items and products";
  }

  window.exportProductTableCsv = function (itemId) {
    var item = state.entries.find(function (e) { return e.id === itemId; });
    var products = productsForItem(itemId);
    if (!products.length) return;
    var safe = String(item && item.title ? item.title : "products").replace(/[^\w\-]+/g, "-").slice(0, 40);
    var base = "japan-finds-" + safe + "-products-" + new Date().toISOString().slice(0, 10);
    downloadFile(productsCsv(products), "text/csv;charset=utf-8", base + ".csv");
    // A per-screen download, so it follows the screen export's photo switch.
    var note = state.exportScreenOptions.photos
      ? downloadPhotoZip([], products, base + "-photos.zip")
      : "";
    if (note) {
      state.importMessage = "Exported the product table." + note;
      render();
      scheduleClearImportMessage();
    }
  };

  // Exports only the entries currently visible in grid/list mode - i.e. the
  // result of every active filter (type, list, categories, subcategories,
  // tags, status, search) in the current sort order, via getFilteredEntries().
  window.exportFilteredCsv = function () {
    var onMap = !!state.mapMode;
    var set = buildScreenExportSet();
    var filtered = set.entries;
    var filteredProducts = set.products;
    if (!filtered.length) {
      state.importMessage = onMap
        ? "There are no pins on the map \u2014 nothing to export."
        : "No entries match the current filters \u2014 nothing to export.";
      render();
      scheduleClearImportMessage();
      return;
    }
    var stamp = new Date().toISOString().slice(0, 10);
    var base = "japan-finds-" + (onMap ? "map-" : "filtered-") + stamp;

    downloadFile(combinedCsv(filtered, filteredProducts), "text/csv;charset=utf-8", base + ".csv");

    if (state.exportScreenOptions.categories) {
      downloadFile(categorySchemaCsv(state.categories), "text/csv;charset=utf-8", base + "-categories.csv");
    }
    // Only the photos belonging to the exported records, so a filtered export
    // never quietly ships the whole library.
    var note = state.exportScreenOptions.photos
      ? downloadPhotoZip(filtered, filteredProducts, base + "-photos.zip")
      : "";

    var what = onMap
      ? set.base.length + (set.base.length === 1 ? " pinned place" : " pinned places")
      : set.base.length + (set.base.length === 1 ? " entry" : " entries") + " matching the current filters";
    if (set.addedItems.length) {
      what += " and " + set.addedItems.length + " linked item" + (set.addedItems.length === 1 ? "" : "s");
    }
    if (filteredProducts.length) {
      what += " with " + filteredProducts.length + " product record" + (filteredProducts.length === 1 ? "" : "s");
    }
    state.importMessage = "Exported " + what + "." + note;
    closeModal();
    scheduleClearImportMessage();
  };

  // One row per scheduled stop, in day-then-order sequence, with the leg
  // distance from the previous stop so the file is readable on its own.
  window.exportItineraryCsv = function () {
    var list = getList(state.itineraryListId);
    if (!list) return;
    var headers = ["List", "Day #", "Day label", "Date", "Stop #", "Title", "Type", "Categories",
      "Status", "PrefectureRegionState", "City", "Neighborhood", "Location", "Latitude", "Longitude",
      "Km from previous stop", "Website", "Tags", "Notes"];
    var rows = [];
    (list.days || []).forEach(function (day, dayIdx) {
      var legs = dayLegs(day.stops || []);
      (day.stops || []).forEach(function (id, i) {
        var e = entryById(id);
        if (!e) return;
        var leg = i === 0 ? "" : (legs[i - 1] === null ? "" : legs[i - 1].toFixed(2));
        rows.push([
          list.name, String(dayIdx + 1), day.label || ("Day " + (dayIdx + 1)), day.date || "",
          String(i + 1), e.title || "", e.type || "place",
          entryCategories(e).map(function (c) { return categoryMeta(c).label; }).join("; "),
          e.status || "", e.prefecture || "", e.city || "", e.neighborhood || "", e.location || "",
          hasCoords(e) ? String(entryLat(e)) : "", hasCoords(e) ? String(entryLng(e)) : "",
          leg, e.website || "", (e.tags || []).join("; "), e.notes || ""
        ]);
      });
    });
    if (!rows.length) {
      state.importMessage = "Nothing scheduled to export yet.";
      render();
      scheduleClearImportMessage();
      return;
    }
    var safeName = (list.name || "itinerary").replace(/[^a-z0-9\-_ ]/gi, "").trim().replace(/\s+/g, "-") || "itinerary";
    downloadFile(csvDocument(headers, rows), "text/csv;charset=utf-8",
      "japan-finds-" + safeName + "-itinerary-" + new Date().toISOString().slice(0, 10) + ".csv");
    state.importMessage = "Exported " + rows.length + " scheduled stop" + (rows.length === 1 ? "." : "s.");
    render();
    scheduleClearImportMessage();
  };

  window.exportData = function (format) {
    var stamp = new Date().toISOString().slice(0, 10);
    var filename = "japan-finds-" + stamp;
    var content, mime, csvPhotoNote = "";

    if (format === 'json') {
      // v5 adds itinerary days on each list. Older files still import cleanly
      // because normalizeList() fills the field in.
      // v6 adds prefecture on Place entries. Older files still import cleanly
      // because normalizeEntry() fills the field in with an empty string.
      // v7 adds the category definitions and moves product values into a
      // schema-keyed "values" object. Older files still import cleanly:
      // normalizeCategory() seeds anything missing and normalizeProduct()
      // folds the old flat product fields into values.
      content = JSON.stringify({ version: 8, entries: state.entries, lists: state.lists, products: state.products, relationships: state.relationships, categories: state.categories, notes: state.notes }, null, 2);
      mime = "application/json";
      filename += ".json";
    } else if (format === 'csv') {
      var opt = state.exportCsvOptions;
      var sel = exportScopeSelection(opt.scope);
      var made = [];

      // Always one file. Entries and products cannot share a row, but the
      // RowType column lets them share a file, and a single predictable shape
      // is easier to re-import than a scattering of them.
      // Notes have no scope of their own; they travel with "Everything".
      var selNotes = (opt.scope === "places" || opt.scope === "items") ? [] : (state.notes || []);
      downloadFile(combinedCsv(sel.entries, sel.products, selNotes), "text/csv;charset=utf-8", filename + ".csv");
      made.push(sel.entries.length + " " + exportScopeLabel(opt.scope));

      if (opt.categories) {
        downloadFile(categorySchemaCsv(state.categories), "text/csv;charset=utf-8", filename + "-categories.csv");
        made.push("category definitions");
      }
      if (opt.photos) {
        csvPhotoNote = downloadPhotoZip(sel.entries, sel.products, filename + "-photos.zip", selNotes);
      }

      state.importMessage = "Exported " + made.join(" and ") + "." + csvPhotoNote;
      closeModal();
      scheduleClearImportMessage();
      return;
    } else if (format === 'photos') {
      // Photos on their own, with no CSV naming them. Useful for getting the
      // images out; not enough on its own to rebuild a collection.
      var pSel = exportScopeSelection(state.exportCsvOptions.scope);
      var note = downloadPhotoZip(pSel.entries, pSel.products, filename + "-photos.zip");
      state.importMessage = note
        ? "Photos exported." + note
        : "There are no photos in that selection to export.";
      closeModal();
      scheduleClearImportMessage();
      return;
    } else if (format === 'geojson') {
      var relGeo = buildRelationIndex();
      var byIdGeo = {};
      state.entries.forEach(function (en) { byIdGeo[en.id] = en; });
      var features = state.entries.filter(hasCoords).map(function(e) {
        return {
          type: "Feature",
          geometry: { type: "Point", coordinates: [entryLng(e), entryLat(e)] },
          properties: {
            id: e.id, title: e.title, type: e.type || "place", status: e.status || "",
            category: e.category, categories: entryCategories(e),
            categoryLabels: entryCategories(e).map(function (c) { return categoryMeta(c).label; }),
            subcategories: e.subcategories || [],
            subcategoryLabels: (e.subcategories || []).map(function (id) { var sc = subcategoryMeta(id); return sc ? sc.label : id; }),
            lists: (e.lists || []).map(listName).filter(Boolean),
            prefecture: e.prefecture || "", city: e.city, neighborhood: e.neighborhood, location: e.location,
            website: e.website, tabelogUrl: e.tabelogUrl || "",
            visitedDate: e.visitedDate || "", dateTried: e.dateTried || "",
            notes: e.notes, tags: e.tags || [],
            linkedItems: isPlace(e) ? linkedEntries(relGeo.byPlace[e.id], byIdGeo, isItem).map(function (i) { return i.title; }) : [],
            photoCount: (e.photos || []).length
          }
        };
      });
      content = JSON.stringify({ type: "FeatureCollection", features: features }, null, 2);
      mime = "application/geo+json";
      filename += ".geojson";
    }

    downloadFile(content, mime, filename);

    state.importMessage = "Exported as " + format.toUpperCase() + ".";
    closeModal();
    scheduleClearImportMessage();
  };

  // ---------- import ----------
  // Three shapes are accepted:
  //   1. a JSON export (lossless, unchanged)
  //   2. a CSV on its own
  //   3. a CSV together with its photos zip
  // The picker takes several files at once, so entries, products and the zip
  // can be handed over in a single go.

  function readFileText(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function (ev) { resolve(ev.target.result); };
      r.onerror = function () { reject(new Error("Could not read " + file.name)); };
      r.readAsText(file);
    });
  }

  function readFileBuffer(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function (ev) { resolve(ev.target.result); };
      r.onerror = function () { reject(new Error("Could not read " + file.name)); };
      r.readAsArrayBuffer(file);
    });
  }

  function importFailed(message) {
    state.importMessage = message;
    render();
    scheduleClearImportMessage();
  }

  // ---------- import staging ----------
  // The Import button used to open a bare file dialog and act on whatever came
  // back. Now files land in a panel first: each one is identified, the panel
  // says what will happen (and what is missing), and nothing is read in full
  // until Continue is pressed.

  function stagedKindLabel(item) {
    switch (item.kind) {
      case "json": return "Full backup";
      case "entries": return "Entries";
      case "products": return "Products";
      case "combined": return "Entries + products";
      case "category-schema": return "Category definitions";
      case "categories": return "Category summary";
      case "itinerary": return "Itinerary report";
      case "zip": return "Photos";
      default: return "Not recognised";
    }
  }

  function stagedKindUsable(kind) {
    return ["json", "entries", "products", "combined", "category-schema", "zip"].indexOf(kind) !== -1;
  }

  // A CSV is identified by its header row, so only the first slice is read
  // here - enough for the header line without pulling a large file into
  // memory twice.
  function identifyStagedFile(file) {
    var ext = String(file.name || "").toLowerCase().split(".").pop();
    if (ext === "json") return Promise.resolve({ kind: "json", detail: "entries, products, categories and photos in one file" });
    if (ext === "zip") return Promise.resolve({ kind: "zip", detail: "image files for the CSV to reattach" });
    if (ext !== "csv") return Promise.resolve({ kind: "unknown", detail: "only .json, .csv and .zip can be imported" });
    return file.slice(0, 8192).text().then(function (head) {
      var rows = parseCsv(head);
      if (!rows.length) return { kind: "unknown", detail: "no header row found" };
      var headers = rows[0].map(function (h) { return uncsvCell(h).trim(); });
      var kind = csvKind(headers);
      if (kind === "categories") return { kind: kind, detail: "readable summary only \u2014 use the categories file with field keys instead" };
      if (kind === "itinerary") return { kind: kind, detail: "a printed-style report, not an import format" };
      if (kind === "unknown") return { kind: kind, detail: "columns do not match any Japan Finds export" };
      return { kind: kind, detail: "" };
    }).catch(function () {
      return { kind: "unknown", detail: "could not be read" };
    });
  }

  function addStagedFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    state.importStageError = null;

    var tooBig = files.filter(function (f) { return f.size > 250 * 1024 * 1024; });
    if (tooBig.length) {
      state.importStageError = "\u201c" + tooBig[0].name + "\u201d is over 250 MB and cannot be imported.";
      files = files.filter(function (f) { return f.size <= 250 * 1024 * 1024; });
    }
    // Selecting the same file twice is easy to do across two trips to the
    // picker, and would double every row it contains.
    files = files.filter(function (f) {
      return !state.importStaged.some(function (s) { return s.name === f.name && s.size === f.size; });
    });
    if (!files.length) { rerenderModalOnly(); return; }

    state.importStageBusy = true;
    rerenderModalOnly();
    Promise.all(files.map(function (f) {
      return identifyStagedFile(f).then(function (info) {
        return { file: f, name: f.name, size: f.size, kind: info.kind, detail: info.detail };
      });
    })).then(function (items) {
      state.importStaged = state.importStaged.concat(items);
      state.importStageBusy = false;
      rerenderModalOnly();
    }).catch(function () {
      state.importStageBusy = false;
      state.importStageError = "Those files could not be read.";
      rerenderModalOnly();
    });
  }

  function stagedSummary() {
    var kinds = {};
    state.importStaged.forEach(function (s) { kinds[s.kind] = (kinds[s.kind] || 0) + 1; });
    var notes = [];
    var usable = state.importStaged.filter(function (s) { return stagedKindUsable(s.kind); });

    if (kinds.json && usable.length > kinds.json) {
      notes.push({ tone: "error", text: "A full backup already contains everything. Import it on its own, without CSV or ZIP files." });
    }
    if (kinds.json > 1) notes.push({ tone: "error", text: "Only one full backup can be imported at a time." });

    var hasCsv = kinds.entries || kinds.products || kinds.combined || kinds["category-schema"];
    if (kinds.zip && !hasCsv && !kinds.json) {
      notes.push({ tone: "error", text: "A photos ZIP has nothing to attach to on its own. Add the CSV it belongs to." });
    }
    if (hasCsv && !kinds.zip) {
      notes.push({ tone: "warn", text: "No photos ZIP. Records you already have will keep their photos; new records will arrive without any." });
    }
    if ((kinds.products || kinds.combined) && !kinds["category-schema"] && !state.categories.length) {
      notes.push({ tone: "warn", text: "No category definitions, and this collection has none yet \u2014 product columns may not match up to their fields." });
    }
    if (kinds.categories) notes.push({ tone: "warn", text: "The category summary file will be skipped; it does not carry field keys." });
    if (kinds.itinerary) notes.push({ tone: "warn", text: "The itinerary file will be skipped; it is a report, not an import format." });
    if (kinds.unknown) notes.push({ tone: "warn", text: "Unrecognised files will be ignored." });

    var blocked = notes.some(function (n) { return n.tone === "error"; });
    return { notes: notes, usable: usable, blocked: blocked };
  }

  function renderImportModal() {
    var sum = stagedSummary();
    var rows = state.importStaged.map(function (s, i) {
      var usable = stagedKindUsable(s.kind);
      return '<div class="jf-import-file' + (usable ? '' : ' muted') + '">' +
        '<span class="jf-import-kind">' + esc(stagedKindLabel(s)) + '</span>' +
        '<span class="jf-import-name">' + esc(s.name) +
        '<span class="jf-import-detail">' + esc(formatBytes(s.size) + (s.detail ? " \u00b7 " + s.detail : "")) + '</span></span>' +
        '<button class="link-btn danger" onclick="removeStagedFile(' + i + ')" aria-label="Remove ' + esc(s.name) + '">Remove</button>' +
        '</div>';
    }).join("");

    var notesHtml = sum.notes.map(function (n) {
      return '<p class="' + (n.tone === "error" ? "jf-form-error" : "jf-form-warning") + '" style="margin:6px 0 0">' + esc(n.text) + '</p>';
    }).join("");

    return (
      '<div class="jf-modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="jf-modal" tabindex="-1" role="dialog" aria-modal="true">' +
      '<div class="jf-modal-header"><h2>Import</h2><button class="jf-modal-close-inline" onclick="closeModal()" aria-label="Close">\u2715</button></div>' +
      '<div class="jf-modal-body">' +
      '<div class="jf-import-drop" ' +
      'ondragover="handleImportDragOver(event)" ondragleave="handleImportDragLeave(event)" ondrop="handleImportDrop(event)" ' +
      'onclick="triggerImportPicker()" role="button" tabindex="0" ' +
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();triggerImportPicker();}">' +
      '\uD83D\uDCC1<span>Drop files here, or click to browse</span>' +
      '<span class="jf-import-hint">A full backup (.json) on its own, or a CSV \u2014 add its photos ZIP and category file to restore everything.<br>' +
      'Adding photos to new rows: leave PhotoFiles blank and zip the images named after each row\u2019s Title (or Product) \u2014 <em>Kyoto Sake Shop.jpg</em>, <em>Kyoto Sake Shop-2.jpg</em>. Or list any filenames in PhotoFiles, separated by \u201c; \u201d. Folders inside the ZIP do not matter.</span>' +
      '</div>' +
      '<input id="import-input" type="file" multiple accept="application/json,.json,text/csv,.csv,application/zip,.zip" style="display:none" onchange="handleImportFile(event)">' +
      (state.importStageBusy ? '<p class="jf-map-help">Identifying files\u2026</p>' : '') +
      (state.importStageError ? '<p class="jf-form-error">' + esc(state.importStageError) + '</p>' : '') +
      (rows ? '<div class="jf-import-list">' + rows + '</div>' : '') +
      notesHtml +
      '<div class="jf-form-actions" style="margin-top:14px">' +
      '<button class="btn btn-primary" ' + (!sum.usable.length || sum.blocked || state.importStageBusy ? 'disabled' : '') +
      ' onclick="startStagedImport()">Continue</button>' +
      (state.importStaged.length ? '<button class="btn btn-outline" onclick="clearStagedFiles()">Clear</button>' : '') +
      '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
      '</div>' +
      '<p style="font-size:11px;color:var(--ink-soft);margin:10px 0 0">Nothing is written until the next screen, which reports exactly what was found.</p>' +
      '</div></div></div>'
    );
  }

  window.triggerImport = function () {
    state.importStaged = [];
    state.importStageError = null;
    state.importStageBusy = false;
    state.modalMode = "import";
    render();
  };

  window.triggerImportPicker = function () {
    var el = document.getElementById("import-input");
    if (el) el.click();
  };

  window.removeStagedFile = function (index) {
    state.importStaged.splice(index, 1);
    state.importStageError = null;
    rerenderModalOnly();
  };

  window.clearStagedFiles = function () {
    state.importStaged = [];
    state.importStageError = null;
    rerenderModalOnly();
  };

  // Drag state is toggled directly on the element rather than through state +
  // render(). Re-rendering mid-drag replaces the very node the drag is over,
  // so the browser loses the drop target and the drop event never lands - the
  // zone would highlight on hover and then do nothing.
  window.handleImportDragOver = function (event) {
    event.preventDefault();
    event.stopPropagation();
    if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
    event.currentTarget.classList.add("active");
  };

  window.handleImportDragLeave = function (event) {
    event.preventDefault();
    event.stopPropagation();
    event.currentTarget.classList.remove("active");
  };

  window.handleImportDrop = function (event) {
    event.preventDefault();
    event.stopPropagation();
    event.currentTarget.classList.remove("active");
    var dt = event.dataTransfer;
    var files = dt && dt.files && dt.files.length
      ? dt.files
      // Some browsers populate only the items list on a drop from certain
      // sources, so that is read as a fallback before giving up.
      : (dt && dt.items ? Array.prototype.slice.call(dt.items)
          .filter(function (it) { return it.kind === "file"; })
          .map(function (it) { return it.getAsFile(); })
          .filter(Boolean) : []);
    addStagedFiles(files);
  };

  window.handleImportFile = function (event) {
    addStagedFiles(event.target.files);
    event.target.value = "";
  };

  window.startStagedImport = function () {
    var staged = state.importStaged.filter(function (s) { return stagedKindUsable(s.kind); });
    if (!staged.length) return;

    var jsonItem = staged.filter(function (s) { return s.kind === "json"; })[0];
    if (jsonItem) {
      readFileText(jsonItem.file)
        .then(function (text) { state.importStaged = []; importJsonText(text); })
        .catch(function () { importFailed("Couldn't read that file."); });
      return;
    }

    var csvItems = staged.filter(function (s) { return s.kind !== "zip"; });
    var zipItems = staged.filter(function (s) { return s.kind === "zip"; });

    state.importStageBusy = true;
    rerenderModalOnly();

    Promise.all(csvItems.map(function (s) {
      return readFileText(s.file).then(function (t) { return { name: s.name, text: t }; });
    })).then(function (csvTexts) {
      return Promise.all(zipItems.map(function (s) {
        return readFileBuffer(s.file).then(readZip);
      })).then(function (zipMaps) {
        return { csvTexts: csvTexts, zipMaps: zipMaps, hasZip: zipItems.length > 0 };
      });
    }).then(function (bundle) {
      state.importStageBusy = false;
      state.importStaged = [];
      importCsvBundle(bundle);
    }).catch(function (err) {
      state.importStageBusy = false;
      importFailed(err && err.message ? err.message : "Couldn't read those files.");
    });
  };

  // Which export a CSV came from, decided by its header row rather than its
  // filename, so a renamed file still imports.
  function csvKind(headers) {
    var h = {};
    headers.forEach(function (x) { h[x] = true; });
    // The combined file contains both single-table signatures, so it has to be
    // tested first or it would be read as a products file with stray columns.
    if (h.RowType && h.ID && h.ProductID) return "combined";
    if (h.ProductID && h.ItemID) return "products";
    if (h.ID && h.Title && h.Type) return "entries";
    if (h.RecordType && h.CategoryID && h.FieldKey) return "category-schema";
    if (h.CategoryID && h.Label) return "categories";
    if (h["Day #"] && h["Stop #"]) return "itinerary";
    return "unknown";
  }

  var RESERVED_PRODUCT_HEADERS = ["ProductID", "ItemID", "ItemTitle", "ItemCategories",
    "Product", "PhotoCount", "PhotoFiles", "Photos"];

  // A row's photo cell can be one of three things: filenames pointing into the
  // zip, nothing at all, or - in a file exported by an older version - the raw
  // data URLs themselves. All three are handled, and when the photos cannot be
  // recovered the record's EXISTING photos are kept rather than wiped, so
  // re-importing a CSV without its zip never destroys images.
  // With PhotoFiles left blank and a ZIP supplied, any image in the ZIP whose
  // name starts with the row's title (or product name) is attached, in name
  // order: "Kyoto Sake Shop.jpg", "Kyoto Sake Shop-2.jpg", "Kyoto Sake Shop (3).png".
  // That is the bulk-add route: name the photos after the rows, zip them flat.
  function photosNamedAfter(row, ctx) {
    var title = String(row.Product || row.Title || "").trim().toLowerCase();
    if (!title || !ctx.hasZip) return [];
    return Object.keys(ctx.zipByBase).filter(function (base) {
      var b = base.toLowerCase();
      if (!/\.(jpe?g|png|webp|gif|heic|heif|svg|bmp|avif)$/i.test(b)) return false;
      if (b.indexOf(title) !== 0) return false;
      var rest = b.slice(title.length).replace(/\.[a-z0-9]+$/, "");
      return rest === "" || /^[\s._-]*(\(?\d+\)?)?$/.test(rest);
    }).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
  }
  function resolvePhotos(row, existingPhotos, ctx) {
    var keep = existingPhotos ? existingPhotos.slice() : [];
    var raw = String(row.PhotoFiles || "").trim() || String(row.Photos || "").trim();
    if (!raw) {
      var byName = photosNamedAfter(row, ctx);
      if (!byName.length) return keep;
      ctx.report.photosByName = (ctx.report.photosByName || 0) + byName.length;
      raw = byName.join(PHOTO_FILE_SEPARATOR);
    }

    if (isDataUrl(raw)) {
      ctx.report.inlinePhotos++;
      return raw.split(" | ").map(function (s) { return s.trim(); }).filter(isDataUrl);
    }

    var names = splitList(raw);
    if (!names.length) return keep;
    if (!ctx.hasZip) { ctx.report.photosNeedingZip += names.length; return keep; }

    var out = [], missing = 0;
    names.forEach(function (n) {
      var clean = n.replace(/^\.?\//, "");
      // Also matched on the bare filename, so an archive that someone unzipped
      // and rezipped without the entries/ and products/ folders still works.
      var bytes = ctx.zip[clean] || ctx.zip[n] || ctx.zipByBase[clean.split("/").pop()];
      if (!bytes) { missing++; return; }
      out.push(bytesToDataUrl(bytes, clean));
    });
    ctx.report.photosMissing += missing;
    ctx.report.photosRestored += out.length;
    // A row whose files are all absent keeps what it had; a partial match uses
    // what was found rather than mixing two sources.
    if (!out.length) return keep;
    return out;
  }

  function resolveListNames(names, ctx) {
    return names.map(function (name) {
      var key = name.toLowerCase();
      if (ctx.listsByName[key]) return ctx.listsByName[key];
      var created = { id: makeId(), name: name, createdAt: Date.now(), days: [] };
      ctx.newLists.push(created);
      ctx.listsByName[key] = created.id;
      ctx.report.listsCreated++;
      return created.id;
    });
  }

  function entryFromCsvRow(row, ctx) {
    var title = String(row.Title || "").trim();
    if (!title) { ctx.report.rowsSkipped++; return null; }
    var id = String(row.ID || "").trim();
    if (!id) { id = makeId(); ctx.report.idsGenerated++; }
    var existing = ctx.existingEntriesById[id];

    var type = String(row.Type || "place").trim().toLowerCase() === "item" ? "item" : "place";
    var cats = splitList(row.Categories);
    if (!cats.length && String(row.Category || "").trim()) cats = [String(row.Category).trim()];
    cats.forEach(function (c) { if (!ctx.knownCategoryIds[c]) ctx.report.unknownCategories[c] = true; });

    var e = {
      id: id,
      type: type,
      title: title,
      status: String(row.Status || "").trim(),
      visitedDate: String(row.DateVisited || "").trim(),
      dateTried: String(row.DateTried || "").trim(),
      categories: cats.length ? cats : ["other"],
      category: cats[0] || "other",
      subcategories: splitList(row.Subcategories),
      lists: resolveListNames(splitList(row.Lists), ctx),
      prefecture: String(row.PrefectureRegionState || row.Prefecture || ""),
      city: String(row.City || ""),
      neighborhood: String(row.Neighborhood || ""),
      location: String(row.Location || ""),
      website: String(row.Website || ""),
      tabelogUrl: String(row.TabelogURL || ""),
      latitude: String(row.Latitude || "").trim(),
      longitude: String(row.Longitude || "").trim(),
      tags: splitList(row.Tags),
      notes: String(row.Notes || ""),
      dateAdded: parseCsvTimestamp(row.DateAdded) || (existing && existing.dateAdded) || Date.now(),
      photos: resolvePhotos(row, existing && existing.photos, ctx)
    };
    // The link columns hold titles, not ids, so they are resolved in a second
    // pass once every imported entry is known.
    ctx.pendingLinks.push({ id: id, type: type, places: splitList(row.LinkedPlaces), items: splitList(row.LinkedItems) });
    return normalizeEntry(e);
  }

  // Values in the CSV are the DISPLAY forms produced by productFieldDisplay(),
  // so formatting has to be undone before they go back into a product record.
  function applyProductValue(values, field, raw, ctx) {
    var v = String(raw == null ? "" : raw).trim();
    if (!v) return;
    if (field.type === "price") {
      var m = v.match(/\s([A-Za-z]{3})$/);
      if (m && CURRENCY_OPTIONS.indexOf(m[1].toUpperCase()) !== -1) {
        values[field.key + "__currency"] = m[1].toUpperCase();
        v = v.slice(0, m.index).trim();
      }
      values[field.key] = v.replace(/,/g, "");
      return;
    }
    if (field.type === "number") { values[field.key] = v.replace(/,/g, ""); return; }
    if (field.type === "select") {
      var opts = field.options || [];
      if (opts.indexOf(v) !== -1) { values[field.key] = v; return; }
      if (field.allowOther) {
        values[field.key] = OTHER_VALUE;
        values[field.key + "__other"] = v;
        return;
      }
      // Not an option and no "Other" on this field: kept verbatim rather than
      // dropped, so nothing disappears silently.
      values[field.key] = v;
      ctx.report.valuesOffSchema++;
      return;
    }
    values[field.key] = v;
  }

  // fieldsForItem() reads the live category index. During a CSV import the
  // schemas may still be sitting on the context, unconfirmed, so field lookup
  // has to consider both — incoming definitions first, since they are what the
  // file was written against.
  function fieldsForItemInCtx(item, ctx) {
    var seen = {}, out = [];
    entryCategories(item).forEach(function (catId) {
      var cat = ctx.incomingCategories[catId] || categoryMeta(catId);
      (cat.fields || []).forEach(function (f) {
        if (seen[f.key]) return;
        seen[f.key] = true;
        out.push(f);
      });
    });
    return out;
  }

  function productFromCsvRow(row, ctx) {
    var itemId = String(row.ItemID || "").trim();
    if (!itemId) { ctx.report.productsSkipped++; return null; }
    var id = String(row.ProductID || "").trim() || makeId();
    var item = ctx.importedEntriesById[itemId] || ctx.existingEntriesById[itemId];
    if (!item) { ctx.report.productsOrphaned++; return null; }

    var existing = ctx.existingProductsById[id];
    var fields = fieldsForItemInCtx(item, ctx);
    var byLabel = {};
    fields.forEach(function (f) {
      // Registered under both the plain label and the disambiguated
      // "Label [key]" form the exporter writes when two fields share a
      // label. The first field with a label keeps the plain header,
      // mirroring the export.
      if (!byLabel[f.label]) byLabel[f.label] = f;
      byLabel[f.label + " [" + f.key + "]"] = f;
    });

    var values = {};
    Object.keys(row).forEach(function (header) {
      if (RESERVED_PRODUCT_HEADERS.indexOf(header) !== -1) return;
      var field = byLabel[header];
      if (field) { applyProductValue(values, field, row[header], ctx); return; }
      // A column the item's categories no longer define. Stored under the
      // column name so orphanProductValues() still surfaces it, the same way
      // a removed field behaves elsewhere.
      var v = String(row[header] == null ? "" : row[header]).trim();
      if (!v) return;
      values[header] = v;
      ctx.report.orphanColumns[header] = true;
    });

    return normalizeProduct({
      id: id,
      itemId: itemId,
      name: String(row.Product || ""),
      values: values,
      photos: resolvePhotos(row, existing && existing.photos, ctx)
    });
  }

  // LinkedPlaces / LinkedItems hold titles. A title that matches exactly one
  // entry of the opposite kind becomes a relationship; anything ambiguous or
  // unmatched is counted and reported rather than guessed at.
  function relationshipsFromLinks(ctx) {
    var byTitle = {};
    function index(e) {
      var k = String(e.title || "").trim().toLowerCase();
      if (!k) return;
      if (!byTitle[k]) byTitle[k] = [];
      if (byTitle[k].indexOf(e.id) === -1) byTitle[k].push(e.id);
    }
    state.entries.forEach(index);
    ctx.importedEntries.forEach(index);

    var typeOf = {};
    state.entries.forEach(function (e) { typeOf[e.id] = e.type || "place"; });
    ctx.importedEntries.forEach(function (e) { typeOf[e.id] = e.type || "place"; });

    var seen = {};
    (state.relationships || []).forEach(function (r) { seen[r.placeId + "\u0000" + r.itemId] = true; });

    var out = [];
    ctx.pendingLinks.forEach(function (link) {
      var wanted = link.type === "item" ? link.places : link.items;
      var otherType = link.type === "item" ? "place" : "item";
      wanted.forEach(function (title) {
        var ids = (byTitle[title.toLowerCase()] || []).filter(function (id) { return typeOf[id] === otherType; });
        if (ids.length !== 1) { ctx.report.linksUnresolved++; return; }
        var placeId = link.type === "item" ? ids[0] : link.id;
        var itemId = link.type === "item" ? link.id : ids[0];
        var key = placeId + "\u0000" + itemId;
        if (seen[key]) return;
        seen[key] = true;
        out.push({ id: makeId(), placeId: placeId, itemId: itemId });
        ctx.report.linksResolved++;
      });
    });
    return out;
  }

  // Shared by both row types; everything else belongs to one table or the other.
  var COMBINED_SHARED_COLUMNS = ["PhotoCount", "PhotoFiles"];

  function splitCombinedRows(objs) {
    var entries = [], products = [], notes = [];
    objs.forEach(function (row) {
      var kind = String(row.RowType || "").trim().toLowerCase();
      if (kind === "note") { notes.push(row); return; }
      if (kind === "product") {
        // Only the product's own columns are carried over. An entry column
        // left blank on this row would otherwise be read as an unmatched
        // product field and reported as an orphan.
        var out = {};
        Object.keys(row).forEach(function (k) {
          if (k.indexOf(COMBINED_PRODUCT_PREFIX) === 0) { out[k.slice(COMBINED_PRODUCT_PREFIX.length)] = row[k]; return; }
          if (RESERVED_PRODUCT_HEADERS.indexOf(k) !== -1 || COMBINED_SHARED_COLUMNS.indexOf(k) !== -1) out[k] = row[k];
        });
        products.push(out);
        return;
      }
      if (kind === "entry") {
        var e = {};
        Object.keys(row).forEach(function (k) {
          if (k === "RowType") return;
          if (k.indexOf(COMBINED_PRODUCT_PREFIX) === 0) return;
          if (RESERVED_PRODUCT_HEADERS.indexOf(k) !== -1 && COMBINED_SHARED_COLUMNS.indexOf(k) === -1) return;
          e[k] = row[k];
        });
        entries.push(e);
      }
      // A row with no RowType belongs to neither table and is left alone; the
      // entry and product parsers each report their own skips.
    });
    return { entries: entries, products: products, notes: notes };
  }
  function noteFromCsvRow(row, ctx) {
    var id = String(row.ID || "").trim() || makeId();
    var existing = noteById(id);
    var title = String(row.Title || "").trim(), body = String(row.Notes || "").trim();
    var photos = resolvePhotos(row, existing ? existing.photos : [], ctx);
    if (!title && !body && !photos.length) { ctx.report.rowsSkipped++; return null; }
    var added = parseCsvTimestamp(row.DateAdded);
    return { id: id, title: title, body: body, photos: photos, dateAdded: added || (existing ? existing.dateAdded : Date.now()), dateUpdated: Date.now() };
  }

  function importCsvBundle(bundle) {
    var zip = {};
    bundle.zipMaps.forEach(function (m) {
      Object.keys(m).forEach(function (k) { zip[k] = m[k]; });
    });
    var zipByBase = {};
    Object.keys(zip).forEach(function (k) { zipByBase[k.split("/").pop()] = zip[k]; });

    var ctx = {
      hasZip: bundle.hasZip,
      zip: zip,
      zipByBase: zipByBase,
      existingEntriesById: {},
      existingProductsById: {},
      importedEntriesById: {},
      importedEntries: [],
      knownCategoryIds: {},
      listsByName: {},
      newLists: [],
      pendingLinks: [],
      incomingCategories: {},
      report: {
        files: [], entries: 0, products: 0, conflicts: 0, rowsSkipped: 0, idsGenerated: 0,
        photosRestored: 0, photosMissing: 0, photosNeedingZip: 0, inlinePhotos: 0,
        listsCreated: 0, linksResolved: 0, linksUnresolved: 0, productsSkipped: 0,
        productsOrphaned: 0, valuesOffSchema: 0, orphanColumns: {}, unknownCategories: {},
        categories: 0, categoriesNew: 0, schemaRowsSkipped: 0, schemaOrphanRows: 0,
        skippedFiles: []
      }
    };
    state.entries.forEach(function (e) { ctx.existingEntriesById[e.id] = e; });
    (state.products || []).forEach(function (p) { ctx.existingProductsById[p.id] = p; });
    state.categories.forEach(function (c) { ctx.knownCategoryIds[c.id] = true; });
    state.lists.forEach(function (l) { ctx.listsByName[String(l.name).toLowerCase()] = l.id; });

    var entryRows = [], productRows = [], schemaRows = [], noteRows = [];
    bundle.csvTexts.forEach(function (f) {
      var rows = parseCsv(f.text);
      if (!rows.length) { ctx.report.skippedFiles.push(f.name + " (empty)"); return; }
      var headers = rows[0].map(function (h) { return uncsvCell(h).trim(); });
      var kind = csvKind(headers);
      if (kind === "entries") { entryRows = entryRows.concat(csvRowsToObjects(rows)); ctx.report.files.push(f.name + " (entries)"); return; }
      if (kind === "products") { productRows = productRows.concat(csvRowsToObjects(rows)); ctx.report.files.push(f.name + " (products)"); return; }
      if (kind === "combined") {
        // One file holding both kinds. Product columns were prefixed on the
        // way out to avoid clashing with entry columns of the same name, so
        // the prefix comes off before the product parser sees them.
        var split = splitCombinedRows(csvRowsToObjects(rows));
        entryRows = entryRows.concat(split.entries);
        productRows = productRows.concat(split.products);
        noteRows = noteRows.concat(split.notes);
        ctx.report.files.push(f.name + " (entries + products" + (split.notes.length ? " + notes" : "") + ")");
        return;
      }
      if (kind === "category-schema") { schemaRows = schemaRows.concat(csvRowsToObjects(rows)); ctx.report.files.push(f.name + " (category schema)"); return; }
      if (kind === "categories") {
        // A categories file from an older version: field definitions were
        // flattened to "Label (type)" and subcategories lost their ids.
        // The current -categories.csv carries every stored detail instead,
        // and that is the one that imports.
        ctx.report.skippedFiles.push(f.name + " (readable summary from an older version \u2014 it holds no field keys, so categories cannot be rebuilt from it)");
        return;
      }
      if (kind === "itinerary") {
        ctx.report.skippedFiles.push(f.name + " (itinerary CSV is a report, not an import format)");
        return;
      }
      ctx.report.skippedFiles.push(f.name + " (unrecognised columns)");
    });

    if (!entryRows.length && !productRows.length && !schemaRows.length && !noteRows.length) {
      importFailed("No entries, products, notes or category definitions found in those CSV files." +
        (ctx.report.skippedFiles.length ? " Skipped: " + ctx.report.skippedFiles.join("; ") + "." : ""));
      return;
    }

    // Categories are rebuilt first, because which fields a product row's
    // columns map onto depends on the schemas arriving with it. They are held
    // on the context rather than merged into state: nothing is written until
    // the confirmation modal is answered, so cancelling leaves the existing
    // categories untouched.
    var categories = schemaRows.length ? categoriesFromSchemaRows(schemaRows, ctx.report) : [];
    ctx.report.categories = categories.length;
    ctx.report.categoriesNew = categories.filter(function (c) { return !ctx.knownCategoryIds[c.id]; }).length;
    categories.forEach(function (c) {
      ctx.incomingCategories[c.id] = c;
      ctx.knownCategoryIds[c.id] = true;
    });

    var entries = entryRows.map(function (r) { return entryFromCsvRow(r, ctx); }).filter(Boolean);
    entries.forEach(function (e) { ctx.importedEntriesById[e.id] = e; ctx.importedEntries.push(e); });
    ctx.report.entries = entries.length;
    ctx.report.conflicts = entries.filter(function (e) { return ctx.existingEntriesById[e.id]; }).length;

    // Products are parsed after entries so a product can attach to an item
    // that is arriving in the same import, not just one already saved.
    var products = productRows.map(function (r) { return productFromCsvRow(r, ctx); }).filter(Boolean);
    ctx.report.products = products.length;

    var relationships = relationshipsFromLinks(ctx);
    var notes = noteRows.map(function (r) { return noteFromCsvRow(r, ctx); }).filter(Boolean);
    ctx.report.notes = notes.length;

    state.importNotesPending = notes;
    state.importListsPending = ctx.newLists;
    state.importProductsPending = products;
    state.importRelationshipsPending = relationships;
    state.importCategoriesPending = categories;
    state.importPending = { valid: entries, conflicts: ctx.report.conflicts, kind: "csv", report: ctx.report };    state.modalMode = "import-confirm";
    state.importMessage = null;
    render();
  }

  function importJsonText(text) {
      try {
        var parsed = JSON.parse(text);
        var importedLists = Array.isArray(parsed) ? [] : (Array.isArray(parsed.lists) ? parsed.lists : []);
        // Exports up to v6 called this collection "bottles"; v7 onwards calls
        // them products. Both keys are accepted so older files still import.
        var importedProducts = Array.isArray(parsed) ? [] : (Array.isArray(parsed.products) ? parsed.products : (Array.isArray(parsed.bottles) ? parsed.bottles : []));
        var importedRelationships = Array.isArray(parsed) ? [] : (Array.isArray(parsed.relationships) ? parsed.relationships : []);
        var importedCategories = Array.isArray(parsed) ? [] : (Array.isArray(parsed.categories) ? parsed.categories : []);
        var importedNotes = Array.isArray(parsed) ? [] : (Array.isArray(parsed.notes) ? parsed.notes : []);
        var rawEntries = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.entries) ? parsed.entries : []);
        // Imported records go through exactly the same normalisation as records
        // loaded from the database, so legacy category names ("clothing",
        // "crafts") are remapped instead of degrading to "Other".
        var valid = rawEntries
          .filter(function (item) { return item && typeof item === "object" && item.id && item.title; })
          .map(normalizeEntry);
        // A backup holding only scrapbook notes is still a valid file.
        if (valid.length === 0 && !importedNotes.length) throw new Error("no valid entries");
        state.importNotesPending = importedNotes;
        state.importListsPending = importedLists;
        state.importProductsPending = importedProducts;
        state.importRelationshipsPending = importedRelationships;
        state.importCategoriesPending = importedCategories;

        // Check for conflicting IDs
        var existingMap = {};
        state.entries.forEach(function (e) { existingMap[e.id] = true; });
        var conflicts = valid.filter(function(item) { return existingMap[item.id]; }).length;

        if (conflicts > 0) {
          state.importPending = { valid: valid, conflicts: conflicts, kind: "json" };
          state.modalMode = "import-confirm";
          render();
          return;
        }

        executeImport(valid, true);
      } catch (e) {
        state.importMessage = "Couldn't read that file \u2014 make sure it's a Japan Finds export.";
        render();
        scheduleClearImportMessage();
      }
  }

  window.confirmImportOverwrite = function(allowOverwrite) {
    if (state.importPending) {
      executeImport(state.importPending.valid, allowOverwrite);
    }
  };

  function executeImport(validEntries, allowOverwrite) {
    var map = {};
    state.entries.forEach(function (e) { map[e.id] = e; });
    var listMap = {};
    state.lists.forEach(function(l){ listMap[l.id] = l; });
    (state.importListsPending || []).forEach(function(l){ var n = normalizeList(l); if (!n) return; if (!allowOverwrite && listMap[n.id]) return; listMap[n.id] = n; });

    var importedCount = 0;
    validEntries.forEach(function (item) {
      if (!allowOverwrite && map[item.id]) {
        return; // skip duplicate ID
      }
      normalizeEntry(item);
      map[item.id] = item;
      importedCount++;
    });

    // Categories are merged before anything else, because normalising the
    // imported entries and products depends on the schemas they define.
    // In overwrite mode a record coming in under an existing id replaces it,
    // so re-importing a file cannot produce two copies of the same category.
    // In keep-existing mode ("Keep Existing & Add New Only") existing records
    // of every kind - categories, lists, products, relationships - win, so
    // that choice means what it says rather than applying to entries alone.
    var categoryMap = {};
    state.categories.forEach(function(c){ categoryMap[c.id] = c; });
    var importedCategoryCount = 0;
    (state.importCategoriesPending || []).forEach(function(c){
      var n = normalizeCategory(c);
      if (!n) return;
      if (!allowOverwrite && categoryMap[n.id]) return;
      categoryMap[n.id] = n;
      importedCategoryCount++;
    });
    state.categories = Object.keys(categoryMap).map(function(k){ return categoryMap[k]; });
    if (!state.categories.length) state.categories = seedCategories();
    syncCategoryIndexes();

    var productMap = {};
    state.products.forEach(function(b){ productMap[b.id]=b; });
    (state.importProductsPending || []).forEach(function(b){
      var n = normalizeProduct(b);
      if (!n || !map[n.itemId]) return;
      if (!allowOverwrite && productMap[n.id]) return;
      productMap[n.id] = n;
    });
    var relationMap = {};
    // Links rebuilt from a CSV get fresh ids, so an id check alone would let
    // the same place/item pair be added twice. The pair itself is the identity.
    var relationPairs = {};
    state.relationships.forEach(function(r){ relationMap[r.id]=r; relationPairs[r.placeId + "\u0000" + r.itemId] = true; });
    (state.importRelationshipsPending || []).forEach(function(r){
      if(!r || !r.id || !map[r.placeId] || !map[r.itemId]) return;
      if(!allowOverwrite && relationMap[r.id]) return;
      var pair = r.placeId + "\u0000" + r.itemId;
      if (relationPairs[pair] && !relationMap[r.id]) return;
      relationPairs[pair] = true;
      relationMap[r.id]=r;
    });

    var noteMap = {};
    (state.notes || []).forEach(function (nt) { noteMap[nt.id] = nt; });
    (state.importNotesPending || []).forEach(function (nt) {
      var nn = normalizeNote(nt);
      if (!nn) return;
      if (!allowOverwrite && noteMap[nn.id]) return;
      noteMap[nn.id] = nn;
    });
    state.notes = Object.keys(noteMap).map(function (k) { return noteMap[k]; });
    state.importNotesPending = null;

    var merged = [];
    for (var k in map) { if (map.hasOwnProperty(k)) merged.push(map[k]); }
    merged.sort(function (a, b) { return (b.dateAdded || 0) - (a.dateAdded || 0); });
    state.entries = merged;
    ensureFavouritesList();
    state.lists = Object.keys(listMap).map(function(k){ return listMap[k]; });
    state.products = Object.keys(productMap).map(function(k){ return productMap[k]; });
    state.relationships = Object.keys(relationMap).map(function(k){ return relationMap[k]; });
    pruneEntrySubcategories();
    persistEntries();

    var csvReport = state.importPending && state.importPending.kind === "csv" ? state.importPending.report : null;
    state.importMessage = "Imported " + importedCount + (importedCount === 1 ? " entry" : " entries") +
      (importedCategoryCount ? " and " + importedCategoryCount + " categor" + (importedCategoryCount === 1 ? "y." : "ies.") : ".");
    if (csvReport) {
      var extras = [];
      if (csvReport.products) extras.push(csvReport.products + " product record" + (csvReport.products === 1 ? "" : "s"));
      if (csvReport.categories) extras.push(csvReport.categories + " categor" + (csvReport.categories === 1 ? "y" : "ies") + " rebuilt from the schema file");
      if (csvReport.photosRestored) extras.push(csvReport.photosRestored + " photo" + (csvReport.photosRestored === 1 ? "" : "s") + " restored from the zip");
      if (csvReport.photosByName) extras.push(csvReport.photosByName + " matched by filename to a row title");
      if (csvReport.photosNeedingZip) extras.push(csvReport.photosNeedingZip + " photo" + (csvReport.photosNeedingZip === 1 ? "" : "s") + " not restored (no zip supplied)");
      if (csvReport.photosMissing) extras.push(csvReport.photosMissing + " photo file" + (csvReport.photosMissing === 1 ? "" : "s") + " missing from the zip");
      if (csvReport.linksResolved) extras.push(csvReport.linksResolved + " link" + (csvReport.linksResolved === 1 ? "" : "s") + " rebuilt");
      if (csvReport.listsCreated) extras.push(csvReport.listsCreated + " list" + (csvReport.listsCreated === 1 ? "" : "s") + " created");
      if (extras.length) state.importMessage += " " + extras.join(", ") + ".";
    }
    closeModal();
    scheduleClearImportMessage();
  }

  function scheduleClearImportMessage() {
    if (importMsgTimer) clearTimeout(importMsgTimer);
    importMsgTimer = setTimeout(function () {
      state.importMessage = null;
      // Removing just the message node - a full render here rebuilt the map
      // and discarded the user's pan and zoom five seconds after any import.
      var node = document.getElementById("import-message");
      if (node) node.remove();
      else render();
    }, 5000);
  }

  document.addEventListener("keydown", function (e) {
    // Ctrl+Enter (Cmd+Enter on a Mac - Cmd sets metaKey, never ctrlKey) saves
    // whatever is being edited, innermost first: a product, then a category,
    // then the place/item form. Text still sitting in the tag input is saved
    // as a tag by saveEntry(), so nothing typed is lost.
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.altKey) {
      if (state.noteEditor) {
        e.preventDefault();
        window.saveNoteEditor();
        return;
      }
      if (state.productEditor) {
        e.preventDefault();
        window.saveProductEditor();
        return;
      }
      if (state.categoryEditor) {
        e.preventDefault();
        window.saveCategoryEditor();
        return;
      }
      if ((state.modalMode === "add" || state.modalMode === "edit") && state.form) {
        e.preventDefault();
        if (state.mapPickerOpen) window.confirmMapPicker();
        window.saveEntry();
        return;
      }
    }
    // H (no modifiers, not while typing) folds or unfolds the category and
    // tag rows, on the collection and map screens.
    if ((e.key === "h" || e.key === "H") && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey &&
        !state.modalMode && !state.productTableItemId && !state.itineraryListId && !state.scrapbookOpen && !isTypingTarget(e.target)) {
      e.preventDefault();
      window.toggleFilterTabs();

    });
    for (var i = 0; i < rows.length; i++) {
      var p = cloudSplit(rows[i].key), rec = cloudFindRecord(p[0], p[1]);
      st.meta[rows[i].key] = { h: rec ? cloudHash(cloudCanon(await cloudForm(rec, null))) : "", u: rows[i].u };
      delete st.dirty[rows[i].key];
    }
    delKeys.forEach(function (k) { delete st.meta[k]; delete st.dirty[k]; });
    cloudSaveState(st);
    try { pruneSelectedIds(); } catch (e) {}
    await persistEntries({ skipBackup: true });
    if (!state.modalMode) {
      if (state.mapMode && googleMap) { renderKeepingMaps(); refreshMapIfOpen(); }
      else renderPreservingScroll();
    }
  }

  async function cloudSnapshotBackup() {
    var prev = state.backupInfo;
    state.backupInfo = null; // bypass the age check
    try { await maybeWriteBackup(); } catch (e) {}
    if (!state.backupInfo) state.backupInfo = prev;
  }

  // Remove photo files no record refers to any more. Only runs when this
  // device has nothing unsynced, and only touches files older than a week, so
  // a photo another device has just uploaded is never removed.
  async function cloudMaybeGc(st) {
    if (Object.keys(st.dirty).length) return;
    if (Date.now() - (st.lastGc || 0) < GC_INTERVAL_MS) return;
    var uid = cloud.session.user.id, referenced = new Set(), photos = [];
    CLOUD_COLLECTIONS.forEach(function (col) { (col.get() || []).forEach(function (r) { cloudEach(r, function (s) { if (cloudIsPhoto(s)) photos.push(s); }); }); });
    for (var i = 0; i < photos.length; i++) referenced.add((await cloudPhotoRef(photos[i])).slice(PHOTO_REF_PREFIX.length));
    var objs = [], offset = 0;
    for (;;) {
      var res = await cloudApi("/storage/v1/object/list/" + SB_BUCKET, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prefix: uid, limit: 1000, offset: offset, sortBy: { column: "name", order: "asc" } })
      });
      var items = await res.json();
      objs = objs.concat(items);
      if (items.length < 1000) break;
      offset += 1000;
    }
    var cutoff = Date.now() - GC_MIN_AGE_MS;
    var del = objs.filter(function (o) { return o && o.id && o.name && !referenced.has(o.name) && Date.parse(o.created_at) < cutoff; })
      .map(function (o) { return o.name; });
    for (var j = 0; j < del.length; j += 100) {
      var chunk = del.slice(j, j + 100);
      await cloudApi("/storage/v1/object/" + SB_BUCKET, {
        method: "DELETE", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prefixes: chunk.map(function (n) { return uid + "/" + n; }) })
      });
      chunk.forEach(function (n) { delete st.up[n]; });
    }
    st.lastGc = Date.now();
    cloudSaveState(st);
  }

  // ---------- the sync run ----------
  async function cloudRun() {
    if (cloud.running) { cloud.rerun = true; return; }
    if (!cloud.session || !cloud.dataReady || !cloudSupported()) return;
    cloud.running = true;
    try {
      var st = cloudLoadState();
      // Changes are timestamped even when offline, so the newer edit wins later.
      await cloudDetect(st);
      cloudSaveState(st);
      if (!navigator.onLine) { cloudSetStatus("offline"); return; }
      if (state.modalMode) { cloudSetStatus("waiting"); return; }
      if (cloud.firstDeferred) { cloudSetStatus("paused"); return; }
      cloudSetStatus("syncing");

      var rows = await cloudListRows();
      var keepCloud = false;
      if (!st.firstDone) {
        var localHas = ["entries", "products", "notes", "relationships"].some(function (n) { return (state[n] || []).length > 0; });
        var choice = !rows.size ? "device" : (!localHas ? "cloud" : await cloudAskFirst(rows));
        if (choice === "later") { cloud.firstDeferred = true; cloudSetStatus("paused"); return; }
        if (choice === "cloud" || choice === "merge") await cloudSnapshotBackup();
        if (choice === "cloud") { keepCloud = true; st.dirty = {}; st.meta = {}; }
        if (choice === "device") {
          if (rows.size) { await cloudApi("/rest/v1/" + SB_TABLE + "?user_id=eq." + encodeURIComponent(cloud.session.user.id), { method: "DELETE" }); rows = new Map(); }
          st.meta = {};
          await cloudDetect(st);
        }
        if (choice !== "cloud") st.firstDone = true;
        cloudSaveState(st);
      }

      var fetchKeys = [], localDel = [], localDelSet = {};
      function markLocalDel(k) { if (!localDelSet[k]) { localDelSet[k] = 1; localDel.push(k); } }
      rows.forEach(function (u, key) {
        var m = st.meta[key], d = st.dirty[key];
        if (m && m.u === u) return;     // unchanged in the cloud
        if (d && d.t > u) return;       // changed here more recently: this device wins
        fetchKeys.push(key);
      });
      if (keepCloud) {
        CLOUD_COLLECTIONS.forEach(function (col) {
          (col.get() || []).forEach(function (r) {
            if (r && r.id !== undefined && r.id !== null) { var k = cloudKey(col.name, r.id); if (!rows.has(k)) markLocalDel(k); }
          });
        });
      }
      Object.keys(st.meta).forEach(function (key) {
        if (rows.has(key)) return;
        var d = st.dirty[key];
        if (d && !d.del) delete st.meta[key]; // edited here after another device deleted it: keep and re-upload
        else markLocalDel(key);                // deleted on another device
      });

      var fetchSet = {};
      fetchKeys.forEach(function (k) { fetchSet[k] = 1; });
      var fetched = await cloudFetchRows(fetchKeys);
      await cloudResolvePhotos(fetched, st);
      var pushKeys = Object.keys(st.dirty).filter(function (k) { return !fetchSet[k] && !localDelSet[k]; });
      await cloudPush(st, pushKeys, rows);
      if (fetched.length || localDel.length) await cloudApply(st, fetched, localDel);
      st.firstDone = true;
      cloudSaveState(st);
      await cloudMaybeGc(st);
      cloud.lastSyncedAt = Date.now();
      cloudSetStatus(Object.keys(cloudLoadState().dirty).length ? "syncing" : "ok");
    } catch (e) {
      if (e.kind === "offline") cloudSetStatus("offline");
      else if (e.kind === "auth") { if (cloud.session) cloudSetStatus("error", e.message); }
      else cloudSetStatus("error", e.message || String(e));
    } finally {
      cloud.running = false;
      if (cloud.rerun) { cloud.rerun = false; cloudSchedule(800); }
    }
  }
  function cloudSchedule(ms) { clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudRun, ms); }
  function cloudLocalChanged() { if (cloud.applying) return; cloudSchedule(1500); }
  function cloudDataReady() { cloud.dataReady = true; cloudSchedule(0); }

  // ---------- sign in / out ----------
  async function cloudSignIn(email, password) {
    var d = await cloudAuthRequest("password", { email: email, password: password });
    cloudSaveSession(cloudSessionFrom(d));
    cloud.firstDeferred = false;
    cloudSetStatus("syncing");
    cloudSchedule(0);
  }
  function cloudSignOut() {
    var s = cloud.session;
    if (s) fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: { "apikey": SB_KEY, "Authorization": "Bearer " + s.access_token } }).catch(function () {});
    cloudSaveSession(null);
    cloud.firstDeferred = false;
    cloudSetStatus("off");
  }
  function cloudSignedOut(message) {
    cloudSaveSession(null);
    cloudSetStatus("off");
    cloudShowSignIn(message);
  }

  // ---------- UI ----------
  function cloudEl(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function cloudCloseOverlay() { var o = document.querySelector(".jf-cloud-overlay"); if (o) o.remove(); }

  function cloudShowSignIn(message) {
    cloudCloseOverlay();
    cloudCloseMenu();
    var ov = cloudEl("div", "jf-cloud-overlay");
    var box = cloudEl("form", "jf-cloud-box");
    box.setAttribute("autocomplete", "on");
    box.appendChild(cloudEl("h2", "jf-cloud-title", "Sign in to sync"));
    box.appendChild(cloudEl("p", "jf-cloud-text", "Syncing keeps your collection the same on every device you sign in on."));
    var msg = cloudEl("p", "jf-cloud-error", message || "");
    if (!message) msg.hidden = true;
    var el = cloudEl("label", "jf-cloud-label", "Email");
    var email = cloudEl("input", "jf-cloud-input"); email.type = "email"; email.name = "email"; email.autocomplete = "username"; email.required = true;
    el.appendChild(email);
    var pl = cloudEl("label", "jf-cloud-label", "Password");
    var pw = cloudEl("input", "jf-cloud-input"); pw.type = "password"; pw.name = "password"; pw.autocomplete = "current-password"; pw.required = true;
    pl.appendChild(pw);
    var actions = cloudEl("div", "jf-cloud-actions");
    var go = cloudEl("button", "btn btn-primary", "Sign in"); go.type = "submit";
    var skip = cloudEl("button", "btn btn-outline", "Continue without syncing"); skip.type = "button";
    actions.appendChild(go); actions.appendChild(skip);
    box.appendChild(msg); box.appendChild(el); box.appendChild(pl); box.appendChild(actions);
    ov.appendChild(box);
    document.body.appendChild(ov);
    skip.onclick = function () { cloudCloseOverlay(); cloudRenderStatus(); };
    box.onsubmit = function (ev) {
      ev.preventDefault();
      go.disabled = true; skip.disabled = true; go.textContent = "Signing in…"; msg.hidden = true;
      cloudSignIn(email.value.trim(), pw.value).then(function () { cloudCloseOverlay(); }, function (e) {
        go.disabled = false; skip.disabled = false; go.textContent = "Sign in";
        msg.textContent = e.kind === "offline" ? "Can't reach the sync server. Check your connection and try again." : (e.message || "Sign-in failed.");
        msg.hidden = false;
      });
    };
    setTimeout(function () { try { email.focus(); } catch (e) {} }, 0);
  }

  function cloudAskFirst(rows) {
    return new Promise(function (resolve) {
      cloudCloseOverlay();
      cloudCloseMenu();
      var cloudEntries = 0;
      rows.forEach(function (u, k) { if (k.indexOf("entries|") === 0) cloudEntries++; });
      var ov = cloudEl("div", "jf-cloud-overlay");
      var box = cloudEl("div", "jf-cloud-box");
      box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
      box.appendChild(cloudEl("h2", "jf-cloud-title", "Choose which data to keep"));
      box.appendChild(cloudEl("p", "jf-cloud-text", "Your account already has data in the cloud (" + cloudEntries + " entries), and this device has its own (" + (state.entries || []).length + " entries)."));
      function option(label, desc, value, primary) {
        var wrap = cloudEl("div", "jf-cloud-option");
        var b = cloudEl("button", "btn " + (primary ? "btn-primary" : "btn-outline"), label); b.type = "button";
        b.onclick = function () { cloudCloseOverlay(); resolve(value); };
        wrap.appendChild(b);
        wrap.appendChild(cloudEl("p", "jf-cloud-text", desc));
        box.appendChild(wrap);
        return b;
      }
      var first = option("Keep both", "Combines the two. Where the same item exists in both, this device's version is kept. This device's current data is saved to the automatic backup first.", "merge", true);
      option("Use the cloud data", "Replaces everything on this device with the cloud copy. This device's current data is saved to the automatic backup first.", "cloud");
      option("Use this device's data", "Replaces everything in the cloud with this device's data. The cloud copy is deleted.", "device");
      var later = cloudEl("button", "link-btn jf-cloud-later", "Decide later"); later.type = "button";
      later.onclick = function () { cloudCloseOverlay(); resolve("later"); };
      box.appendChild(later);
      ov.appendChild(box);
      document.body.appendChild(ov);
      setTimeout(function () { try { first.focus(); } catch (e) {} }, 0);
    });
  }

  var CLOUD_LABELS = {
    off: "Not syncing", syncing: "Syncing…", ok: "Synced", offline: "Offline, saved on device",
    waiting: "Changes saved on device", paused: "Sync paused", error: "Sync problem"
  };
  function cloudSetStatus(s, detail) { cloud.status = s; cloud.statusDetail = detail || ""; cloudRenderStatus(); }
  function cloudRenderStatus() {
    if (!cloud.pill) return;
    var s = cloud.session ? cloud.status : "off";
    cloud.pill.setAttribute("data-status", s);
    cloud.pill.querySelector(".jf-cloud-pill-text").textContent = CLOUD_LABELS[s] || s;
    if (cloud.menu) cloudFillMenu();
  }
  function cloudCloseMenu() { if (cloud.menu) { cloud.menu.remove(); cloud.menu = null; } }
  function cloudFillMenu() {
    var m = cloud.menu; m.innerHTML = "";
    var s = cloud.session;
    if (!s) {
      m.appendChild(cloudEl("p", "jf-cloud-text", "This device isn't syncing. Data is saved on this device only."));
      var si = cloudEl("button", "btn btn-primary btn-sm", "Sign in"); si.type = "button";
      si.onclick = function () { cloudShowSignIn(); };
      m.appendChild(si);
      return;
    }
    m.appendChild(cloudEl("p", "jf-cloud-text", "Signed in as " + (s.user.email || "your account")));
    if (cloud.lastSyncedAt) m.appendChild(cloudEl("p", "jf-cloud-text", "Last synced " + new Date(cloud.lastSyncedAt).toLocaleString()));
    if (!cloudSupported()) m.appendChild(cloudEl("p", "jf-cloud-error", "Syncing needs the app opened from its https:// web address."));
    if (cloud.status === "error" && cloud.statusDetail) m.appendChild(cloudEl("p", "jf-cloud-error", cloud.statusDetail));
    if (cloud.status === "waiting") m.appendChild(cloudEl("p", "jf-cloud-text", "Syncing resumes when the open window is closed."));
    var row = cloudEl("div", "jf-cloud-actions");
    if (cloud.status === "paused") {
      var choose = cloudEl("button", "btn btn-primary btn-sm", "Choose data to keep"); choose.type = "button";
      choose.onclick = function () { cloud.firstDeferred = false; cloudCloseMenu(); cloudSchedule(0); };
      row.appendChild(choose);
    } else {
      var now = cloudEl("button", "btn btn-primary btn-sm", "Sync now"); now.type = "button";
      now.onclick = function () { cloudCloseMenu(); cloudSetStatus("syncing"); cloudSchedule(0); };
      row.appendChild(now);
    }
    var out = cloudEl("button", "btn btn-outline btn-sm", "Sign out"); out.type = "button";
    out.onclick = function () { cloudSignOut(); cloudCloseMenu(); };
    row.appendChild(out);
    m.appendChild(row);
  }
  function cloudToggleMenu() {
    if (cloud.menu) { cloudCloseMenu(); return; }
    cloud.menu = cloudEl("div", "jf-cloud-menu");
    cloud.menu.setAttribute("role", "dialog");
    document.body.appendChild(cloud.menu);
    cloudFillMenu();
  }

  function cloudInit() {
    cloud.session = cloudLoadSession();
    var pill = cloudEl("button", "jf-cloud-pill");
    pill.type = "button";
    pill.setAttribute("aria-label", "Sync status");
    pill.appendChild(cloudEl("span", "jf-cloud-dot"));
    pill.appendChild(cloudEl("span", "jf-cloud-pill-text", ""));
    pill.onclick = cloudToggleMenu;
    document.body.appendChild(pill);
    cloud.pill = pill;
    document.addEventListener("click", function (e) {
      if (cloud.menu && !cloud.menu.contains(e.target) && !cloud.pill.contains(e.target)) cloudCloseMenu();
    });
    if (!cloudSupported()) { cloudSetStatus("error", "Syncing needs the app opened from its https:// web address."); return; }
    if (!cloud.session) { cloudSetStatus("off"); cloudShowSignIn(); }
    else cloudSetStatus(navigator.onLine ? "syncing" : "offline");
    window.addEventListener("online", function () { cloudSchedule(0); });
    window.addEventListener("offline", function () { if (cloud.session) cloudSetStatus("offline"); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") cloudSchedule(0); });
    setInterval(function () { if (document.visibilityState === "visible" && cloud.session) cloudSchedule(0); }, 60000);
  }
  cloudInit();
  // =================== end cloud sync ===================


  render();
})();
</script>
