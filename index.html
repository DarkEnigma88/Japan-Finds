  // ---------- itinerary ----------

  function getList(id) {
    return state.lists.find(function (l) { return l.id === id; }) || null;
  }

  function entryById(id) {
    return state.entries.find(function (e) { return e.id === id; }) || null;
  }

  // Everything in the list that is not already sitting in a day.
  function unscheduledForList(list) {
    var placed = {};
    (list.days || []).forEach(function (d) { (d.stops || []).forEach(function (id) { placed[id] = true; }); });
    return state.entries.filter(function (e) {
      return (e.lists || []).indexOf(list.id) !== -1 && !placed[e.id];
    });
  }

  // Leg distances between consecutive stops. A leg is null when either end has
  // no coordinates, so an unmapped stop breaks the chain instead of inventing
  // a distance to it.
  function dayLegs(stops) {
    var legs = [];
    for (var i = 1; i < stops.length; i++) {
      var a = entryById(stops[i - 1]), b = entryById(stops[i]);
      legs.push(a && b && hasCoords(a) && hasCoords(b)
        ? getDistanceKm(entryLat(a), entryLng(a), entryLat(b), entryLng(b))
        : null);
    }
    return legs;
  }

  function dayTotalKm(stops) {
    return dayLegs(stops).reduce(function (sum, d) { return sum + (d || 0); }, 0);
  }

  function dayDateLabel(d) {
    if (!d.date) return "";
    var parts = d.date.split("-");
    if (parts.length !== 3) return d.date;
    var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if (isNaN(dt.getTime())) return d.date;
    return dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  function renderItineraryView() {
    var list = getList(state.itineraryListId);
    if (!list) return '<main class="jf-main"><span class="jf-empty-search">That list no longer exists.</span></main>';

    var days = list.days || [];
    var unscheduled = unscheduledForList(list);
    var memberCount = state.entries.filter(function (e) { return (e.lists || []).indexOf(list.id) !== -1; }).length;
    var dayOptions = days.map(function (d, i) {
      return '<option value="' + esc(d.id) + '">' + esc(d.label || ("Day " + (i + 1))) + '</option>';
    }).join("");

    var daysHtml = days.map(function (day, dayIdx) {
      var stops = day.stops || [];
      var legs = dayLegs(stops);
      var stopEntries = stops.map(entryById).filter(Boolean);
      var spread = spreadKm(stopEntries);
      var total = dayTotalKm(stops);
      var noCoords = unlocatedCount(stopEntries);

      var stopsHtml = stops.map(function (id, i) {
        var e = entryById(id);
        if (!e) return "";
        var cat = categoryMeta(primaryCategory(e));
        var leg = i > 0 ? legs[i - 1] : null;
        var legHtml = i === 0 ? "" :
          (leg === null
            ? ' \u00b7 <span class="jf-nocoord">no map location</span>'
            : ' \u00b7 <span class="' + (leg > LEG_WARN_KM ? "far" : "") + '">' + esc(formatKm(leg)) + ' from previous</span>');
        var moveOptions = days.filter(function (d2) { return d2.id !== day.id; }).map(function (d2) {
          var idx = days.indexOf(d2);
          return '<option value="' + esc(d2.id) + '">\u2192 ' + esc(d2.label || ("Day " + (idx + 1))) + '</option>';
        }).join("");
        var isDragging = state.itineraryDrag && state.itineraryDrag.entryId === e.id;
        var isTarget = state.itineraryDropTarget && state.itineraryDropTarget.dayId === day.id && state.itineraryDropTarget.index === i;
        return '<div class="jf-stop' + (isDragging ? ' dragging' : '') + (isTarget ? ' drop-target' : '') + '" draggable="true"' +
          ' data-day="' + esc(day.id) + '" data-idx="' + i + '"' +
          ' ondragstart="onStopDragStart(event,' + escAttrJs(day.id) + ',' + escAttrJs(e.id) + ')"' +
          ' ondragover="onStopDragOver(event,' + escAttrJs(day.id) + ',' + i + ')"' +
          ' ondrop="onStopDrop(event,' + escAttrJs(day.id) + ',' + i + ')"' +
          ' ondragend="onStopDragEnd(event)">' +
          '<div class="jf-stop-num" title="Drag to reorder">' + (i + 1) + '</div>' +
          '<div><p class="jf-stop-name">' + esc(e.title) + '</p>' +
          '<p class="jf-stop-meta">' + esc(cat.icon || "") + ' ' + esc(cat.label) +
          (e.city ? ' \u00b7 ' + esc(e.city) : '') +
          (hasCoords(e) ? '' : ' \u00b7 <span class="jf-nocoord">no map location</span>') +
          legHtml + '</p></div>' +
          '<div class="jf-stop-actions">' +
          '<button class="btn btn-outline btn-sm" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveStop(' + escAttrJs(day.id) + ',' + i + ',-1)" aria-label="Move up">\u2191</button>' +
          '<button class="btn btn-outline btn-sm" ' + (i === stops.length - 1 ? 'disabled' : '') + ' onclick="moveStop(' + escAttrJs(day.id) + ',' + i + ',1)" aria-label="Move down">\u2193</button>' +
          (moveOptions ? '<select onchange="moveStopToDay(' + escAttrJs(day.id) + ',' + escAttrJs(e.id) + ',this.value)"><option value="">Move\u2026</option>' + moveOptions + '</select>' : '') +
          '<button class="btn btn-outline btn-sm" onclick="openView(' + escAttrJs(e.id) + ')">View</button>' +
          '<button class="btn btn-outline btn-sm" onclick="unscheduleStop(' + escAttrJs(day.id) + ',' + escAttrJs(e.id) + ')" aria-label="Remove from day">\u2715</button>' +
          '</div></div>';
      }).join("");

      // Dropping below the last stop appends, which is otherwise unreachable
      // because every drop target sits on top of an existing stop.
      var tailDrop = '<div class="jf-stop" style="border:none;padding:4px 0;min-height:14px"' +
        ' data-day="' + esc(day.id) + '" data-idx="' + stops.length + '"' +
        ' ondragover="onStopDragOver(event,' + escAttrJs(day.id) + ',' + stops.length + ')"' +
        ' ondrop="onStopDrop(event,' + escAttrJs(day.id) + ',' + stops.length + ')"></div>';

      return '<section class="jf-day">' +
        '<div class="jf-day-head">' +
        '<span class="jf-stop-num" style="background:var(--moss)">' + (dayIdx + 1) + '</span>' +
        '<input type="text" value="' + esc(day.label || "") + '" placeholder="Day ' + (dayIdx + 1) + '" onchange="setDayLabel(' + escAttrJs(day.id) + ',this.value)">' +
        '<input type="date" value="' + esc(day.date || "") + '" onchange="setDayDate(' + escAttrJs(day.id) + ',this.value)" aria-label="Date for this day">' +
        (day.date ? '<span class="jf-fence-hint" style="margin:0">' + esc(dayDateLabel(day)) + '</span>' : '') +
        '<button class="btn btn-outline btn-sm" ' + (stops.length < 3 ? 'disabled title="Needs at least 3 stops"' : '') + ' onclick="autoOrderDay(' + escAttrJs(day.id) + ')">\u21C4 Auto-order</button>' +
        '<button class="btn btn-outline btn-sm" ' + (!stopEntries.filter(hasCoords).length ? 'disabled' : '') + ' onclick="showDayOnMap(' + escAttrJs(day.id) + ')">\uD83D\uDDFA Map this day</button>' +
        '<button class="btn btn-outline btn-sm" ' + (dayIdx === 0 ? 'disabled' : '') + ' onclick="moveDay(' + escAttrJs(day.id) + ',-1)" aria-label="Move day earlier">\u2191</button>' +
        '<button class="btn btn-outline btn-sm" ' + (dayIdx === days.length - 1 ? 'disabled' : '') + ' onclick="moveDay(' + escAttrJs(day.id) + ',1)" aria-label="Move day later">\u2193</button>' +
        (state.dayDeleteConfirmId === day.id
          ? '<span class="jf-confirm-row" style="margin:0">Delete this day? Its ' + stops.length + ' stop' + (stops.length === 1 ? '' : 's') + ' go back to Unscheduled. ' +
            '<button class="link-btn danger" onclick="deleteDay(' + escAttrJs(day.id) + ')">Yes, delete</button> ' +
            '<button class="link-btn" onclick="cancelDeleteDay()">Cancel</button></span>'
          : '<button class="link-btn danger" onclick="confirmDeleteDay(' + escAttrJs(day.id) + ')">Delete day</button>') +
        '</div>' +
        '<div class="jf-day-body">' + (stopsHtml || '<p class="jf-fence-hint">No stops yet \u2014 add them from the unscheduled list below, or drag one in.</p>') + tailDrop + '</div>' +
        '<div class="jf-day-foot">' +
        '<span>' + stops.length + ' stop' + (stops.length === 1 ? '' : 's') + '</span>' +
        (stops.length > 1 ? '<span>' + esc(formatKm(total)) + ' walking, straight-line</span>' : '') +
        (stops.length > 1 ? '<span class="' + (spread > DAY_SPREAD_WARN_KM ? 'warn' : '') + '">' + esc(formatKm(spread)) + ' across' +
          (spread > DAY_SPREAD_WARN_KM ? ' \u2014 probably too spread out for one day' : '') + '</span>' : '') +
        (noCoords ? '<span>' + noCoords + ' stop' + (noCoords === 1 ? '' : 's') + ' without a map location, not counted</span>' : '') +
        '</div></section>';
    }).join("");

    var unscheduledHtml =
      '<div class="jf-unscheduled">' +
      '<h3>Unscheduled</h3>' +
      '<p class="jf-fence-hint">' + unscheduled.length + ' of ' + memberCount + ' in this list ' + (unscheduled.length === 1 ? 'is' : 'are') + ' not on a day yet.</p>' +
      (unscheduled.length
        ? unscheduled.map(function (e) {
            var cat = categoryMeta(primaryCategory(e));
            return '<div class="jf-stop" draggable="true" ondragstart="onStopDragStart(event,\'\',' + escAttrJs(e.id) + ')" ondragend="onStopDragEnd(event)">' +
              '<div class="jf-stop-num" style="background:var(--ink-soft)">\u2022</div>' +
              '<div><p class="jf-stop-name">' + esc(e.title) + '</p>' +
              '<p class="jf-stop-meta">' + esc(cat.icon || "") + ' ' + esc(cat.label) + (e.city ? ' \u00b7 ' + esc(e.city) : '') +
              (hasCoords(e) ? '' : ' \u00b7 <span class="jf-nocoord">no map location</span>') + '</p></div>' +
              '<div class="jf-stop-actions">' +
              (days.length
                ? '<select onchange="scheduleStop(' + escAttrJs(e.id) + ',this.value)"><option value="">Add to\u2026</option>' + dayOptions + '</select>'
                : '<span class="jf-fence-hint">Add a day first</span>') +
              '<button class="btn btn-outline btn-sm" onclick="openView(' + escAttrJs(e.id) + ')">View</button>' +
              '</div></div>';
          }).join("")
        : '<p class="jf-fence-hint">Everything in this list has been scheduled.</p>') +
      '</div>';

    var allStops = [];
    days.forEach(function (d) { (d.stops || []).forEach(function (id) { allStops.push(id); }); });
    var allEntries = allStops.map(entryById).filter(Boolean);

    return '<div class="jf-itin-header">' +
      '<div><h2 class="jf-itin-title">' + esc(list.name) + '</h2>' +
      '<p class="jf-itin-sub">' + days.length + ' day' + (days.length === 1 ? '' : 's') + ' \u00b7 ' + allStops.length + ' scheduled stop' + (allStops.length === 1 ? '' : 's') +
      (allEntries.length > 1 ? ' \u00b7 whole trip spans ' + formatKm(spreadKm(allEntries)) : '') + '</p></div>' +
      '<div class="jf-itin-actions">' +
      '<button class="btn btn-primary btn-sm" onclick="addDay()">+ Add day</button>' +
      '<button class="btn btn-outline btn-sm" ' + (!allStops.length ? 'disabled' : '') + ' onclick="autoOrderAllDays()">\u21C4 Auto-order every day</button>' +
      '<button class="btn btn-outline btn-sm" ' + (!allStops.length ? 'disabled' : '') + ' onclick="exportItineraryCsv()">\u2B07 Export CSV</button>' +
      '<button class="btn btn-outline btn-sm" ' + (!allStops.length ? 'disabled' : '') + ' onclick="printItinerary()" title="Print, or save as PDF, a day-by-day sheet">\u2399 Print day sheet</button>' +
      '<button class="btn btn-outline btn-sm" onclick="closeItinerary()">\u2190 Back to collection</button>' +
      '</div></div>' +
      '<main class="jf-main">' +
      (days.length ? daysHtml : '<p class="jf-fence-hint" style="margin-bottom:18px">No days yet. Add one, then drag places across from Unscheduled.</p>') +
      unscheduledHtml +
      '<p class="jf-map-help">Distances are straight-line, not walking routes \u2014 treat them as a sanity check on how far apart your stops are, not as travel time.</p>' +
      '</main>';
  }

  // The grid already lists the fenced places as cards, so the roll-up there is
  // just the header line - the full list would be the same content twice.
  function renderFenceSummaryLine() {
    if (!state.geoFence || state.mapMode) return "";
    var inside = getFilteredEntries().filter(isPlace);
    return '<div class="jf-fenced-summary">Area filter <strong>' + esc(fenceDescription()) + '</strong> \u2014 ' +
      inside.length + ' place' + (inside.length === 1 ? '' : 's') + ' shown, Items hidden. ' +
      '<button type="button" class="link-btn" onclick="clearGeoFence()">Clear</button></div>';
  }

  function renderMain() {
    return renderFenceSummaryLine() + '<main class="jf-main"><div id="grid-container">' + renderGridInner() + "</div></main>";
  }

  function renderGridInner() {
    if (state.entries.length === 0) return renderEmptyState();
    var filtered = getFilteredEntries();
    if (filtered.length === 0) {
      return '<span class="jf-empty-search">No finds match that search.</span>';
    }

    if (state.displayMode === "list") {
      return '<div class="jf-list-view">' + filtered.map(renderListRow).join("") + '</div>';
    }

    if (state.sortBy === "city") {
      var groups = {};
      filtered.forEach(function (e) {
        var city = (e.city || "").trim() || "Unspecified Location";
        if (!groups[city]) groups[city] = [];
        groups[city].push(e);
      });
      var html = "";
      Object.keys(groups).sort().forEach(function (city) {
        html += '<div class="jf-group-title">' + esc(city) + ' (' + groups[city].length + ')</div>';
        html += '<div class="jf-grid">' + groups[city].map(renderCard).join("") + '</div>';
      });
      return html;
    }

    return '<div class="jf-grid">' + filtered.map(renderCard).join("") + "</div>";
  }

  function renderEmptyState() {
    return (
      '<div class="jf-empty"><div class="jf-empty-icon">\uD83D\uDCF7</div>' +
      '<p class="jf-empty-title">Nothing catalogued yet</p>' +
      '<p class="jf-empty-sub">Start adding the things you find \u2014 a snack wrapper, a shop sign, a strange vending machine.</p>' +
      '<button class="btn btn-primary" onclick="openAdd()">+ Add your first find</button></div>'
    );
  }

  // The star toggles membership of the built-in Favourites list. It stops
  // the click so the card underneath does not open.
  function favStarHtml(entry, extraClass) {
    var on = isFavourite(entry);
    return '<button type="button" class="jf-fav' + (on ? ' on' : '') + (extraClass ? ' ' + extraClass : '') + '" onclick="event.stopPropagation(); toggleFavourite(' + escAttrJs(entry.id) + ')" aria-pressed="' + on + '" aria-label="' + (on ? 'Remove from favourites' : 'Add to favourites') + '" title="' + (on ? 'Favourite' : 'Add to favourites') + '">' + (on ? '\u2605' : '\u2606') + '</button>';
  }

  function renderListRow(entry) {
    var cat = categoryMeta(primaryCategory(entry));
    var photos = Array.isArray(entry.photos) ? entry.photos : [];
    var coverPhoto = photos.length ? photos[0] : null;
    var listVisual = coverPhoto
      ? '<div class="jf-list-icon has-photo"><img src="' + esc(coverPhoto) + '" alt="' + esc(entry.title) + '" loading="lazy"></div>'
      : '<div class="jf-list-icon" style="color:'+esc(cat.color)+'">'+esc(cat.icon || cat.abbr || "•")+'</div>';
    var typeLabel = isPlace(entry) ? "Place" : "Item";
    var categoryLabel = entryCategories(entry).map(function(id){ return categoryMeta(id).label; }).join(", ");
    var location = isPlace(entry) ? [entry.prefecture, entry.city].filter(Boolean).join(" · ") : "";
    var status = entry.status === "visited" ? "Visited" : entry.status === "want-to-go" ? "Want to Go" : entry.status === "tried" ? "Tried" : entry.status === "want-to-try" ? "Want to Try" : "";
    var date = entryDateLabel(entry);
    var selected = !!state.selectedIds[entry.id];
    var checkHtml = state.bulkMode ? '<input type="checkbox" class="jf-list-select-check" '+(selected?"checked":"")+' onclick="event.stopPropagation(); toggleSelectCard('+escAttrJs(entry.id)+', event)">' : '';
    var handler = state.bulkMode ? 'toggleSelectCard(' + escAttrJs(entry.id) + ', event)' : 'openView(' + escAttrJs(entry.id) + ')';
    return '<div data-entry-id="'+esc(entry.id)+'" class="jf-list-row '+(state.bulkMode?'bulk-mode ':'')+(selected?'selected':'')+'"'+activationAttrs(handler)+'>' +
      (state.bulkMode ? '<div>'+checkHtml+'</div>' : '') +
      listVisual +
      '<div class="jf-list-main"><h3 class="jf-list-title">'+esc(entry.title)+'</h3><p class="jf-list-meta">'+esc(typeLabel+' · '+categoryLabel+(location?' · '+location:''))+'</p></div>' +
      '<div class="jf-list-side">'+(status?'<span>'+esc(status)+'</span>':'')+(date?'<span>'+esc(date)+'</span>':'')+'</div>' +
      favStarHtml(entry, "jf-fav-row") +
      '</div>';
  }

  function renderCard(entry) {
    var cat = categoryMeta(primaryCategory(entry));
    var photos = entry.photos || [];
    var coverPhoto = photos.length ? photos[0] : null;
    var photoHtml = coverPhoto
      ? '<img src="' + esc(coverPhoto) + '" alt="' + esc(entry.title) + '" loading="lazy">'
      : '<div class="jf-card-noimg jf-card-icon-fallback" style="color:' + esc(cat.color) + '" aria-label="' + esc(cat.label) + '">' + esc(cat.icon || cat.abbr || "•") + '</div>';
    var photoBadge = photos.length > 1 ? '<div class="jf-card-badge">📷 ' + photos.length + '</div>' : '';
    
    var statusLabel = entry.status === "visited" ? "Visited"
      : entry.status === "want-to-go" ? "Want to Go"
      : entry.status === "tried" ? "Tried"
      : entry.status === "want-to-try" ? "Want to Try"
      : "";
    var isWant = entry.status === "want-to-go" || entry.status === "want-to-try";
    var statusBadgeHtml = statusLabel
      ? '<div class="jf-badge-status' + (isWant ? ' jf-badge-want' : '') + '">' + statusLabel + '</div>'
      : '';

    var tagsHtml = "";
    if (entry.tags && entry.tags.length) {
      tagsHtml = '<div class="jf-tags">' + entry.tags.slice(0, 4).map(function (t) {
        return '<span class="jf-tag">' + esc(t) + "</span>";
      }).join("") + "</div>";
    }
    var placeParts = [entry.city, entry.neighborhood, entry.location].filter(function (v) { return v; });
    var locationHtml = placeParts.length ? "\uD83D\uDCCD " + esc(placeParts.join(" · ")) + " \u00b7 " : "";

    var selectCheckbox = state.bulkMode
      ? '<input type="checkbox" class="jf-card-select-check" ' + (state.selectedIds[entry.id] ? "checked" : "") + ' onclick="event.stopPropagation(); toggleSelectCard(' + escAttrJs(entry.id) + ', event)">'
      : '';
    var cardHandler = state.bulkMode ? 'toggleSelectCard(' + escAttrJs(entry.id) + ', event)' : 'openView(' + escAttrJs(entry.id) + ')';

    return (
      '<div data-entry-id="' + esc(entry.id) + '" class="jf-card' + (state.bulkMode ? ' bulk-mode' : '') + (state.selectedIds[entry.id] ? ' selected' : '') + '"' + activationAttrs(cardHandler) + '>' +
      selectCheckbox +
      '<div class="jf-card-photo">' + photoHtml + photoBadge + statusBadgeHtml + favStarHtml(entry, "jf-fav-card") +
      '<div class="jf-stamp jf-card-stamp" style="color:' + esc(cat.color) + '" title="' + esc(cat.label) + '">' + esc(cat.icon || cat.abbr) + "</div></div>" +
      '<div class="jf-card-body">' +
      '<h3 class="jf-card-title">' + esc(entry.title) + "</h3>" +
      '<p class="jf-card-meta">' + locationHtml + entryDateLabel(entry) + "</p>" +
      tagsHtml +
      "</div></div>"
    );
  }

  function renderFooter() {
    if (state.entries.length === 0) return "";
    var sizeStr = formatBytes(getStorageBytes());
    if (state.confirmingClear) {
      return (
        '<footer class="jf-footer"><div class="jf-confirm-row">Clear all ' + state.entries.length + " entries? " +
        '<button class="link-btn danger" onclick="clearAll()">Yes, clear</button> ' +
        '<button class="link-btn" onclick="cancelClear()">Cancel</button></div>' +
        '<span style="font-size:11px;color:var(--ink-soft)">Storage: ' + sizeStr + '</span>' +
        '</footer>'
      );
    }
    return (
      '<footer class="jf-footer">' +
      '<span style="font-size:11px;color:var(--ink-soft);font-family:ui-monospace,monospace">Storage used: ' + sizeStr + '</span>' +
      '<button class="link-btn" onclick="confirmClear()">Clear collection</button></footer>'
    );
  }

  function renderModal() {
    if (state.modalMode === "view") return renderViewModal();
    if (state.modalMode === "add" || state.modalMode === "edit") return renderFormModal();
    if (state.modalMode === "export") return renderExportModal();
    if (state.modalMode === "export-filtered") return renderFilteredExportModal();
    if (state.modalMode === "backup") return renderBackupModal();
    if (state.modalMode === "import-confirm") return renderImportConfirmModal();
    if (state.modalMode === "import") return renderImportModal();
    if (state.modalMode === "lists") return renderListManagerModal();
    if (state.modalMode === "categories") return renderCategoryManagerModal();
    return "";
  }

  function renderListManagerModal() {
    // Per-list entry counts built in one pass instead of one full scan per row.
    var entriesPerList={};state.entries.forEach(function(e){(e.lists||[]).forEach(function(id){entriesPerList[id]=(entriesPerList[id]||0)+1;});});

  function productsForItem(itemId) {

  // Linked lists are always shown alphabetically, whatever order the links

  function byTitle(a, b) {

  }
  function placesForItem(itemId) {
    var ids = (state.relationships || []).filter(function(r){ return r.itemId === itemId; }).map(function(r){ return r.placeId; });

  }
  function itemsForPlace(placeId) {
    var ids = (state.relationships || []).filter(function(r){ return r.placeId === placeId; }).map(function(r){ return r.itemId; });

  }

  }
  // Relationship lookups indexed once, for code paths that would otherwise
  // rescan state.relationships and state.entries for every entry in a loop.
  function buildRelationIndex() {

      if (!r) return;
      (byItem[r.itemId] = byItem[r.itemId] || []).push(r.placeId);
      (byPlace[r.placeId] = byPlace[r.placeId] || []).push(r.itemId);

  // Resolves a list of linked ids to live entries matching the predicate,
  // de-duplicated, using a prebuilt id map instead of filtering state.entries.
  function linkedEntries(ids, byId, predicate) {
    var seen = {}, out = [];
    (ids || []).forEach(function (id) {

  // Reads every schema field back out of the DOM before anything re-renders,

  window.confirmDeleteProduct = function(id) {
    state.productDeleteConfirmId = id;
    if (state.mapMode) renderModalOverlayPreservingMap(); else rerenderModalOnly();
  };
  window.cancelDeleteProduct = function() {
    state.productDeleteConfirmId = null;
    if (state.mapMode) renderModalOverlayPreservingMap(); else rerenderModalOnly();
  };
  window.deleteProduct = function(id) {
    state.products = state.products.filter(function(x){ return x.id!==id; });
    if(state.productEditor && state.productEditor.id===id) state.productEditor=null;
    state.productDeleteConfirmId = null;
    persistEntries(); render();
  };

  // ---------- Schema-driven product form ----------
  function productFieldInputHtml(field, ed) {
    var id = fieldInputId(field.key);
    var raw = ed.values && ed.values[field.key] != null ? String(ed.values[field.key]) : "";
    var labelHtml = '<label for="' + esc(id) + '">' + esc(field.label) + ' <span class="jf-optional">(optional)</span></label>';
    var ph = field.placeholder || "";
    if (field.type === "textarea") {
      return '<div class="field">' + labelHtml + '<textarea id="' + esc(id) + '" rows="3" placeholder="' + esc(ph) + '">' + esc(raw) + '</textarea></div>';
    }
    if (field.type === "date") {
      return '<div class="field">' + labelHtml + '<input id="' + esc(id) + '" type="date" value="' + esc(raw) + '"></div>';
    }
    if (field.type === "number") {
      return '<div class="field">' + labelHtml + '<input id="' + esc(id) + '" type="text" inputmode="decimal" value="' + esc(formatNumericWithCommas(raw)) + '" oninput="this.value=formatNumericWithCommas(this.value)" placeholder="' + esc(ph) + '"></div>';
    }
    if (field.type === "price") {
      var cur = ed.values && ed.values[field.key + "__currency"] ? String(ed.values[field.key + "__currency"]) : "";
      var curOptions = CURRENCY_OPTIONS.map(function (c) {
        return '<option value="' + esc(c) + '"' + (cur === c ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join("");
      return '<div class="jf-product-grid">' +
        '<div class="field">' + labelHtml + '<input id="' + esc(id) + '" type="text" value="' + esc(formatPrice(raw)) + '" oninput="this.value=formatNumericWithCommas(this.value)" placeholder="' + esc(ph || "e.g. 8,500") + '"></div>' +
        '<div class="field"><label for="' + esc(id) + '__currency">Currency <span class="jf-optional">(required if an amount is entered)</span></label>' +
        '<select id="' + esc(id) + '__currency"><option value="">Select currency</option>' + curOptions + '</select></div></div>';
    }
    if (field.type === "select") {
      var opts = (field.options || []).map(function (o) {
        return '<option value="' + esc(o) + '"' + (raw === o ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join("");
      if (field.allowOther) opts += '<option value="' + OTHER_VALUE + '"' + (raw === OTHER_VALUE ? ' selected' : '') + '>Other\u2026</option>';
      var otherVal = ed.values && ed.values[field.key + "__other"] ? String(ed.values[field.key + "__other"]) : "";
      var otherHtml = field.allowOther
        ? '<div class="field" id="' + esc(id) + '__other-wrap" style="display:' + (raw === OTHER_VALUE ? '' : 'none') + '"><label for="' + esc(id) + '__other">' + esc(field.label) + ' \u2014 other</label>' +
          '<input id="' + esc(id) + '__other" type="text" value="' + esc(otherVal) + '" placeholder="' + esc(ph) + '"></div>'
        : '';
      var select = '<div class="field">' + labelHtml + '<select id="' + esc(id) + '"' +
        (field.allowOther ? ' onchange="toggleProductSelectOther(' + escAttrJs(field.key) + ', this.value)"' : '') +
        '><option value="">Select ' + esc(field.label.toLowerCase()) + '</option>' + opts + '</select></div>';
      return field.allowOther ? '<div class="jf-product-grid">' + select + otherHtml + '</div>' : select;
    }
    return '<div class="field">' + labelHtml + '<input id="' + esc(id) + '" type="text" value="' + esc(raw) + '" placeholder="' + esc(ph) + '"></div>';
  }

  function productEditorHtml(entry) {
    var ed = state.productEditor;
    if (!ed || ed.itemId !== entry.id) return "";
    var photos = ed.photos || [];
    var fields = fieldsForItem(entry);
    var fieldsHtml = fields.map(function (f) { return productFieldInputHtml(f, ed); }).join("");
    if (!fields.length) {
      fieldsHtml = '<p class="jf-optional">This category has no product fields yet. Add some in Categories \u2192 ' + esc(categoryMeta(primaryCategory(entry)).label) + '.</p>';
    }
    var thumbs = photos.length ? '<div class="jf-photos-grid">' + photos.map(function(src,i){
      var coverLabel = i===0 ? '<span class="jf-photo-cover-badge">COVER</span>' : '<button type="button" class="jf-photo-thumb-cover" onclick="setProductPhotoAsCover('+i+')">Make Cover</button>';
      return '<div class="jf-photo-thumb" draggable="true" ondragstart="onProductPhotoDragStart(event,'+i+')" ondragover="onProductPhotoDragOver(event)" ondrop="onProductPhotoDrop(event,'+i+')">'+coverLabel+'<img src="'+esc(src)+'"><button type="button" class="jf-photo-thumb-remove" onclick="removeProductPhotoAt('+i+')">\u2715</button></div>';
    }).join('') + '</div>' : '';
    var idx = Math.min(ed.photoIndex || 0, Math.max(0, photos.length - 1));
    var carousel = photos.length ? '<div class="jf-product-carousel jf-carousel"><img src="'+esc(photos[idx])+'" alt="Product photo '+(idx+1)+'">'+(photos.length>1?'<button type="button" class="jf-carousel-btn prev" onclick="prevProductPhoto()">\u276e</button><button type="button" class="jf-carousel-btn next" onclick="nextProductPhoto()">\u276f</button>':'')+'</div>' : '';
    var photoSection = '<div class="jf-product-photo-section"><div class="jf-photo-dropzone" id="product-photo-dropzone" ondragover="handleProductDropzoneDragOver(event)" ondragleave="handleProductDropzoneDragLeave(event)" ondrop="handleProductDropzoneDrop(event)" onclick="triggerProductPhotoInput()">\uD83D\uDCF7<span>Drag & drop photos here, or click to browse</span></div><input id="product-photo-input" type="file" accept="image/*,.svg" multiple style="display:none" onchange="handleProductPhotoInputChange(event)">'+carousel+thumbs+'</div>';
    var templates = ed.mode === "add" ? productTemplatesFor(entry) : [];
    var templatePicker = templates.length
      ? '<div class="field"><label>Start from a template <span class="jf-optional">(optional)</span></label><select onchange="applyProductTemplate(this.value)"><option value="">Blank</option>' +
        templates.map(function (t) { var owner = entryById(t.itemId); return '<option value="' + esc(t.id) + '"' + (ed.fromTemplate === t.id ? ' selected' : '') + '>' + esc(t.name || "Untitled") + (owner && owner.id !== entry.id ? ' \u2014 ' + esc(owner.title) : '') + '</option>'; }).join("") +
        '</select><p class="jf-map-help">Copies the template\u2019s name, fields and photos into this form.</p></div>'
      : '';
    return '<div class="jf-product-editor" style="padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">' + templatePicker +
      '<div class="field"><label for="product-name">Product / designation</label><input id="product-name" type="text" value="'+esc(ed.name)+'" placeholder="e.g. Honmaru"></div>' +
      fieldsHtml + photoSection +
      (state.productError ? '<p class="jf-form-error">'+esc(state.productError)+'</p>' : '') +
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" type="button" onclick="saveProductEditor()">'+(ed.mode==='edit'?'Save product':'Add product')+'</button>' +
      '<button class="btn btn-outline btn-sm" type="button" onclick="cancelProductEditor()">Cancel</button></div></div>';
  }

  function productDetailsHtml(prod, fields) {
    var details = "";
    (fields || []).forEach(function (f) {
      var display = productFieldDisplay(prod, f);
      if (!String(display).trim()) return;
      details += '<div><span class="jf-product-label">' + esc(f.label) + '</span><span>' + esc(display) + '</span></div>';
    });
    orphanProductValues(prod, fields).forEach(function (o) {
      details += '<div><span class="jf-product-label">' + esc(o.label) + '</span><span>' + esc(o.value) + '</span></div>';
    });
    return details;
  }

  window.linkItemToPlace = function(itemId, placeId) {
    if(!placeId || relationExists(placeId,itemId)) return;
    state.relationships.push({id:makeId(), placeId:placeId, itemId:itemId});
    persistEntries(); render();
  };
  window.unlinkItemFromPlace = function(placeId,itemId) {
    state.relationships = state.relationships.filter(function(r){ return !(r.placeId===placeId && r.itemId===itemId); });
    persistEntries(); render();
  };
  // A type-to-filter list in place of a <select>. Filtering happens in the
  // DOM, so typing never triggers a re-render. onPickJs receives the id as
  // its single argument.
  // collapsed: the list only opens while the search box has focus, so a long
  // form does not grow by a list nobody asked for.
  function searchPickerHtml(id, placeholder, candidates, onPickJs, emptyText, collapsed) {
    if (!candidates.length) return '<p class="jf-optional">' + esc(emptyText || "Nothing available to link.") + '</p>';
    return '<div class="jf-picker' + (collapsed ? ' jf-picker-collapsed' : '') + '" id="' + esc(id) + '">' +
      '<input type="text" placeholder="' + esc(placeholder) + '" oninput="filterPicker(this)" onkeydown="pickerKeydown(event, this)" aria-label="' + esc(placeholder) + '">' +
      '<div class="jf-picker-list">' + candidates.map(function (c) {
        return '<button type="button" data-pick-title="' + esc(String(c.title || "").toLowerCase()) + '" onclick="' + onPickJs + '(' + escAttrJs(c.id) + ')"><span class="jf-pick-title">' + esc(c.icon ? c.icon + " " : "") + esc(c.title) + '</span>' + (c.meta ? '<span class="jf-pick-meta">' + esc(c.meta) + '</span>' : '') + '</button>';
      }).join("") + '</div><div class="jf-picker-empty">No match.</div></div>';
  }
  window.filterPicker = function (input) {
    var q = String(input.value || "").trim().toLowerCase();
    var list = input.parentNode.querySelector(".jf-picker-list");
    if (!list) return;
    Array.prototype.forEach.call(list.children, function (btn) {
      btn.hidden = !!q && (btn.getAttribute("data-pick-title") || "").indexOf(q) === -1;
    });
  };
  // Enter picks the first visible match, so the whole thing works from the keyboard.
  window.pickerKeydown = function (ev, input) {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    var list = input.parentNode.querySelector(".jf-picker-list");
    var first = list && Array.prototype.find.call(list.children, function (b) { return !b.hidden; });
    if (first) first.click();
  };
  function pickerCandidates(entries) {
    return entries.map(function (e) {
      var cat = categoryMeta(primaryCategory(e));
      return { id: e.id, title: e.title, icon: cat.icon || "", meta: isPlace(e) ? [e.prefecture, e.city].filter(Boolean).join(", ") : cat.label };
    });
  }

  function relationshipSection(entry) {
    // Built once per render of this section: relationExists() scans the whole
    // relationships array, which the two link pickers below would otherwise
    // repeat for every candidate entry.
    var relPairs = {};
    (state.relationships || []).forEach(function (r) {
      if (r) relPairs[r.placeId + "\u0000" + r.itemId] = true;
    });
    function alreadyLinked(placeId, itemId) { return !!relPairs[placeId + "\u0000" + itemId]; }
    if (isItem(entry)) {
      var products = productsForItem(entry.id);
      var places = placesForItem(entry.id);
      var fields = fieldsForItem(entry);
      var catMeta = categoryMeta(primaryCategory(entry));
      var fallbackIcon = catMeta.icon || "\uD83C\uDFF7\uFE0F";
      var productsHtml = products.length ? products.map(function(prod){
        var cover = prod.photos && prod.photos.length ? prod.photos[0] : null;
        var details = productDetailsHtml(prod, fields);
        return '<div class="jf-product-row" data-product-id="' + esc(prod.id) + '" style="padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start"' + productDragAttrs(prod, products.length > 1) + '>' +
          '<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px">' + productPositionHtml(prod, products.length, products.length > 1) + productStarHtml(prod) + '</div>' +
          '<div style="width:120px;flex:0 0 120px">' +
          (cover ? '<img src="' + esc(cover) + '" style="width:120px;height:120px;object-fit:cover;border-radius:4px;border:1px solid var(--line)">'
                 : '<div style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid var(--line);border-radius:4px;color:var(--ink-soft)">' + esc(fallbackIcon) + '</div>') +
          '</div><div style="flex:1;min-width:0"><strong style="display:block;margin-bottom:8px">' + esc(prod.name) + '</strong>' +
          '<div class="jf-product-details">' + details + '</div>' +
          (state.productDeleteConfirmId === prod.id
            ? '<div class="jf-confirm-row" style="margin-top:8px">Delete "' + esc(prod.name || "this product") + '" for good? <button class="link-btn danger" onclick="deleteProduct(' + escAttrJs(prod.id) + ')">Yes, delete</button> <button class="link-btn" onclick="cancelDeleteProduct()">Cancel</button></div>'
            : '<div style="margin-top:8px"><button class="link-btn" onclick="editProduct(' + escAttrJs(prod.id) + ')">Edit</button> <button class="link-btn" onclick="duplicateProduct(' + escAttrJs(prod.id) + ')" title="New product pre-filled from this one">Duplicate</button> <button class="link-btn" onclick="toggleProductTemplate(' + escAttrJs(prod.id) + ')">' + (prod.isTemplate ? 'Template \u2713' : 'Use as template') + '</button> <button class="link-btn danger" onclick="confirmDeleteProduct(' + escAttrJs(prod.id) + ')">Delete</button></div>') + '</div></div>';
      }).join('') : '<p class="jf-optional">No products added yet.</p>';

      var linkablePlaces = state.entries.filter(isPlace).filter(function(pl){
        return entryCategories(pl).some(function(c){ return LINKABLE_PLACE_CATEGORY_IDS.indexOf(c) !== -1; }) && !alreadyLinked(pl.id, entry.id);
      }).sort(byTitle);
      var placesHtml = places.length
        ? places.map(function(pl){ return '<span class="jf-tag">\uD83D\uDCCD '+esc(pl.title)+' <button class="link-btn" onclick="unlinkItemFromPlace('+escAttrJs(pl.id)+','+escAttrJs(entry.id)+')" aria-label="Unlink">\u00d7</button></span>'; }).join('')
        : '<p class="jf-optional">No linked shops or places yet.</p>';
      var linkPicker = '<div style="margin-top:10px">' + searchPickerHtml("link-place-picker", "Type to find a place to link\u2026", pickerCandidates(linkablePlaces),
        "linkItemToPlace.bind(null," + escAttrJs(entry.id) + ")", "No unlinked places available.") + '</div>';

      // Products and the places that carry the item are two different
      // questions about the same entry, and stacking them meant scrolling past
      // a long product list to reach the links. They are tabs now. While the
      // product editor is open the Products tab is forced, so an in-progress
      // edit cannot be hidden behind the other tab.
      var relatedTab = state.productEditor ? "products" : (state.relatedTab === "places" ? "places" : "products");
      function relTabBtn(id, label, count) {
        return '<button type="button" class="jf-rel-tab' + (relatedTab === id ? ' active' : '') + '"' +
          (state.productEditor && id !== "products" ? ' disabled title="Finish or cancel the product you are editing first"' : '') +
          ' onclick="setRelatedTab(' + escAttrJs(id) + ')" aria-pressed="' + (relatedTab === id) + '">' +
          esc(label) + '<span class="jf-rel-tab-count">' + count + '</span></button>';
      }

      // Controls sit above the list so a long product list never has to be
      // scrolled past to add another; the editor opens right under them.
      var productsPane =
        '<div class="jf-rel-pane"' + (relatedTab === "products" ? '' : ' hidden') + '>' +
        (state.productEditor ? '' :
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
          '<button class="btn btn-outline btn-sm" onclick="addProduct(' + escAttrJs(entry.id) + ')">+ Add product</button>' +
          (products.length ? '<button class="btn btn-outline btn-sm" onclick="openProductTable(' + escAttrJs(entry.id) + ')">\uD83D\uDCCA View product table</button>' : '') +
          '</div>') +
        (state.productEditor ? productEditorHtml(entry) : productsHtml) +
        '</div>';

      var placesPane =
        '<div class="jf-rel-pane"' + (relatedTab === "places" ? '' : ' hidden') + '>' +
        '<div class="jf-tags">' + placesHtml + '</div>' + linkPicker + '</div>';

      return '<div class="jf-related-section">' +
        '<div class="jf-rel-tabs" role="group" aria-label="Related records">' +
        relTabBtn("products", "Products", products.length) +
        relTabBtn("places", "Places that carry this", places.length) +
        '</div>' + productsPane + placesPane + '</div>';
    }
    if (!entryCategories(entry).some(function(c){return LINKABLE_PLACE_CATEGORY_IDS.indexOf(c)!==-1;})) return '';
    var items = itemsForPlace(entry.id);
    var itemsHtml = items.length ? items.map(function(i){ return '<span class="jf-tag">'+esc(categoryMeta(primaryCategory(i)).icon || "\uD83D\uDCCB")+' '+esc(i.title)+' <button class="link-btn" onclick="unlinkItemFromPlace('+escAttrJs(entry.id)+','+escAttrJs(i.id)+')" aria-label="Unlink">\u00d7</button></span>'; }).join('') : '<p class="jf-optional">No linked items yet.</p>';
    var itemChoices = state.entries.filter(isItem).filter(function(i){ return !alreadyLinked(entry.id, i.id); }).sort(byTitle);
    var options = itemChoices.map(function(i){ return '<option value="'+esc(i.id)+'">'+esc(i.title)+'</option>'; }).join('');
    return '<div class="jf-related-section"><h3>Items carried / associated</h3><div class="jf-tags">'+itemsHtml+'</div><div style="margin-top:8px">' +
      searchPickerHtml("link-item-picker", "Type to find an item to link\u2026", pickerCandidates(itemChoices), "linkSelectedItem.bind(null," + escAttrJs(entry.id) + ")", "No unlinked Items available.") + '</div></div>';
  }
  window.setRelatedTab = function (tab) {
    if (state.productEditor && tab !== "products") return;
    state.relatedTab = tab === "places" ? "places" : "products";
    rerenderModalOnly();
  };

  window.linkSelectedItem = function(placeId, itemId) {
    if (!itemId || relationExists(placeId, itemId)) return;
    state.relationships.push({id:makeId(),placeId:placeId,itemId:itemId});
    persistEntries(); render();
  };

function renderViewModal() {
    var entry = null;
    for (var i = 0; i < state.entries.length; i++) {
      if (state.entries[i].id === state.viewEntryId) { entry = state.entries[i]; break; }
    }
    if (!entry) return "";
    var cat = categoryMeta(primaryCategory(entry));
    var photos = entry.photos || [];
    
    var carouselHtml = "";
    if (photos.length === 0) {
      carouselHtml = '<div class="jf-carousel"><div class="jf-modal-nophoto" style="font-size:64px;color:' + cat.color + '">' + esc(cat.icon || cat.abbr) + '</div></div>';
    } else {
      var currIdx = state.carouselIndex % photos.length;
      var imgHtml = '<img src="' + esc(photos[currIdx]) + '" alt="' + esc(entry.title) + '">';
      var prevBtn = photos.length > 1 ? '<button class="jf-carousel-btn prev" onclick="prevCarousel(' + photos.length + ')" aria-label="Previous photo">❮</button>' : '';
      var nextBtn = photos.length > 1 ? '<button class="jf-carousel-btn next" onclick="nextCarousel(' + photos.length + ')" aria-label="Next photo">❯</button>' : '';
      var dotsHtml = "";
      if (photos.length > 1) {
        dotsHtml = '<div class="jf-carousel-dots">' + photos.map(function(_, idx) {
          return '<button class="jf-carousel-dot ' + (idx === currIdx ? 'active' : '') + '" onclick="setCarousel(' + idx + ')" aria-label="Go to photo ' + (idx+1) + '"></button>';
        }).join('') + '</div>';
      }
      carouselHtml = '<div class="jf-carousel">' + imgHtml + prevBtn + nextBtn + dotsHtml + '</div>';
    }

    var placeParts = [entry.city, entry.neighborhood, entry.location].filter(function (v) { return v; });
    var locationHtml = placeParts.length ? " \u00b7 \uD83D\uDCCD " + esc(placeParts.join(" · ")) : "";
    var statusText = !entry.status ? "" : (entry.type === "item" ? (entry.status === "tried" ? "✅ Tried" : "📌 Want to Try") : (entry.status === "want-to-go" ? "📌 Want to Go" : "✅ Visited"));
    var websiteUrl = safeWebsiteUrl(entry.website);
    var tabelogUrl = safeWebsiteUrl(entry.tabelogUrl);
    var listHtml = (entry.lists || []).map(function(id){ return listName(id); }).filter(Boolean).map(function(n){ return '<span class="jf-tag">📋 '+esc(n)+'</span>'; }).join("");
    var categoryTagsHtml = entryCategories(entry).map(function(id){ var c=categoryMeta(id); return '<span class="jf-tag">'+esc(c.icon || c.abbr)+' '+esc(c.label)+'</span>'; }).join("");
    var subcategoryTagsHtml = (entry.subcategories || []).map(function(id){ var sc=subcategoryMeta(id); return sc ? '<span class="jf-tag">'+esc(sc.icon || '')+' '+esc(sc.label)+'</span>' : ''; }).join("");
    var tabelogHtml = tabelogUrl ? '<a class="link-btn" href="' + esc(tabelogUrl) + '" target="_blank" rel="noopener noreferrer">Tabelog ↗</a>' : "";
    var websiteHtml = websiteUrl ? '<a class="link-btn" href="' + esc(websiteUrl) + '" target="_blank" rel="noopener noreferrer">Visit website ↗</a>' : "";
    var notesHtml = entry.notes ? '<p class="jf-modal-notes">' + esc(entry.notes).replace(/\n/g, "<br>") + "</p>" : "";
    var tagsHtml = "";
    if (entry.tags && entry.tags.length) {
      tagsHtml = '<div class="jf-tags">' + entry.tags.map(function (t) {
        return '<span class="jf-tag">' + esc(t) + "</span>";
      }).join("") + "</div>";
    }
    var deleteConfirmHtml = state.confirmingDelete
      ? '<div class="jf-confirm-row">Delete this entry for good? <button class="link-btn danger" onclick="deleteEntry(' + escAttrJs(entry.id) + ')">Yes, delete</button> <button class="link-btn" onclick="cancelDelete()">Cancel</button></div>'
      : "";
    return (
      '<div class="jf-modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="jf-modal' + (entry.type === "item" ? ' jf-modal-lg' : '') + '" tabindex="-1" role="dialog" aria-modal="true">' +
      '<div class="jf-modal-hero">' + carouselHtml +
      '<button class="jf-modal-close" onclick="closeModal()" aria-label="Close">\u2715</button>' +
      '<div class="jf-stamp jf-modal-stamp" style="color:' + esc(cat.color) + '" title="' + esc(cat.label) + '">' + esc(cat.icon || cat.abbr) + "</div></div>" +
      '<div class="jf-modal-body">' +
      '<h2 class="jf-modal-title">' + favStarHtml(entry, "jf-fav-inline") + esc(entry.title) + "</h2>" +
      '<div class="jf-tags">' + categoryTagsHtml + subcategoryTagsHtml + listHtml + '</div>' +
      '<p class="jf-modal-meta">' + [statusText, esc(cat.label) + locationHtml, formatDate(entry.dateAdded)].filter(Boolean).join(" \u00b7 ") + "</p>" +
      notesHtml + tagsHtml + tabelogHtml + websiteHtml +
      relationshipSection(entry) +
      (state.productEditor ? '' : '<div class="jf-modal-actions">' +
      '<button class="btn btn-outline" onclick="openEdit(' + escAttrJs(entry.id) + ')">Edit</button>' +
      '<button class="btn btn-outline" onclick="duplicateEntry(' + escAttrJs(entry.id) + ')" title="New entry pre-filled from this one, including products and links">Duplicate</button>' +
      '<button class="btn btn-outline' + (entry.isTemplate ? ' active' : '') + '" onclick="toggleTemplate(' + escAttrJs(entry.id) + ')" aria-pressed="' + !!entry.isTemplate + '">' + (entry.isTemplate ? 'Template \u2713' : 'Use as template') + '</button>' +
      (isPlace(entry) ? '<button class="btn btn-outline" onclick="showEntryOnMap(' + escAttrJs(entry.id) + ')">Show on map</button>' : '') +
      '<button class="btn btn-danger" onclick="confirmDelete()">Delete</button>' +
      "</div>" + deleteConfirmHtml) +
      "</div></div></div>"
    );

  // Links chosen in the form: chips for the current set plus a searchable

  // The filter bar's Export button opens this rather than downloading

  function renderFilteredExportModal() {

        // mapShowingSummary() is a complete sentence and already ends in a

        : set.base.length + " entr" + (set.base.length === 1 ? "y" : "ies") +
          ((state.bulkMode && selectedEntryIds().length && !state.mapMode) ? " selected \u2014 " : " match the current filters \u2014 ") + placeN + " place" + (placeN === 1 ? "" : "s") +
          " and " + itemN + " item" + (itemN === 1 ? "" : "s") + ".") +

  window.setScreenExportOption = function (key, value) {
    if (!(key in state.exportScreenOptions)) return;
    state.exportScreenOptions[key] = !!value;
    persistScreenExportOptions();
    rerenderModalOnly();
  };

  // What Export and Print in the filter bar act on. The map builds its pin set
  // through getMapPlacePoints(), which layers place rows and item rows in a way
  // the grid's filter does not, so asking the grid would produce a file that
  // disagreed with the screen.
  // In multi-select mode with anything ticked, exports and print sheets cover
  // the ticked entries only; otherwise everything the filters are showing.
  function currentScreenEntries() {
    if (state.mapMode) return getMapPlacePoints();
    var shown = getFilteredEntries();
    if (state.bulkMode && selectedEntryIds().length) return shown.filter(function (e) { return state.selectedIds[e.id]; });
    return shown;
  }

  // Everything that will be written for a filter-bar or map export, resolved
  // in one place so the dialog's counts and the download cannot disagree.
  //
  // By default places are exported as place rows only: the items found at each
  // place are named in that row's LinkedItems column, which is the listing the
  // export is for. Turning on "itemRows" instead pulls those items in as rows
  // of their own, with their product records, which makes the file
  // self-contained - both ends of every link are present, so re-importing into
  // a collection that has never seen the items still restores the links.
  function buildScreenExportSet() {
    var base = currentScreenEntries();
    var byId = {};
    base.forEach(function (e) { byId[e.id] = e; });

    var added = [];
    if (state.exportScreenOptions.itemRows) {
      var relIdx = buildRelationIndex();
      var allById = {};
      state.entries.forEach(function (e) { allById[e.id] = e; });
      base.forEach(function (e) {
        if (!isPlace(e)) return;
        linkedEntries(relIdx.byPlace[e.id], allById, isItem).forEach(function (it) {
          if (byId[it.id]) return;
          byId[it.id] = it;
          added.push(it);
        });
      });
    }

    var entries = base.concat(added);
    // Products travel with any item that is in the export, whether it was
    // already there or has just been added above.
    var itemIds = {};
    entries.forEach(function (e) { if (isItem(e)) itemIds[e.id] = true; });
    var products = (state.products || []).filter(function (p) { return itemIds[p.itemId]; });

    return { entries: entries, products: products, base: base, addedItems: added };
  }

  // How many items are named in the places' LinkedItems columns, and how many
  // of those are not already rows in the export. The first number describes the
  // listing; the second is what the itemRows option would add.
  function linkedItemCounts() {
    var base = currentScreenEntries();
    var relIdx = buildRelationIndex();
    var present = {};
    base.forEach(function (e) { present[e.id] = true; });
    var named = {}, extra = 0;
    base.forEach(function (e) {
      if (!isPlace(e)) return;
      (relIdx.byPlace[e.id] || []).forEach(function (id) {
        if (named[id]) return;
        named[id] = true;
        if (!present[id]) extra++;
      });
    });
    return { named: Object.keys(named).length, extra: extra };
  }

  window.openFilteredExport = function () {
    if (!currentScreenEntries().length) {
      state.importMessage = state.mapMode
        ? "There are no pins on the map \u2014 nothing to export."
        : "No entries match the current filters \u2014 nothing to export.";
      render();
      scheduleClearImportMessage();
      return;
    }
    state.modalMode = "export-filtered";
    render();
  };

  function renderExportModal() {
    var opt = state.exportCsvOptions;

    var photoCount = 0;
    sel.entries.forEach(function (e) { photoCount += (e.photos || []).length; });
    sel.products.forEach(function (p) { photoCount += (p.photos || []).length; });

    var placeCount = state.entries.filter(isPlace).length;
    var itemCount = state.entries.filter(isItem).length;
    var productCount = (state.products || []).length;

    function scopeButton(value, label, note) {
      return '<button type="button" class="jf-scope-btn' + (opt.scope === value ? ' active' : '') + '" ' +
        'onclick="setExportOption(\'scope\', ' + escAttrJs(value) + ')" aria-pressed="' + (opt.scope === value) + '">' +
        '<strong>' + esc(label) + '</strong><span>' + esc(note) + '</span></button>';

  function backupAgeText(savedAt) {
    var mins = Math.max(0, Math.round((Date.now() - savedAt) / 60000));
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute" : " minutes") + " ago";
    var hours = Math.round(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? " hour" : " hours") + " ago";
    var days = Math.round(hours / 24);
    return days + (days === 1 ? " day" : " days") + " ago";
  }

  function renderBackupModal() {

  // A CSV import is lossier than a JSON one, so it always confirms - even
  // when nothing conflicts - and says exactly what it found, what it will
  // rebuild and what it cannot.
  function renderCsvImportConfirmModal(p) {
    var r = p.report;
    var lines = [];
    function add(text) { lines.push('<li>' + text + '</li>'); }

    add('<strong>' + r.entries + '</strong> entr' + (r.entries === 1 ? 'y' : 'ies') +
      (r.products ? ' and <strong>' + r.products + '</strong> product record' + (r.products === 1 ? '' : 's') : '') + ' read.');
    if (r.conflicts) add('<strong>' + r.conflicts + '</strong> of them already exist under the same ID.');

    if (r.categories) {
      add('<strong>' + r.categories + '</strong> categor' + (r.categories === 1 ? 'y' : 'ies') +
        ' rebuilt from the schema file' +
        (r.categoriesNew ? ', ' + r.categoriesNew + ' of them new to this collection' : '') +
        ' \u2014 including field keys, options and subcategory IDs.');
    }
    if (r.schemaOrphanRows) add(r.schemaOrphanRows + ' schema group' + (r.schemaOrphanRows === 1 ? '' : 's') + ' skipped \u2014 fields or subcategories with no category row of their own.');
    if (r.schemaRowsSkipped) add(r.schemaRowsSkipped + ' schema row' + (r.schemaRowsSkipped === 1 ? '' : 's') + ' skipped for missing an ID or key.');

    if (r.photosRestored) add('<strong>' + r.photosRestored + '</strong> photo' + (r.photosRestored === 1 ? '' : 's') + ' will be restored from the zip.');
    if (r.photosNeedingZip) {
      add('<strong>' + r.photosNeedingZip + '</strong> photo' + (r.photosNeedingZip === 1 ? '' : 's') +
        ' cannot be restored because no zip was included. Records that already exist keep the photos they have; new records arrive without photos.');
    }
    if (r.photosMissing) add('<strong>' + r.photosMissing + '</strong> photo file' + (r.photosMissing === 1 ? ' is' : 's are') + ' named in the CSV but absent from the zip.');
    if (r.inlinePhotos) add(r.inlinePhotos + ' row' + (r.inlinePhotos === 1 ? '' : 's') + ' carried image data inline, from an older export, and will be used as-is.');

    if (r.linksResolved) add(r.linksResolved + ' place/item link' + (r.linksResolved === 1 ? '' : 's') + ' rebuilt by matching titles.');
    if (r.linksUnresolved) add(r.linksUnresolved + ' link' + (r.linksUnresolved === 1 ? '' : 's') + ' could not be rebuilt \u2014 the title matched nothing, or matched more than one entry.');
    if (r.listsCreated) add(r.listsCreated + ' list' + (r.listsCreated === 1 ? '' : 's') + ' will be created for list names not already in your collection.');
    if (r.idsGenerated) add(r.idsGenerated + ' row' + (r.idsGenerated === 1 ? '' : 's') + ' had no ID and will be added as new entries.');
    if (r.rowsSkipped) add(r.rowsSkipped + ' row' + (r.rowsSkipped === 1 ? '' : 's') + ' skipped for having no title.');
    if (r.productsOrphaned) add(r.productsOrphaned + ' product' + (r.productsOrphaned === 1 ? '' : 's') + ' skipped \u2014 the item they belong to is not in this import or your collection.');
    if (r.productsSkipped) add(r.productsSkipped + ' product row' + (r.productsSkipped === 1 ? '' : 's') + ' skipped for having no ItemID.');

    var orphanCols = Object.keys(r.orphanColumns);
    if (orphanCols.length) add('Product columns kept but not matched to any current field: ' + esc(orphanCols.join(', ')) + '.');
    var unknownCats = Object.keys(r.unknownCategories);
    if (unknownCats.length) add('Category IDs not defined in your collection: ' + esc(unknownCats.join(', ')) + '. Import the categories from a JSON export first if you need them.');
    if (r.valuesOffSchema) add(r.valuesOffSchema + ' product value' + (r.valuesOffSchema === 1 ? '' : 's') + ' did not match any option on its field and were kept as typed.');
    r.skippedFiles.forEach(function (f) { add('Skipped ' + esc(f) + '.'); });

    var actions = r.conflicts
      ? '<button class="btn btn-primary" onclick="confirmImportOverwrite(true)">Overwrite matching records &amp; import</button>' +
        '<button class="btn btn-outline" onclick="confirmImportOverwrite(false)">Keep existing, add new only</button>'
      : '<button class="btn btn-primary" onclick="confirmImportOverwrite(true)">Import</button>';

    return (
      '<div class="jf-modal-backdrop"><div class="jf-modal" tabindex="-1" role="dialog" aria-modal="true">' +
      '<div class="jf-modal-header"><h2>Import from CSV</h2></div>' +
      '<div class="jf-modal-body">' +
      (r.files.length ? '<p style="font-size:12px;color:var(--ink-soft);margin:0">Reading ' + esc(r.files.join(', ')) + '.</p>' : '') +
      '<ul style="font-size:13px;line-height:1.6;margin:10px 0 0;padding-left:18px">' + lines.join("") + '</ul>' +
      '<p style="font-size:11px;color:var(--ink-soft);margin:12px 0 0">Category definitions come from the <code>-categories.csv</code> file this app exports. A categories file from an older version held only a readable summary, with no field keys, and is skipped.</p>' +
      '<div class="jf-form-actions" style="margin-top:12px">' + actions +
      '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
      '</div></div></div></div>'
    );
  }

  function renderGridSection() {
