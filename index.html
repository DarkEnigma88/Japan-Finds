<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Finds</title>
<style>
  :root {
    --bg:#ddd3bc; --surface:#f3eee1; --surface-2:#ffffff; --ink:#211e1b; --ink-soft:#6b6355;
    --indigo:#2c4468; --moss:#66703f; --hanko:#a13a2d; --ochre:#8c6a32; --line:#c7bba0;
  }
  [data-theme="dark"] {
    --bg:#191c21; --surface:#232730; --surface-2:#2e3440; --ink:#e5e1d8; --ink-soft:#a29a8c;
    --indigo:#6084b5; --moss:#8b9958; --hanko:#cb5244; --ochre:#ba924e; --line:#3c4352;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.15) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(0,0,0,0.15) 0, transparent 40%);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; }
  .jf-subtitle, .jf-tab, .jf-card-meta, .jf-tag, label, .jf-optional, .jf-empty-sub, .jf-importmsg, .btn, .link-btn, .jf-empty-search, .jf-badge-status {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  button, input, textarea, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  button { cursor: pointer; }

  /* Header and filter bar stay put while the collection scrolls. The filter
     bar's offset is the measured header height, written to --jf-header-h
     after each render so wrapping on narrow screens is accounted for. */
  .jf-header { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; background: var(--bg); }
  .jf-filterbar-sticky { position: sticky; top: var(--jf-header-h, 0px); z-index: 39; background: var(--bg); border-bottom: 1px solid var(--line); }
  .jf-filterbar-sticky.is-static { position: static; }
  .jf-filter-tabs-wrap { flex-basis: 100%; display: flex; gap: 4px 16px; flex-wrap: wrap; align-items: center; }
  .jf-filter-tabs-wrap > .jf-tabs { margin-top: 0 !important; }
  .jf-filter-tabs-wrap[hidden] { display: none; }
  .jf-fav { background: none; border: 1px solid transparent; border-radius: 2px; color: var(--ink-soft); font-size: 18px; line-height: 1; padding: 2px 6px; }
  .jf-fav.on { color: var(--ochre); }
  .jf-fav:hover { border-color: var(--line); }
  .jf-fav-card { position: absolute; top: 8px; left: 8px; z-index: 3; background: rgba(243,238,225,.8); }
  [data-theme="dark"] .jf-fav-card { background: rgba(35,39,48,.85); }
  .jf-fav-inline { font-size: 22px; vertical-align: middle; margin-right: 6px; }
  .jf-fav-filter { align-self: center; }
  .jf-mode-toggle { align-self: center; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; border: 1px dashed var(--line); border-radius: 2px; background: transparent; color: var(--ink-soft); margin-right: 2px; }
  .jf-mode-toggle.on { border-style: solid; border-color: var(--indigo); color: var(--indigo); }
  .jf-row-toggle { background: none; border: none; color: var(--ink-soft); padding: 2px 6px; font-size: 12px; align-self: center; }
  .jf-row-toggle:hover { color: var(--ink); }
  .jf-drag-handle { cursor: grab; color: var(--ink-soft); user-select: none; padding: 0 6px; font-size: 16px; }
  .jf-product-row.drag-over { outline: 2px dashed var(--indigo); outline-offset: -2px; }
  .jf-note-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 18px; }
  .jf-note { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .jf-note-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .jf-note-head h3 { margin: 0; font-size: 18px; }
  .jf-note-body { margin: 0; font-size: 14px; line-height: 1.55; }
  .jf-note-thumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .jf-note-thumbs img { width: 72px; height: 72px; object-fit: cover; border: 1px solid var(--line); border-radius: 2px; }
  .jf-note-editor { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 18px; margin-top: 18px; }
  .jf-product-table th.jf-th-sort { cursor: pointer; user-select: none; }
  .jf-product-table th.jf-th-sort:hover { color: var(--indigo); }
  .jf-product-table th.jf-th-sort.on { color: var(--indigo); }
  .jf-pos-input { width: 52px; padding: 3px 4px; font-size: 12px; text-align: center; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); color: var(--ink); }
  @media (max-width: 700px) { .jf-filterbar-sticky { position: static; } }
  .jf-header-inner { max-width: 1360px; margin: 0 auto; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: nowrap; }
  .jf-brand { cursor: pointer; flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .jf-header-actions { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; flex: 0 0 auto; white-space: nowrap; }
  .jf-header-actions .btn { white-space: nowrap; }
  .jf-title { font-size: 28px; margin: 0; line-height: 1; }
  .jf-subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 6px 0 0; }

  .btn { border-radius: 2px; padding: 10px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; border: 1px solid transparent; }
  .btn-primary { background: var(--indigo); color: #ffffff; }
  .btn-outline { background: transparent; border-color: var(--line); color: var(--ink-soft); }
  .btn-outline:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { background: transparent; border-color: var(--hanko); color: var(--hanko); }
  .btn-sm { padding: 4px 8px; font-size: 10px; }

  .jf-banner { background: var(--surface); border-bottom: 1px solid var(--line); }
  .jf-banner-inner { max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .jf-banner-inner p { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .jf-banner-close { background: none; border: none; color: var(--ink-soft); font-size: 14px; flex-shrink: 0; }

  .jf-importmsg-wrap { max-width: 1360px; margin: 0 auto; padding: 16px 24px 0; }
  .jf-importmsg { display: inline-block; font-size: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); margin: 0; }
  .jf-errormsg { display: inline-block; font-size: 12px; padding: 8px 12px; border: 1px solid var(--hanko); border-radius: 2px; background: var(--surface); color: var(--hanko); margin: 0; }
  .jf-errormsg-wrap { max-width: 1360px; margin: 0 auto; padding: 16px 24px 0; display: flex; gap: 10px; align-items: center; }
  .jf-modal-nophoto { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .jf-card-noimg { display: flex; align-items: center; justify-content: center; }

  .jf-filterbar { max-width: 1360px; margin: 0 auto; padding: 16px 24px 14px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .jf-search { position: relative; flex: 1; max-width: 340px; }
  .jf-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; }
  .jf-search input { width: 100%; padding: 9px 12px 9px 32px; font-size: 14px; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); }
  .jf-tabs { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .jf-type-tabs { margin-top: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .jf-map-showing { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
  .jf-map-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 0; font-size: 12px; color: var(--ink-soft); }
  .jf-map-legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .jf-map-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--ink-soft); margin: 8px 0 0; }
  .jf-map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .jf-tab { padding: 7px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-radius: 2px; border: 1px solid var(--line); }
  .jf-tab-count { opacity: .7; }
  .jf-sort { display: flex; align-items: center; gap: 7px; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .jf-sort select { padding: 7px 28px 7px 9px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); color: var(--ink); font: inherit; }

  .jf-source-badge { display: inline-block; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 5px; border-radius: 2px; border: 1px solid var(--line); color: var(--ink-soft); font-weight: 400; vertical-align: middle; }
  .jf-source-badge.places { border-color: var(--moss); color: var(--moss); }
  .jf-usage-line { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 10px; opacity: .75; margin-top: 8px; }

  .jf-bulk-bar { max-width: 1360px; margin: 0 auto 14px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; }

  /* ---------- geographic ringfence ---------- */
  .jf-fence-chip { display: inline-flex; align-items: center; gap: 8px; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; border: 1px solid var(--indigo); color: var(--indigo); border-radius: 2px; background: color-mix(in srgb, var(--indigo) 10%, transparent); }
  .jf-fenced-list { max-width: 1360px; margin: 14px auto 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
  .jf-fenced-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .jf-fenced-head h3 { margin: 0; font-size: 14px; }
  .jf-fenced-list ul { list-style: none; margin: 0; padding: 0; }
  .jf-fenced-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .jf-fenced-dot { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
  .jf-fenced-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .jf-fenced-main strong { font-size: 14px; }
  .jf-fenced-dist { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .jf-fenced-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .jf-fenced-summary { max-width: 1360px; margin: 12px auto 0; padding: 8px 16px; font-size: 12px; color: var(--ink-soft); }
  @media (max-width: 600px) { .jf-fenced-row { flex-wrap: wrap; } .jf-fenced-actions { width: 100%; justify-content: flex-end; } }
  .jf-fence-panel { max-width: 1360px; margin: 14px auto 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
  .jf-fence-panel h3 { margin: 0 0 4px; font-size: 15px; }
  .jf-fence-section { padding: 12px 0; border-top: 1px solid var(--line); }
  .jf-fence-section:first-of-type { border-top: none; padding-top: 6px; }
  .jf-fence-section > strong { display: block; font-size: 12px; margin-bottom: 6px; }
  .jf-fence-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .jf-fence-row input[type="number"], .jf-fence-row select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12px; }
  .jf-fence-hint { font-size: 11px; color: var(--ink-soft); margin: 6px 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .jf-cluster-btn { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 2px; font-size: 12px; }
  .jf-cluster-btn:hover { border-color: var(--indigo); }
  .jf-cluster-btn small { display: block; color: var(--ink-soft); font-size: 10px; font-family: ui-monospace, monospace; margin-top: 2px; }
  .jf-spread { font-size: 12px; color: var(--ink-soft); margin: 0 0 0 10px; }
  .jf-spread:empty { display: none; }
  .jf-spread.wide { color: var(--hanko); font-weight: 600; }

  /* ---------- itinerary ---------- */
  .jf-itin-header { max-width: 1360px; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .jf-itin-title { font-size: 24px; margin: 0; }
  .jf-itin-sub { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .jf-itin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .jf-day { border: 1px solid var(--line); border-radius: 2px; background: var(--surface); margin-bottom: 18px; }
  .jf-day-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .jf-day-head input[type="text"] { flex: 1; min-width: 150px; padding: 7px 9px; font-size: 14px; border: 1px solid transparent; border-radius: 2px; background: transparent; color: var(--ink); font-family: Georgia, "Iowan Old Style", serif; }
  .jf-day-head input[type="text"]:hover, .jf-day-head input[type="text"]:focus { border-color: var(--line); background: var(--surface-2); }
  .jf-day-head input[type="date"] { padding: 6px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12px; }
  .jf-day-body { padding: 8px 14px 14px; }
  .jf-day-foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .jf-day-foot .warn { color: var(--hanko); font-weight: 600; }
  .jf-stop { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .jf-stop:last-child { border-bottom: none; }
  .jf-stop.dragging { opacity: .4; }
  .jf-stop.drop-target { box-shadow: inset 0 2px 0 var(--indigo); }
  .jf-stop-num { width: 24px; height: 24px; border-radius: 50%; background: var(--indigo); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: ui-monospace, monospace; cursor: grab; }
  .jf-stop-name { font-size: 14px; margin: 0; }
  .jf-stop-meta { font-size: 11px; color: var(--ink-soft); margin: 2px 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .jf-stop-meta .far { color: var(--hanko); }
  .jf-stop-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .jf-stop-actions select { padding: 3px 5px; font-size: 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); color: var(--ink); font-family: ui-monospace, monospace; }
  .jf-nocoord { font-size: 10px; color: var(--ochre); }
  .jf-unscheduled { border: 1px dashed var(--line); border-radius: 2px; padding: 14px; margin-bottom: 18px; background: var(--surface); }
  .jf-unscheduled h3 { margin: 0 0 2px; font-size: 15px; }

  .jf-main { max-width: 1360px; margin: 0 auto; padding: 32px 24px; }
  .jf-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 70px 0; }
  .jf-empty-icon { font-size: 40px; opacity: .35; }
  .jf-empty-title { font-size: 20px; margin: 0; }
  .jf-empty-sub { font-size: 12px; color: var(--ink-soft); max-width: 320px; margin: 0; }
  .jf-empty-search { text-align: center; padding: 70px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); display: block; }

  .jf-group-title { font-size: 18px; margin: 24px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 4px; color: var(--indigo); }
  .jf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .jf-card-icon-fallback { font-size: 64px; opacity: .78; }
  .jf-list-view { display: flex; flex-direction: column; gap: 8px; }
  .jf-list-row { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 2px; padding: 12px 14px; display: grid; grid-template-columns: 56px minmax(0,1fr) auto auto; gap: 16px; align-items: center; text-align: left; cursor: pointer; }
  .jf-list-row.bulk-mode { grid-template-columns: 24px 56px minmax(0,1fr) auto auto; gap: 12px; }
  .jf-fav-row { justify-self: end; }
  .jf-card.bulk-mode, .jf-list-row.bulk-mode { user-select: none; -webkit-user-select: none; }
  .jf-picker { border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); }
  .jf-picker input { width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 10px; font-size: 13px; color: var(--ink); }
  .jf-picker-list { max-height: 180px; overflow: auto; display: flex; flex-direction: column; }
  .jf-picker-list button { text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 7px 10px; font-size: 13px; color: var(--ink); display: flex; align-items: baseline; gap: 16px; width: 100%; }
  .jf-picker-list button .jf-pick-title { flex: 1 1 auto; min-width: 0; }
  .jf-picker-list button .jf-pick-meta { flex: 0 0 auto; margin-left: auto; font-size: 11px; color: var(--ink-soft); text-align: right; }
  .jf-picker-list button:hover { background: var(--surface); }
  .jf-picker-list button[hidden] { display: none; }
  .jf-picker-collapsed .jf-picker-list, .jf-picker-collapsed .jf-picker-empty { display: none; }
  .jf-picker-collapsed:focus-within .jf-picker-list { display: flex; }
  .jf-picker-collapsed:focus-within .jf-picker-list:not(:has(button:not([hidden]))) + .jf-picker-empty { display: block; }
  .jf-picker-collapsed input { border-bottom-color: transparent; }
  .jf-picker-collapsed:focus-within input { border-bottom-color: var(--line); }
  .jf-picker-empty { padding: 8px 10px; font-size: 12px; color: var(--ink-soft); display: none; }
  .jf-picker-list:not(:has(button:not([hidden]))) + .jf-picker-empty { display: block; }
  .jf-list-row.bulk-mode > div:first-child { display:flex; align-items:center; justify-content:center; }
  .jf-list-row:hover { background: var(--surface-2); }
  .jf-list-row.selected { border-color: var(--indigo); background: color-mix(in srgb, var(--indigo) 10%, var(--surface)); box-shadow: inset 3px 0 0 var(--indigo); }
  .jf-list-select-check { width:18px; height:18px; cursor:pointer; accent-color:var(--indigo); }
  .jf-list-icon { width: 56px; height: 48px; display:flex; align-items:center; justify-content:center; border-radius: 2px; border: 1px solid var(--line); font-size: 21px; background: var(--surface-2); overflow:hidden; }
  .jf-list-icon img { width:100%; height:100%; object-fit:cover; display:block; }
  .jf-list-icon.has-photo { border-radius: 2px; }
  .jf-list-main { min-width: 0; }
  .jf-list-title { margin:0 0 3px; font-size:15px; line-height:1.3; }
  .jf-list-meta { margin:0; color:var(--ink-soft); font-size:10px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jf-list-side { display:flex; flex-direction:column; align-items:flex-end; gap:4px; color:var(--ink-soft); font-size:10px; }
  .jf-view-toggle { display:flex; gap:4px; }
  .jf-view-toggle .btn.active { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .jf-card { cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 2px; overflow: hidden; padding: 0; display: flex; flex-direction: column; transition: transform .15s ease; width: 100%; color: inherit; position: relative; }
  .jf-card:hover { transform: rotate(-.6deg) translateY(-2px); }
  .jf-card.selected { border-color: var(--indigo); box-shadow: 0 0 0 2px var(--indigo); }
  .jf-card:focus-visible, .jf-list-row:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .jf-card-photo { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .jf-card-photo img { width: 100%; height: 100%; object-fit: cover; }

  /* Google's info window. In dark mode the panel, its little tail and the

  html[data-theme="dark"] .gm-style .gm-style-iw-c,
  html[data-theme="dark"] .gm-style .gm-style-iw-d {
    background: var(--surface) !important;
    color: var(--ink) !important;
    box-shadow: 0 2px 10px rgba(0,0,0,.55) !important;
  }
  html[data-theme="dark"] .gm-style .gm-style-iw-tc::after {
    background: var(--surface) !important;

  html[data-theme="dark"] .gm-style .gm-style-iw-c button.gm-ui-hover-effect > span,
  html[data-theme="dark"] .gm-style .gm-style-iw-c button.gm-ui-hover-effect > img {
    filter: invert(1);

  /* Google Maps puts the close button in its own header row (.gm-style-iw-chr).

  .jf-offline-map .jf-om-axis { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: var(--ink-soft); }

  /* ---------- print ---------- */

  .jf-print-sheet .jf-print-sub { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8.5pt; margin: 0 0 6mm; }
  .jf-print-sheet .jf-print-day { margin: 0 0 7mm; page-break-inside: avoid; break-inside: avoid; }
  .jf-print-sheet .jf-print-stop { display: flex; gap: 4mm; padding: 2mm 0; border-bottom: 1px dotted #999; page-break-inside: avoid; break-inside: avoid; }
  .jf-print-sheet .jf-print-num { flex: 0 0 9mm; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10pt; font-weight: 700; }
  .jf-print-sheet .jf-print-box { flex: 0 0 5mm; border: 1px solid #000; height: 4.5mm; margin-top: 0.8mm; }
  .jf-print-sheet .jf-print-body { flex: 1; }
  .jf-print-sheet .jf-print-name { font-weight: 700; }
  .jf-print-sheet .jf-print-meta { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8.5pt; color: #333; }
  .jf-print-sheet .jf-print-notes { font-size: 9.5pt; margin-top: 1mm; white-space: pre-wrap; }
  .jf-print-sheet .jf-print-foot { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8pt; color: #444; margin-top: 2mm; }
  .jf-print-sheet .jf-print-group { margin: 0 0 6mm; page-break-inside: auto; }
  .jf-print-sheet table.jf-print-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  .jf-print-sheet table.jf-print-table th { text-align: left; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8pt; text-transform: uppercase; border-bottom: 1px solid #000; padding: 1.5mm 2mm 1.5mm 0; }
  .jf-print-sheet table.jf-print-table td { padding: 1.5mm 2mm 1.5mm 0; border-bottom: 1px dotted #bbb; vertical-align: top; page-break-inside: avoid; break-inside: avoid; }

  @media print {
    @page { margin: 14mm; }
    body { background: #fff !important; background-image: none !important; color: #000 !important; }
    .jf-header-actions, .jf-filterbar, .jf-filterbar-sticky, .jf-bulk-bar, .jf-banner, .jf-offline-banner, .jf-fence-panel,
    .jf-views-panel, .jf-footer, .jf-modal-backdrop, .jf-importmsg-wrap, .jf-errormsg-wrap,
    .jf-itin-actions, .jf-stop-actions, .jf-day-head button, .jf-day-head select, .jf-view-toggle { display: none !important; }

    /* A sheet built by the Print buttons replaces the app entirely, so the
       printed page is the sheet rather than a screenshot of the interface.

    body.jf-printing #app { display: none !important; }

  /* A full-width row inside the filter bar. Used instead of a zero-height

  .jf-filterbar-row { flex-basis: 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- related section tabs ---------- */
  .jf-rel-tabs { display: flex; gap: 4px; margin: 0 0 14px; border-bottom: 1px solid var(--line); }
  .jf-rel-tab { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--ink-soft); font: inherit; font-size: 14px; cursor: pointer; margin-bottom: -1px; }
  .jf-rel-tab:hover:not(:disabled) { color: var(--ink); }
  .jf-rel-tab.active { color: var(--ink); border-bottom-color: var(--indigo); font-weight: 600; }
  .jf-rel-tab:disabled { opacity: .45; cursor: default; }
  .jf-rel-tab-count { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
  .jf-rel-tab.active .jf-rel-tab-count { background: color-mix(in srgb, var(--indigo) 14%, transparent); border-color: var(--indigo); color: var(--indigo); }
  .jf-rel-pane[hidden] { display: none; }

  .jf-product-search { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; }

  /* ---------- import panel ---------- */
  .jf-import-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 26px 18px; border: 2px dashed var(--line); border-radius: 4px; background: var(--surface-2); cursor: pointer; text-align: center; font-size: 26px; transition: border-color .15s, background .15s; }
  .jf-import-drop span { font-size: 13px; color: var(--ink-soft); }
  /* Children must not receive pointer events: a dragleave fires on the parent

  .jf-import-drop > * { pointer-events: none; }
  .jf-import-drop .jf-import-hint { font-size: 11px; max-width: 420px; }
  .jf-import-drop:hover, .jf-import-drop.active { border-color: var(--indigo); background: color-mix(in srgb, var(--indigo) 7%, transparent); }
  .jf-import-list { margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; }

  .jf-import-file:last-child { border-bottom: none; }

  .jf-import-kind { flex: 0 0 130px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .jf-import-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; word-break: break-all; }
  .jf-import-detail { font-size: 11px; color: var(--ink-soft); }

  /* ---------- export picker ---------- */
  .jf-export-picker { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }

  .jf-export-check span { display: flex; flex-direction: column; gap: 1px; }
  .jf-export-note { font-size: 11px; color: var(--ink-soft); font-weight: 400; }
  .jf-export-legend { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  .jf-export-divider { border-top: 1px solid var(--line); margin: 4px 0 2px; }
  .jf-scope-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .jf-scope-btn { flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; padding: 9px 11px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; }
  .jf-scope-btn strong { font-size: 13px; }
  .jf-scope-btn span { font-size: 11px; color: var(--ink-soft); }
  .jf-scope-btn:hover { border-color: var(--indigo); }
  .jf-scope-btn.disabled, .jf-scope-btn:disabled { opacity: .5; cursor: default; }
  .jf-scope-btn.disabled:hover, .jf-scope-btn:disabled:hover { border-color: var(--line); }
  .jf-scope-btn.active { border-color: var(--indigo); background: color-mix(in srgb, var(--indigo) 10%, transparent); }
  .jf-scope-btn.active strong { color: var(--indigo); }


  /* ---------- cloud sync ---------- */
  .jf-cloud-pill { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); border-radius: 2px; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; line-height: 1; }
  .jf-cloud-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); flex-shrink: 0; }
  .jf-cloud-pill[data-status="ok"] .jf-cloud-dot { background: var(--moss); }
  .jf-cloud-pill[data-status="syncing"] .jf-cloud-dot, .jf-cloud-pill[data-status="waiting"] .jf-cloud-dot, .jf-cloud-pill[data-status="paused"] .jf-cloud-dot { background: var(--ochre); }
  .jf-cloud-pill[data-status="error"] .jf-cloud-dot { background: var(--hanko); }
  .jf-cloud-pill[data-status="error"] { color: var(--hanko); border-color: var(--hanko); }
  .jf-cloud-menu { position: fixed; right: 12px; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); z-index: 46; width: min(300px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .jf-cloud-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  .jf-cloud-box { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; width: 100%; max-width: 420px; padding: 20px; margin: auto; }
  .jf-cloud-title { font-size: 20px; margin: 0 0 8px; }
  .jf-cloud-text { font-size: 13px; line-height: 1.45; color: var(--ink-soft); margin: 0 0 10px; }
  .jf-cloud-error { font-size: 13px; line-height: 1.45; color: var(--hanko); margin: 0 0 10px; }
  .jf-cloud-label { display: block; font-size: 11px; color: var(--ink-soft); margin: 0 0 12px; }
  .jf-cloud-input { display: block; width: 100%; margin-top: 4px; padding: 10px; font-size: 16px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; }
  .jf-cloud-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .jf-cloud-option { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .jf-cloud-option .btn { margin-bottom: 6px; }
  .jf-cloud-later { margin-top: 12px; }
  @media print { .jf-cloud-pill, .jf-cloud-menu, .jf-cloud-overlay { display: none !important; } }

<body>
<div id="app"></div>
<!-- Print sheets are built into this container and only become visible while
     body carries .jf-printing, so nothing here affects the on-screen app. -->
<div id="jf-print-root" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var DB_NAME = "JapanFindsDB";
  var DB_VERSION = 7;
  var STORE_NAME = "entries";
  var LIST_STORE_NAME = "lists";
  var BACKUP_STORE_NAME = "backups";
  var PRODUCT_STORE_NAME = "bottles"; // legacy store name kept so existing records survive the rename
  var RELATION_STORE_NAME = "relationships";
  var CATEGORY_STORE_NAME = "categories";
  var NOTE_STORE_NAME = "scrapbook";
  var FAVOURITES_LIST_ID = "favourites";

  // ---------- Category model ----------
  // Categories are user data, not constants: they live in IndexedDB, can be
  // created, edited and deleted, and each Item category carries the schema of
  // the product fields shown under an entry of that category.
  //
  // Shape:
  //   { id, label, abbr, icon, color,
  //     types: ["place"] | ["item"] | ["place","item"],
  //     linkable: Boolean,   // derived: true for every Place category
  //     tabelog: Boolean,    // Place only - offers the Tabelog URL field
  //     subcategories: [{ id, label, icon }],
  //     fields: [fieldDef],  // Item only - product fields
  //     builtIn: Boolean }   // shipped by default; still fully editable
  //
  // Field definition shape:
  //   { key, label, type, options: [String], allowOther: Boolean,
  //     placeholder: String }
  // type is one of FIELD_TYPES below.
  var FIELD_TYPES = [
    { id: "text", label: "Short text" },
    { id: "textarea", label: "Long text" },
    { id: "number", label: "Number" },
    { id: "price", label: "Price + currency" },
    { id: "select", label: "Dropdown" },
    { id: "date", label: "Date" }
  ];
  var CURRENCY_OPTIONS = ["JPY", "USD", "AUD", "EUR", "GBP"];
  var SAKE_STYLE_OPTIONS = ["Daiginjo","Junmai Daiginjo","Junmai Ginjo","Honjozo","Ginjo","Junmai Namagenshu","Shochu","Kijoshu"];
  var VOLUME_OPTIONS = ["720mL", "1L", "1.8L"];

  // The starting field set for any new Item category. It is copied into the
  // category record on creation, so editing it there never affects any other
  // category.
  function defaultProductFields() {
    return [
      { key: "price", label: "Price", type: "price", options: [], allowOther: false, placeholder: "e.g. 8,500" },
      { key: "size", label: "Size", type: "text", options: [], allowOther: false, placeholder: "e.g. 500mL" },
      { key: "notes", label: "Notes", type: "textarea", options: [], allowOther: false, placeholder: "Anything worth remembering about this product" }
    ];
  }

  function fieldDef(key, label, type, extra) {
    var f = { key: key, label: label, type: type, options: [], allowOther: false, placeholder: "" };
    if (extra) Object.keys(extra).forEach(function (k) { f[k] = extra[k]; });
    return f;
  }

  var DEFAULT_CATEGORIES = [
    { id: "clothing-store", label: "Clothing Stores", abbr: "CL", icon: "\uD83D\uDC55", color: "#2C4468", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "fine-dining", label: "Fine Dining", abbr: "FD", icon: "\uD83C\uDF7D\uFE0F", color: "#66703F", types: ["place"], linkable: true, tabelog: true, subcategories: [], fields: [] },
    { id: "casual-restaurants", label: "Casual Restaurants", abbr: "CR", icon: "\uD83C\uDF5C", color: "#A13A2D", types: ["place"], linkable: true, tabelog: true, subcategories: [], fields: [] },
    { id: "bars", label: "Bars", abbr: "BA", icon: "\uD83C\uDF78", color: "#7A4E2D", types: ["place"], linkable: true, tabelog: true, subcategories: [], fields: [] },
    { id: "cultural-spots", label: "Cultural Spots", abbr: "CS", icon: "\u26E9\uFE0F", color: "#806B3F", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "pastry-shops", label: "Pastry Shops", abbr: "PS", icon: "\uD83E\uDD50", color: "#9B6B5A", types: ["place"], linkable: true, tabelog: true, subcategories: [], fields: [] },
    { id: "snacks", label: "Snacks", abbr: "SN", icon: "\uD83C\uDF58", color: "#5C6B73", types: ["item"], linkable: false, tabelog: false,
      subcategories: [{ id: "savoury", label: "Savoury", icon: "\uD83E\uDD68" }, { id: "sweet", label: "Sweet", icon: "\uD83C\uDF6C" }],
      fields: defaultProductFields() },
    { id: "snack-shop", label: "Snack Shops", abbr: "SS", icon: "\uD83C\uDF6C", color: "#A56B45", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "wine-shop", label: "Wine Shops", abbr: "WS", icon: "\uD83C\uDF77", color: "#713F4D", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "sake-shop", label: "Sake Shops", abbr: "SK", icon: "\uD83C\uDF76", color: "#8C6A32", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "craft-shop", label: "Craft Shops", abbr: "CF", icon: "\uD83C\uDFFA", color: "#6B5B73", types: ["place"], linkable: true, tabelog: false, subcategories: [], fields: [] },
    { id: "crafts", label: "Crafts", abbr: "CX", icon: "\uD83C\uDFFA", color: "#6B5B73", types: ["item"], linkable: false, tabelog: false, subcategories: [], fields: defaultProductFields() },
    { id: "cafes-teahouses", label: "Cafes/Teahouses", abbr: "CT", icon: "\uD83C\uDF75", color: "#526B4F", types: ["place"], linkable: true, tabelog: true, subcategories: [], fields: [] },
    { id: "wines", label: "Wine Labels", abbr: "WI", icon: "\uD83C\uDF77", color: "#713F4D", types: ["item"], linkable: false, tabelog: false, subcategories: [],
      fields: [
        fieldDef("varietalBlend", "Varietal / Blend", "text", { placeholder: "e.g. Chardonnay" }),
        fieldDef("vintage", "Vintage", "text", { placeholder: "e.g. 2019" }),
        fieldDef("price", "Price", "price", { placeholder: "e.g. 8,500" }),
        fieldDef("size", "Size", "select", { options: VOLUME_OPTIONS.slice(), allowOther: true }),
        fieldDef("notes", "Notes", "textarea", { placeholder: "Anything worth remembering about this product" })
      ] },
    { id: "sakes", label: "Sake Labels", abbr: "SA", icon: "\uD83C\uDF76", color: "#8C6A32", types: ["item"], linkable: false, tabelog: false, subcategories: [],
      fields: [
        fieldDef("nameJapanese", "Designation (Japanese)", "text", { placeholder: "e.g. \u7360\u796D" }),
        fieldDef("style", "Style", "select", { options: SAKE_STYLE_OPTIONS.slice() }),
        fieldDef("polishing", "Polishing", "text", { placeholder: "e.g. 50%" }),
        fieldDef("price", "Price", "price", { placeholder: "e.g. 8,500" }),
        fieldDef("size", "Size", "select", { options: VOLUME_OPTIONS.slice(), allowOther: true }),
        fieldDef("varietalBlend", "Varietal / Blend", "text"),
        fieldDef("vintage", "Vintage", "text"),
        fieldDef("notes", "Notes", "textarea", { placeholder: "Anything worth remembering about this product" })
      ] },
    { id: "clothing-brands", label: "Clothing Brands", abbr: "CB", icon: "\uD83D\uDC5A", color: "#405C86", types: ["item"], linkable: false, tabelog: false, subcategories: [], fields: defaultProductFields() },
    { id: "other", label: "Other", abbr: "OT", icon: "\uD83E\uDDE9", color: "#777777", types: ["place", "item"], linkable: true, tabelog: false, subcategories: [], fields: defaultProductFields() }
  ];

  // Live view of state.categories. Rebuilt in place by syncCategoryIndexes()
  // so every reader below keeps working exactly as it did when this was a
  // hard-coded constant.
  var CATEGORIES = [];
  var PLACE_CATEGORY_IDS = [];
  var ITEM_CATEGORY_IDS = [];
  var LINKABLE_PLACE_CATEGORY_IDS = [];
  var TABELOG_CATEGORY_IDS = [];
  var CATEGORY_SUBCATEGORIES = {};

  // --- IndexedDB Storage Helper ---
  var dbPromise = new Promise(function(resolve, reject) {
    var request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(LIST_STORE_NAME)) {
        db.createObjectStore(LIST_STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(BACKUP_STORE_NAME)) {
        db.createObjectStore(BACKUP_STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(PRODUCT_STORE_NAME)) {
        db.createObjectStore(PRODUCT_STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(RELATION_STORE_NAME)) {
        db.createObjectStore(RELATION_STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(CATEGORY_STORE_NAME)) {
        db.createObjectStore(CATEGORY_STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(NOTE_STORE_NAME)) {
        db.createObjectStore(NOTE_STORE_NAME, { keyPath: "id" });
      }
    };
    request.onsuccess = function(e) { resolve(e.target.result); };
    request.onerror = function(e) { reject(e.target.error); };
    // Without this, another tab holding an older DB version blocks the open
    // request forever and every database call silently hangs behind it.
    request.onblocked = function() {
      reject(new Error("Database upgrade blocked. Close other tabs running this app, then reload."));
    };
  }).then(function(db) {
    // Self-heal: if an earlier release created this database at the current
    // version number but without every store, onupgradeneeded never fires and
    // reads/writes to the missing store throw - which silently lost links and
    // product records. Reopen one version higher to force the stores in.
    var required = [STORE_NAME, LIST_STORE_NAME, BACKUP_STORE_NAME, PRODUCT_STORE_NAME, RELATION_STORE_NAME, CATEGORY_STORE_NAME, NOTE_STORE_NAME];
    var missing = required.filter(function(name) { return !db.objectStoreNames.contains(name); });
    if (!missing.length) return db;
    var nextVersion = (db.version || DB_VERSION) + 1;
    try { db.close(); } catch (e) {}
    return new Promise(function(resolve, reject) {
      var repair = indexedDB.open(DB_NAME, nextVersion);
      repair.onupgradeneeded = function(e) {
        var repaired = e.target.result;
        required.forEach(function(name) {
          if (!repaired.objectStoreNames.contains(name)) repaired.createObjectStore(name, { keyPath: "id" });
        });
      };
      repair.onsuccess = function(e) { resolve(e.target.result); };
      repair.onerror = function(e) { reject(e.target.error); };
      repair.onblocked = function() {
        reject(new Error("Database upgrade blocked. Close other tabs running this app, then reload."));
      };
    });
  });

  function dbGetAll() {
    return dbPromise.then(function(db) {
      return new Promise(function(resolve, reject) {

  // was no visited/tried date to show).
  function entryDateLabel(entry) {
    if (isPlace(entry) && entry.visitedDate) return "Visited " + formatDate(entry.visitedDate + "T12:00:00");
    if (isItem(entry) && entry.dateTried) return "Tried " + formatDate(entry.dateTried + "T12:00:00");
    return formatDate(entry.dateAdded);

  function makeId() {
    return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }

  // Number("") is 0, so an entry with a blank latitude/longitude used to read
  // as a perfectly valid coordinate at 0,0 - which put Items with no location
  // into the GeoJSON export and made them eligible for map pins and distance
  // sorting. Anything blank, non-numeric or out of range is NaN here.
  function coord(value, limit) {
    if (value === null || value === undefined) return NaN;
    var raw = String(value).trim();
    if (!raw) return NaN;
    var n = Number(raw);
    if (!Number.isFinite(n)) return NaN;
    if (limit && Math.abs(n) > limit) return NaN;
    return n;
  }

  function entryLng(e) { return coord(e && e.longitude, 180); }
  function hasCoords(e) { return Number.isFinite(entryLat(e)) && Number.isFinite(entryLng(e)); }

  // Calculate approximate distance between two coordinates in km (Haversine formula)
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  // Measuring storage means serializing every entry AND product (base64 photos
  // included on both), so the result is cached until the collection changes.
  // Products carry their own photos independently of the item they belong to,
  // so counting entries alone understated real usage.
  var storageBytesDirty = true;
  var storageBytesValue = 0;

  // Bounding box + centre of a set of entries. Entries without coordinates are
  // ignored rather than treated as (0,0), which would drag every box into the
  // Gulf of Guinea.
  function boundsOfEntries(list) {
    var pts = (list || []).filter(hasCoords);
    if (!pts.length) return null;
    var north = -90, south = 90, east = -180, west = 180;
    pts.forEach(function (e) {
      var la = entryLat(e), ln = entryLng(e);
      if (la > north) north = la;
      if (la < south) south = la;
      if (ln > east) east = ln;
      if (ln < west) west = ln;

  // How far apart the pins are, as the diagonal of their bounding box. This is
  // O(n) rather than the O(n^2) of a true maximum pairwise distance, and for a
  // "are these too scattered?" warning the difference does not matter.
  function spreadKm(list) {
    var b = boundsOfEntries(list);
    if (!b || b.count < 2) return 0;
    return getDistanceKm(b.south, b.west, b.north, b.east);

  // Distance from a centre out to the furthest member, used to size the circle
  // that represents a cluster.
  function radiusForEntries(list, lat, lng) {
    var max = 0;
    (list || []).filter(hasCoords).forEach(function (e) {
      var d = getDistanceKm(lat, lng, entryLat(e), entryLng(e));
      if (d > max) max = d;
    });
    return max;
  }

  // Single-linkage clustering: two places join the same cluster when they are
  // within thresholdKm of each other, so a chain of nearby places forms one
  // walkable area rather than being split by an arbitrary centre point.
  function computeClusters(list, thresholdKm) {
    var pts = (list || []).filter(hasCoords);
    var n = pts.length;
    if (!n) return [];
    var parent = [];
    for (var i = 0; i < n; i++) parent[i] = i;
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; }

    for (var x = 0; x < n; x++) {
      for (var y = x + 1; y < n; y++) {
        var d = getDistanceKm(entryLat(pts[x]), entryLng(pts[x]), entryLat(pts[y]), entryLng(pts[y]));
        if (d <= thresholdKm) union(x, y);
      }
    }

    var buckets = {};
    for (var k = 0; k < n; k++) {
      var root = find(k);
      if (!buckets[root]) buckets[root] = [];
      buckets[root].push(pts[k]);

    var clusters = Object.keys(buckets).map(function (key) {
      var members = buckets[key];
      var b = boundsOfEntries(members);
      // Name the area after whatever the places agree on. City is used
      // instead of neighborhood because Japan's neighborhood data is
      // sometimes just a chome number rather than a name.
      var label = commonFieldLabel(members, "city") || "";
      return {
        id: "cluster-" + key,
        ids: members.map(function (e) { return e.id; }),
        count: members.length,
        lat: b.lat, lng: b.lng,
        radiusKm: Math.max(radiusForEntries(members, b.lat, b.lng), 0.15),
        spreadKm: spreadKm(members),
        label: label
      };
    });

    clusters.sort(function (a, b) { return b.count - a.count; });

    // Two groups in the same city agree on the city and nothing else, so both
    // arrive here with the same name. An unnamed or duplicated label is
    // qualified with a place inside it, which is what makes the areas
    // distinguishable in the picker.
    var seen = {};
    clusters.forEach(function (c, idx) {
      var anchor = "";
      var members = state.entries.filter(function (e) { return c.ids.indexOf(e.id) !== -1; });
      if (members.length) {
        var nb = (members[0].neighborhood || "").trim();
        anchor = (!isBareNumber(nb) && nb) || members[0].title || "";
        anchor = anchor.trim();
      }
      if (!c.label) {
        c.label = anchor || ("Area " + (idx + 1));
      } else if (seen[c.label.toLowerCase()]) {
        c.label = anchor ? c.label + " \u2014 near " + anchor : c.label + " (" + (idx + 1) + ")";
      }
      seen[c.label.toLowerCase()] = true;
    });
    return clusters;
  }

  // Japan's finer sublocality levels (chome/block numbers) sometimes come
  // back from the geocoder as a bare number with no name attached, e.g. "8".
  // A number on its own is never a usable area name, so it's treated as
  // if the geocoder returned nothing.
  function isBareNumber(v) {
    return /^\d+$/.test((v || "").trim());

  // The most common non-empty value of a field, but only when it covers at
  // least half the members - otherwise the label would misrepresent the group.
  function commonFieldLabel(members, field) {
    var counts = {}, best = "", bestN = 0;
    members.forEach(function (e) {
      var v = (e[field] || "").trim();
      if (!v) return;
      counts[v] = (counts[v] || 0) + 1;
      if (counts[v] > bestN) { bestN = counts[v]; best = v; }

    return bestN >= Math.ceil(members.length / 2) ? best : "";

  // The fence only ever hides entries that HAVE coordinates and fall outside
  // it. Items and un-located places are never hidden by geography, because
  // silently dropping records with nothing to compare against would look like
  // data loss.
  function entryInFence(e) {
    var f = state.geoFence;
    if (!f) return true;
    if (!hasCoords(e)) return true;
    var la = entryLat(e), ln = entryLng(e);
    if (f.mode === "cluster") return (f.ids || []).indexOf(e.id) !== -1;
    if (f.mode === "box") {
      return la <= f.north && la >= f.south && ln <= f.east && ln >= f.west;
    }
    if (f.mode === "radius") {
      return getDistanceKm(f.lat, f.lng, la, ln) <= f.radiusKm;
    }
    return true;
  }

  function unlocatedCount(list) {

  }

  function fenceDescription() {
    var f = state.geoFence;
    if (!f) return "";
    if (f.mode === "radius") return "within " + formatKm(f.radiusKm) + " of " + (f.label || "a point");
    if (f.mode === "box") return "inside " + (f.label || "the drawn box");
    if (f.mode === "cluster") return (f.label || "a cluster") + " (" + (f.ids || []).length + " places)";
    return "";

  function formatKm(km) {

    if (km < 10) return km.toFixed(1) + " km";
    return Math.round(km) + " km";
  }

  // Greedy nearest-neighbour ordering. Not the optimal route, but it turns a
  // list entered in whatever order the user typed into something walkable, and
  // it costs nothing - no Directions API call and no billing.
  // Entries with no coordinates cannot be sequenced, so they keep their
  // relative order and are appended at the end.
  function nearestNeighbourOrder(entryIds, startId) {
    var byId = {};
    state.entries.forEach(function (e) { byId[e.id] = e; });
    var located = [], unlocated = [];
    (entryIds || []).forEach(function (id) {
      var e = byId[id];
      if (!e) return;
      if (hasCoords(e)) located.push(e); else unlocated.push(id);

    if (located.length < 3) return located.map(function (e) { return e.id; }).concat(unlocated);

    var startIdx = 0;
    if (startId) {
      for (var i = 0; i < located.length; i++) if (located[i].id === startId) { startIdx = i; break; }
    }
    var remaining = located.slice();
    var current = remaining.splice(startIdx, 1)[0];
    var ordered = [current];
    while (remaining.length) {
      var bestI = 0, bestD = Infinity;
      for (var j = 0; j < remaining.length; j++) {
        var d = getDistanceKm(entryLat(current), entryLng(current), entryLat(remaining[j]), entryLng(remaining[j]));
        if (d < bestD) { bestD = d; bestI = j; }
      }
      current = remaining.splice(bestI, 1)[0];
      ordered.push(current);
    }
    return ordered.map(function (e) { return e.id; }).concat(unlocated);
  }

  }

  // tag goes, the current one is added (case-insensitive, no duplicates).
  function syncPrefectureTag(e, previousPrefecture) {

    }
